# Milabench Platform Configuration
# This file defines variables, index URLs, and the pin matrix for all backends.
# Variables use str.format() syntax: {var_name}

[vars]
cuda = "130"
rocm = "7.2"
torch = "2.10.0"
# CPU has no real version dimension; placeholder so [vllm.cpu] keys
# ("torch,backend_version") and compat conditions can address it.
cpu = "0"

# ─── Pin Discovery ────────────────────────────────────────────────────────────
# At pin time, milabench fetches the torch wheel index and discovers which
# (backend, torch) combinations actually have published wheels.
# No static matrix needed -- availability is determined from the index.

[pin.discovery]
torch_index = "https://download.pytorch.org/whl/torch/"
torch_min = "2.10"                          # only pin torch >= this version
backends = ["cuda", "rocm", "cpu"]          # which backends to discover
latest_patch_only = true                    # keep only latest patch per minor (2.12.1, not also 2.12.0)
platforms = ["manylinux_2_28_x86_64", "manylinux_2_28_aarch64"]  # pin for both arches
# python = "cp312"                         # auto-detected if omitted

# ─── CUDA Backend ─────────────────────────────────────────────────────────────

[cuda.indexes]
index-url = "https://pypi.org/simple"
extra-index-url = [
    "https://download.pytorch.org/whl/cu{cuda}",
    "https://flashinfer.ai/whl/cu{cuda}",
]
find-links = [
    "https://github.com/milabench/wheels/releases/expanded_assets/torch{torch_short}-cu{cuda}",
    "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html",
    "https://data.pyg.org/whl/torch-{torch}+cu{cuda}.html",
]

[cuda.constraints]
torch = ">=2.10"
voir = ">=0.2.23"
torchcompat = ">=1.0.0"
datasets = ">=3.5.1"
navix = ">=0.7.1"
gymnax = ">=0.0.8"
# pydantic 1.10 breaks on Python 3.12.4+ (ForwardRef.recursive_guard)
pydantic = ">=2,<3"

# ─── ROCm Backend ─────────────────────────────────────────────────────────────

[rocm.indexes]
index-url = "https://pypi.org/simple"
extra-index-url = [
    "https://download.pytorch.org/whl/rocm{rocm}",
    # torchcodec has no ROCm wheel; decode uses the CPU/FFmpeg build
    "https://download.pytorch.org/whl/cpu",
]
find-links = [
    "https://github.com/milabench/wheels/releases/expanded_assets/torch{torch_short}-rocm{rocm}",
]
[rocm.constraints]
voir = ">=0.2.23"
torchcompat = ">=1.0.0"
gymnax = ">=0.0.8"
# pydantic 1.10 breaks on Python 3.12.4+ (ForwardRef.recursive_guard)
pydantic = ">=2,<3"

# ─── CPU Backend ──────────────────────────────────────────────────────────────

[cpu.indexes]
index-url = "https://pypi.org/simple"
extra-index-url = [
    "https://download.pytorch.org/whl/cpu",
]
# Official +cpu vLLM wheels live on GitHub Releases, not PyPI. The find-links
# for the resolved version is injected automatically from [vllm.cpu] below
# (same mechanism as [vllm.cuda]/[vllm.rocm]) -- do not hardcode a URL here.

[cpu.constraints]
voir = ">=0.2.23"
torchcompat = ">=1.0.0"
pydantic = ">=2,<3"
# vLLM's own version pin comes from the [vllm.cpu] exact map below, not from
# a template here -- {vllm} is not a defined variable and previously caused
# `milabench install`/`milabench pin` to crash with KeyError('vllm') for
# every cpu backend, silently falling back to an unpinned, unconstrained
# `pip install vllm` that resolves the plain (CUDA-oriented) PyPI wheel.

# ─── HPU Backend ──────────────────────────────────────────────────────────────

[hpu.indexes]
index-url = "https://pypi.org/simple"

[hpu.constraints]
voir = ">=0.2.23"
torchcompat = ">=1.0.0"
gymnax = ">=0.0.8"
pydantic = ">=2,<3"

# ─── XPU Backend ──────────────────────────────────────────────────────────────

[xpu.indexes]
index-url = "https://pypi.org/simple"
extra-index-url = [
    "https://download.pytorch.org/whl/cpu",
    "https://pytorch-extension.intel.com/release-whl/stable/xpu/us/",
]

[xpu.constraints]
voir = ">=0.2.23"
torchcompat = ">=1.0.0"
gymnax = ">=0.0.8"
pydantic = ">=2,<3"

# ─── Compatibility Matrix ─────────────────────────────────────────────────────
# Keys: comma-separated conditions of the form "pkg_or_var specifier"
#   - Evaluated against torch + the *active* backend version only
#     (pin/install for rocm sees rocm, not cuda defaults from [vars], and vice versa)
#   - Multiple conditions are AND-ed together
# Values: version constraint applied to the package (the table name)
# First matching rule wins (checked top-to-bottom).

# Pre-0.17: C++ extensions locked 1:1 to a torch minor (pytorch/ao#2919).
# 0.17+: ABI-stable CUDA kernels for any torch 2.11+
#   (https://github.com/pytorch/ao/releases/tag/v0.17.0).
# Python API still supports the latest ~3 torch minors.
[compat.torchao]
"torch>=2.11" = ">=0.17"
"torch>=2.10,torch<2.11" = ">=0.16,<0.17"

[compat.torchcodec]
# No ROCm torchcodec wheel; PyPI's untagged Linux wheel is CUDA (libnvrtc).
# Force the CPU/FFmpeg build from download.pytorch.org/whl/cpu.
"rocm>=0,torch>=2.11" = "==0.15.0+cpu"
"rocm>=0,torch>=2.10,torch<2.11" = "==0.11.1+cpu"
"torch>=2.10,torch<2.11" = "<0.12"

[compat.mslk]
"torch>=2.12,torch<2.13" = ">=1.2,<1.3"
"torch>=2.11,torch<2.12" = ">=1.1,<1.2"
"torch>=2.10,torch<2.11" = ">=1.0,<1.1"

# PyG 2.7+ requires pyg-lib for radius_graph; no ROCm pyg-lib wheel.
# Keep 2.6.x which routes radius_graph through torch-cluster (shipped for ROCm).
[compat.torch-geometric]
"rocm>=0" = ">=2.6,<2.7"

# ─── vLLM ─────────────────────────────────────────────────────────────────────
# Exact map: (torch, backend_version) → installable version + wheel source.
# Do not --set vllm=...; unsupported pairs fail with the supported list.
# Each entry uses the verified compatible source (upstream or milabench).

[vllm.cuda]
"2.10.0,129" = { version = "0.19.1", find-links = "https://github.com/vllm-project/vllm/releases/expanded_assets/v0.19.1" }
"2.10.0,130" = { version = "0.19.1+cu130", find-links = "https://github.com/vllm-project/vllm/releases/expanded_assets/v0.19.1" }
"2.11.0,129" = { version = "0.26.0+cu129", find-links = "https://github.com/vllm-project/vllm/releases/expanded_assets/v0.26.0" }
"2.11.0,130" = { version = "0.26.0", find-links = "https://github.com/vllm-project/vllm/releases/expanded_assets/v0.26.0" }

[vllm.cpu]
# backend_version is the "cpu" placeholder from [vars] (always "0").
# Each entry verified against the wheel's own METADATA (Requires-Dist: torch==...).
"2.10.0,0" = { version = "0.19.1+cpu", find-links = "https://github.com/vllm-project/vllm/releases/expanded_assets/v0.19.1" }
"2.11.0,0" = { version = "0.26.0+cpu", find-links = "https://github.com/vllm-project/vllm/releases/expanded_assets/v0.26.0" }
"2.13.0,0" = { version = "0.27.1+cpu", find-links = "https://github.com/vllm-project/vllm/releases/expanded_assets/v0.27.1" }

[vllm.rocm]
# Official index: https://wheels.vllm.ai/rocm/{vllm}/{rocmNNN}/
"2.11.0,7.2.3" = { version = "0.26.0+rocm723", extra-index-url = "https://wheels.vllm.ai/rocm/0.26.0/rocm723/" }
"2.10.0,7.2.3" = { version = "0.23.0+rocm723", extra-index-url = "https://wheels.vllm.ai/rocm/0.23.0/rocm723/" }
"2.11.0,7.2" = { version = "0.26.0+rocm723", extra-index-url = "https://wheels.vllm.ai/rocm/0.26.0/rocm723/" }
"2.10.0,7.2" = { version = "0.23.0+rocm723", extra-index-url = "https://wheels.vllm.ai/rocm/0.23.0/rocm723/" }
"2.10.0,7.2.2" = { version = "0.22.1+rocm722", extra-index-url = "https://wheels.vllm.ai/rocm/0.22.1/rocm722/" }
"2.10.0,7.2.1" = { version = "0.20.2+rocm721", extra-index-url = "https://wheels.vllm.ai/rocm/0.20.2/rocm721/" }
"2.9.1,7.0.0" = { version = "0.18.1+rocm700", extra-index-url = "https://wheels.vllm.ai/rocm/0.18.1/rocm700/" }
"2.9.1,7.0" = { version = "0.18.1+rocm700", extra-index-url = "https://wheels.vllm.ai/rocm/0.18.1/rocm700/" }

# milabench wheel for pytorch.org torch 2.12 + rocm7.2 (no official wheels.vllm.ai match)
"2.12.0,7.2" = { version = "0.18.1+rocm7.2", find-links = "https://github.com/milabench/wheels/releases/expanded_assets/torch2.12-rocm7.2" }
"2.12.1,7.2" = { version = "0.18.1+rocm7.2", find-links = "https://github.com/milabench/wheels/releases/expanded_assets/torch2.12-rocm7.2" }
