# Milabench Platform Configuration
# This file defines variables, index URLs, and the pin matrix for all backends.
# Variables use str.format() syntax: {var_name}

[vars]
cuda = "130"
rocm = "7.2"
torch = "2.10.0"
# Default; overridden from [vllm.torch] for the selected torch unless --set vllm=...
vllm = "0.19.1"

# ─── Pin Discovery ────────────────────────────────────────────────────────────
# At pin time, milabench fetches the torch wheel index and discovers which
# (backend, torch) combinations actually have published wheels.
# No static matrix needed -- availability is determined from the index.

[pin.discovery]
torch_index = "https://download.pytorch.org/whl/torch/"
torch_min = "2.10"                          # only pin torch >= this version
backends = ["cuda", "rocm", "cpu"]          # which backends to discover
latest_patch_only = true                    # keep only latest patch per minor (2.12.1, not also 2.12.0)
platforms = ["manylinux_2_28_x86_64", "manylinux_2_28_aarch64"]  # pin for both arches
# python = "cp312"                         # auto-detected if omitted

# ─── CUDA Backend ─────────────────────────────────────────────────────────────

[cuda.indexes]
index-url = "https://pypi.org/simple"
extra-index-url = [
    "https://download.pytorch.org/whl/cu{cuda}",
    "https://flashinfer.ai/whl/cu{cuda}",
]
find-links = [
    "https://github.com/milabench/wheels/releases/expanded_assets/torch{torch_short}-cu{cuda}",
    "https://github.com/vllm-project/vllm/releases/expanded_assets/v{vllm}",
    "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html",
    "https://data.pyg.org/whl/torch-{torch}+cu{cuda}.html",
]

[cuda.constraints]
torch = ">=2.10"
voir = ">=0.2.23"
torchcompat = ">=1.0.0"
datasets = ">=3.5.1"
navix = ">=0.7.1"
gymnax = ">=0.0.8"
# pydantic 1.10 breaks on Python 3.12.4+ (ForwardRef.recursive_guard)
pydantic = ">=2,<3"

# ─── ROCm Backend ─────────────────────────────────────────────────────────────

[rocm.indexes]
index-url = "https://pypi.org/simple"
extra-index-url = [
    "https://download.pytorch.org/whl/rocm{rocm}",
    # torchcodec has no ROCm wheel; decode uses the CPU/FFmpeg build
    "https://download.pytorch.org/whl/cpu",
]
find-links = [
    "https://github.com/milabench/wheels/releases/expanded_assets/torch{torch_short}-rocm{rocm}",
]
[rocm.constraints]
voir = ">=0.2.23"
torchcompat = ">=1.0.0"
gymnax = ">=0.0.8"
# pydantic 1.10 breaks on Python 3.12.4+ (ForwardRef.recursive_guard)
pydantic = ">=2,<3"

# ─── CPU Backend ──────────────────────────────────────────────────────────────

[cpu.indexes]
index-url = "https://pypi.org/simple"
extra-index-url = [
    "https://download.pytorch.org/whl/cpu",
]

[cpu.constraints]
voir = ">=0.2.23"
torchcompat = ">=1.0.0"
pydantic = ">=2,<3"

# ─── HPU Backend ──────────────────────────────────────────────────────────────

[hpu.indexes]
index-url = "https://pypi.org/simple"

[hpu.constraints]
voir = ">=0.2.23"
torchcompat = ">=1.0.0"
gymnax = ">=0.0.8"
pydantic = ">=2,<3"

# ─── XPU Backend ──────────────────────────────────────────────────────────────

[xpu.indexes]
index-url = "https://pypi.org/simple"
extra-index-url = [
    "https://download.pytorch.org/whl/cpu",
    "https://pytorch-extension.intel.com/release-whl/stable/xpu/us/",
]

[xpu.constraints]
voir = ">=0.2.23"
torchcompat = ">=1.0.0"
gymnax = ">=0.0.8"
pydantic = ">=2,<3"

# ─── Compatibility Matrix ─────────────────────────────────────────────────────
# Keys: comma-separated conditions of the form "pkg_or_var specifier"
#   - Evaluated against torch + the *active* backend version only
#     (pin/install for rocm sees rocm, not cuda defaults from [vars], and vice versa)
#   - Multiple conditions are AND-ed together
# Values: version constraint applied to the package (the table name)
# First matching rule wins (checked top-to-bottom).

# Upstream matrix: https://github.com/pytorch/ao/issues/2919
#   0.16 ↔ torch 2.10 | 0.17 ↔ torch 2.11 | 0.18 ↔ torch 2.12
# Allow 0.17 on torch 2.12 for now (stable rocm index has no 0.18 yet).
[compat.torchao]
"torch>=2.12" = "<0.19"
"torch>=2.11,torch<2.12" = ">=0.17,<0.18"
"torch>=2.10,torch<2.11" = ">=0.16,<0.17"

[compat.torchcodec]
# No ROCm torchcodec wheel; PyPI's untagged Linux wheel is CUDA (libnvrtc).
# Force the CPU/FFmpeg build from download.pytorch.org/whl/cpu.
"rocm>=0,torch>=2.11" = "==0.15.0+cpu"
"rocm>=0,torch>=2.10,torch<2.11" = "==0.11.1+cpu"
"torch>=2.10,torch<2.11" = "<0.12"

[compat.mslk]
"torch>=2.12,torch<2.13" = ">=1.2,<1.3"
"torch>=2.11,torch<2.12" = ">=1.1,<1.2"
"torch>=2.10,torch<2.11" = ">=1.0,<1.1"

# ─── vLLM ─────────────────────────────────────────────────────────────────────
# Release matrix: PyPI requires_dist (torch), GitHub wheels (+cu / bare),
#                 https://wheels.vllm.ai/rocm/{vllm}/ (rocmNNN).
# bare wheel (no +cu tag) == untagged_cuda; the other published +cuXXX is the variant.
# Epoch flip: ≤0.19 bare≈cu129 +cu130 | ≥0.20 bare≈cu130 +cu129
# [vllm.torch] picks newest release for the active torch (unless --set vllm=...);
# {vllm_local} is "" when cuda == [vllm.untagged_cuda] for that release, else +cu{cuda}.

[compat.vllm]
# ROCm: milabench find-links ships +rocm{rocm} (not wheels.vllm.ai / +cuXXX).
# torch 2.12 + rocm7.2 → vllm-0.18.1+rocm7.2 on the milabench wheel release.
"rocm>=0,torch>=2.12,torch<2.13" = "==0.18.1+rocm{rocm}"
"rocm>=0" = "=={vllm}+rocm{rocm}"
"torch>=2.10" = "=={vllm}{vllm_local}"

# PyG 2.7+ requires pyg-lib for radius_graph; no ROCm pyg-lib wheel.
# Keep 2.6.x which routes radius_graph through torch-cluster (shipped for ROCm).
[compat.torch-geometric]
"rocm>=0" = ">=2.6,<2.7"

