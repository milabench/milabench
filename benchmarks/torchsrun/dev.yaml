# Local smoke config for torchsrun (override num_machines to match your system).
include:
  - ../../config/_defaults.yaml

torchsrun:
  inherits: _defaults
  definition: .
  install_group: torch
  weight: 0.0
  max_duration: 120
  tags:
    - multinode
    - diagnostic
    - nobatch
  plan:
    method: njobs
    n: 1
  num_machines: 2
  requires_capabilities:
    - "len(nodes) >= ${..num_machines}"
  voir:
    options:
      stop: 30
  argv:
    --repeats: 30
    --warmup: 5
    --size-mb: 64

torchsrun-nodes:
  inherits: torchsrun
  num_machines: 10
  requires_capabilities:
    - "len(nodes) >= ${..num_machines}"

torchsrun-20:
  inherits: torchsrun
  num_machines: 20
  requires_capabilities:
    - "len(nodes) >= ${..num_machines}"
