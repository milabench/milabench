# variable tracking, 4 hops through noise (lm-eval ruler_vt). Lengths and samples per length: the bench's `longctx` config key, see longctx_ruler.py
task: longctx_ruler_vt
tag:
  - longctx_ruler
dataset_path: ""
dataset_name: ""
output_type: generate_until
test_split: test
custom_dataset: !function longctx_ruler.variable_tracking
doc_to_text: "{{input}}"
doc_to_target: "{{outputs}}"
gen_prefix: "{{gen_prefix}}"
target_delimiter: " "
process_results: !function longctx_ruler.process_results
metric_list:
  - metric: "8192"
    aggregation: !function longctx_ruler.aggregate
    higher_is_better: true
  - metric: "16384"
    aggregation: !function longctx_ruler.aggregate
    higher_is_better: true
  - metric: "32768"
    aggregation: !function longctx_ruler.aggregate
    higher_is_better: true
  - metric: "65536"
    aggregation: !function longctx_ruler.aggregate
    higher_is_better: true
  - metric: "131072"
    aggregation: !function longctx_ruler.aggregate
    higher_is_better: true
  - metric: "262144"
    aggregation: !function longctx_ruler.aggregate
    higher_is_better: true
generation_kwargs:
  do_sample: false
  temperature: 0.0
  max_gen_toks: 30
  until: []
repeats: 1
metadata:
  version: 1.0
