# Local bring-up config for AllenAI open-instruct SFT.
# Modern Llama 3.x Instruct family at multiple sizes.
#
# Usage:
#   milabench install --config benchmarks/openinstruct/dev.yaml --select openinstruct-sft-1b
#   milabench prepare --config benchmarks/openinstruct/dev.yaml --select openinstruct-sft-1b
#   milabench run     --config benchmarks/openinstruct/dev.yaml --select openinstruct-sft-1b

include:
  - ../../config/_defaults.yaml

_openinstruct:
  inherits: _defaults
  definition: .
  enabled: true
  install_variant: unpinned
  install_group: torch
  weight: 0.0
  max_duration: 3600
  # Model load + tokenize exceeds default voir stop=60s.
  voir:
    options:
      stop: 900
  env:
    BEAKER_ASSIGNED_CPU_COUNT: '8'
    HF_DATASETS_NUM_PROC: '8'
  tags:
    - nlp
    - llm
    - openinstruct
  # Single job (not per_gpu) so we don't spawn 8× full SFT preprocess storms.
  plan:
    method: njobs
    n: 1
  argv:
    - --use_slow_tokenizer
    - --max_seq_length
    - 2048
    - --preprocessing_num_workers
    - 4
    - --per_device_train_batch_size
    - 1
    - --gradient_accumulation_steps
    - 2
    - --learning_rate
    - 5e-06
    - --lr_scheduler_type
    - linear
    - --warmup_ratio
    - 0.03
    - --weight_decay
    - 0.0
    - --num_train_epochs
    - 1
    - --max_train_steps
    - 30
    - --max_train_samples
    - 256
    - --logging_steps
    - 1
    - --model_revision
    - main
    - --dataset_mixer_list
    - allenai/tulu-3-sft-personas-algebra
    - 1.0
    - --checkpointing_steps
    - 10000
    - --skip_model_save
    - true
    - --push_to_hub
    - false
    - --try_auto_save_to_beaker
    - false
    - --try_launch_beaker_eval_jobs
    - false
    - --seed
    - 123

# --- Llama-3.2-1B-Instruct ---

openinstruct-sft-1b:
  inherits: _openinstruct
  tags:
    - monogpu
    - smoke
  env:
    HIP_VISIBLE_DEVICES: '0'
    ROCR_VISIBLE_DEVICES: '0'
  max_duration: 1200
  url: https://huggingface.co/meta-llama/Llama-3.2-1B-Instruct
  argv:
    - --model_name_or_path
    - meta-llama/Llama-3.2-1B-Instruct
    - --tokenizer_name
    - meta-llama/Llama-3.2-1B-Instruct
    - --use_slow_tokenizer
    - --max_seq_length
    - 1024
    - --preprocessing_num_workers
    - 4
    - --per_device_train_batch_size
    - 1
    - --gradient_accumulation_steps
    - 1
    - --learning_rate
    - 5e-06
    - --lr_scheduler_type
    - linear
    - --warmup_ratio
    - 0.03
    - --weight_decay
    - 0.0
    - --num_train_epochs
    - 1
    - --max_train_steps
    - 20
    - --max_train_samples
    - 128
    - --output_dir
    - output/sft_1b
    - --logging_steps
    - 1
    - --model_revision
    - main
    - --dataset_mixer_list
    - allenai/tulu-3-sft-personas-algebra
    - 1.0
    - --checkpointing_steps
    - 10000
    - --dataset_mix_dir
    - output/sft_1b
    - --exp_name
    - llama32-1b-instruct-sft
    - --seed
    - 123

