# --- Llama-3.1-70B-Instruct (multi-GPU DeepSpeed) ---

openinstruct-sft-70b-gpus:
  inherits: _openinstruct
  tags:
    - multigpu
  max_duration: 7200
  url: https://huggingface.co/meta-llama/Llama-3.1-70B-Instruct
  # Accelerate DeepSpeed (milabench reads these keys, not the nested deepspeed: map).
  use_deepspeed: true
  zero_stage: 3
  deepspeed_config_file: configs/ds_configs/stage3_no_offloading_accelerate.conf
