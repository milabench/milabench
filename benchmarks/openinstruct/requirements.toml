[common]
dependencies = [
    "voir",
    "torch",
    "transformers",
    "peft",
    "datasets",
    "beaker",
    "ray",
    "wandb",
    "deepspeed",
    "accelerate",
    "litellm",
    "langdetect",
    "absl-py",
    "immutabledict",
    "nltk",
    "ai2-olmo-core",
]

[cuda]
dependencies = [
    "flash-attn",
    # flash-attn-3 is flash-attn-2 with different arch support
    # Only pre-releases exist upstream (final 0.0.1 is a yanked placeholder), so the
    # specifier must name a pre-release or resolution finds no usable version.
    "flash-attn-4>=4.0.0b8",
]

[rocm]
dependencies = []

[hpu]
enabled = false

[xpu]
enabled = false
