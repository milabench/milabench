# vLLM-Omni (diffusion serving: image / video / audio, TTS). Its releases follow vLLM's: the vLLM version
# comes from platforms.toml ([vllm.cuda]: 0.32.0 for torch 2.15 + cu132 on x86_64, 0.33.0 for torch 2.14 +
# cu130, the aarch64 stack), vllm-omni is pinned to the matching release.
# Own venv (install_group homelab-omni): it pins diffusers / transformers of its own.

[common]
dependencies = [
    "voir>=0.2.19,<0.3",
    "torch",
    "vllm",
    "vllm-omni[kokoro]==0.32.0; platform_machine == 'x86_64'",
    "vllm-omni[kokoro]==0.33.0rc1; platform_machine == 'aarch64'",
    # VoxCPM 2's inference needs (voxcpm itself goes in --no-deps, tts/benchfile.py: its own list pins dill,
    # fsspec, omegaconf, tomlkit below this venv's and pulls gradio, funasr, modelscope, datasets for its app)
    "librosa==1.0.1",
    "decorator",
    "pooch",
    "scikit-learn>=1.6",
    "inflect",
    "addict",
    "simplejson",
    "sortedcontainers",
    "wetext",
]

[cuda]
dependencies = []

[rocm]
dependencies = []

[cpu]
enabled = false

[hpu]
enabled = false

[xpu]
# vLLM for XPU is provisioned by hand (see config/homelab/_base.yaml); add vllm-omni to that venv.
enabled = false
