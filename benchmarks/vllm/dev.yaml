# -----------------------------------------------------------------------------
# Multi-node Ray smoke configs (arch + total params + lowest dtype in the name)
# Naming: vllm-{arch}-{model}-{params}-{dtype}-nodes
#   params = total parameter count (e.g. 2.8t, 744b)
# -----------------------------------------------------------------------------

_vllm_nodes:
  inherits: _vllm
  num_machines: 2
  max_duration: 3600
  requires_capabilities:
    - "len(nodes) >= ${..num_machines}"
  plan:
    method: njobs
    n: 1
  tags:
    - multigpu
    - multinode
  client:
    argv:
      --dataset-name: random
      --num-prompts: 8
      --max-concurrency: 4
      --ready-check-timeout-sec: 3600
  server:
    argv:
      --distributed-executor-backend: ray
      --tensor-parallel-size: "{total_gpu_count}"
      --gpu-memory-utilization: 0.9

vllm-moe-kimi-k3-2.8t-mxfp4-nodes:
  inherits: _vllm_nodes
  tags:
    - moe
    - mxfp4
    - multinode
  url: https://huggingface.co/moonshotai/Kimi-K3
  client:
    argv:
      --model: moonshotai/Kimi-K3
  server:
    argv:
      moonshotai/Kimi-K3: true
      --trust-remote-code: true
      --enable-auto-tool-choice: true
      --tool-call-parser: kimi_k3
      --reasoning-parser: kimi_k3

vllm-moe-glm52-744b-bf16-nodes:
  inherits: _vllm_nodes
  tags:
    - moe
    - bf16
    - multinode
  url: https://huggingface.co/zai-org/GLM-5.2
  client:
    argv:
      --model: zai-org/GLM-5.2
  server:
    argv:
      zai-org/GLM-5.2: true
      --dtype: bfloat16
      --enable-auto-tool-choice: true
      --tool-call-parser: glm47
      --reasoning-parser: glm45

vllm-moe-glm52-744b-fp8-nodes:
  inherits: _vllm_nodes
  tags:
    - moe
    - fp8
    - multinode
  url: https://huggingface.co/zai-org/GLM-5.2-FP8
  client:
    argv:
      --model: zai-org/GLM-5.2-FP8
  server:
    argv:
      zai-org/GLM-5.2-FP8: true
      --kv-cache-dtype: fp8
      --enable-auto-tool-choice: true
      --tool-call-parser: glm47
      --reasoning-parser: glm45

# -----------------------------------------------------------------------------
# Single-node Ray bring-up with a modern LLM (Llama-3.1-8B-Instruct)
# -----------------------------------------------------------------------------

vllm-ray-smoke:
  inherits: _vllm
  enabled: true
  num_machines: 1
  max_duration: 1800
  tags:
    - smoke
    - ray
    - multigpu
  plan:
    method: njobs
    n: 1
  client:
    argv:
      --model: meta-llama/Llama-3.1-8B-Instruct
      --served-model-name: model
      --dataset-name: random
      --num-prompts: 16
      --max-concurrency: 8
      --ready-check-timeout-sec: 1200
      --label: milabench
      --backend: openai
  server:
    argv:
      meta-llama/Llama-3.1-8B-Instruct: true
      --served-model-name: model
      --dtype: bfloat16
      # TP=1 smoke first: TP=2 mp loads but EngineCore was cancelled mid-ready under
      # overlapping kills; Ray workers don't inherit the glibc-2.38 python wrapper.
      --tensor-parallel-size: 1
      --gpu-memory-utilization: 0.7

# -----------------------------------------------------------------------------
# Arch-specific serving stacks (same benchmark name, vendor-optimal server)
# -----------------------------------------------------------------------------

_serving:
  inherits: _vllm
  group: serving

  client:
    argv:
      --dataset-name: random
      --request-rate: inf
      --label: milabench
      --backend: openai
      --ready-check-timeout-sec: 3600
      --trust-remote-code: true

serving-moe-kimi-k3-mxfp4-gpus:
  inherits: _serving
  enabled: true
  num_machines: 1
  max_duration: 3600
  tags:
    - multigpu
    - moe
    - mxfp4
  plan:
    method: njobs
    n: 1
  requires_capabilities:
    - "arch in ('cuda', 'rocm')"
    - "gpu.get('count', 0) >= 8"
  url: https://huggingface.co/moonshotai/Kimi-K3

  client:
    argv:
      --num-prompts: 64
      --max-concurrency: 64

  variants:
    cuda:
      server:
        backend: vllm
        argv:
          moonshotai/Kimi-K3: true
          --trust-remote-code: true
          --tensor-parallel-size: "{gpu_count}"
          --max-model-len: 16384
          --gpu-memory-utilization: 0.9
      client:
        argv:
          --model: moonshotai/Kimi-K3

    rocm:
      server:
        backend: atom
        argv:
          --model: moonshotai/Kimi-K3
          -tp: "{gpu_count}"
          --kv_cache_dtype: fp8
          --trust-remote-code: true
          --max-model-len: 16384
          --max-num-seqs: 64
          --max-num-batched-tokens: 16384
          --gpu-memory-utilization: 0.93
          --block-size: 128
          --no-enable_prefix_caching: true
          --enforce-eager: true
          --online_quant_config: '{"global_quant_config":"ptpc_fp8","exclude_layer":["lm_head","model.embed_tokens","*self_attn.[qkv]_conv1d*","*self_attn.f_b_proj*","*block_sparse_moe.experts*","*block_sparse_moe.routed_expert_*","*vision_tower*","*mm_projector*"]}'
      client:
        argv:
          --model: moonshotai/Kimi-K3

# GLM-5.2 IndexShare (ATOM on ROCm — see ROCm/ATOM recipes/GLM-5.md)
serving-moe-glm52-fp8-gpus:
  inherits: _serving
  enabled: true
  num_machines: 1
  max_duration: 3600
  tags:
    - multigpu
    - moe
    - fp8
    - indexshare
  plan:
    method: njobs
    n: 1
  requires_capabilities:
    - "arch in ('cuda', 'rocm')"
    - "gpu.get('count', 0) >= 8"
  url: https://huggingface.co/zai-org/GLM-5.2-FP8
  env:
    AITER_QUICK_REDUCE_QUANTIZATION: INT4
    AITER_USE_FLYDSL_MOE_SORTING: '1'

  client:
    argv:
      --num-prompts: 640
      --max-concurrency: 64

  variants:
    cuda:
      server:
        backend: vllm
        argv:
          zai-org/GLM-5.2-FP8: true
          --tensor-parallel-size: "{gpu_count}"
          --kv-cache-dtype: fp8
          --enable-auto-tool-choice: true
          --tool-call-parser: glm47
          --reasoning-parser: glm45
      client:
        argv:
          --model: zai-org/GLM-5.2-FP8

    rocm:
      server:
        backend: atom
        argv:
          --model: zai-org/GLM-5.2-FP8
          -tp: "4"
          --kv_cache_dtype: fp8
          --no-enable_prefix_caching: true
          --max-num-seqs: 64
          --max-num-batched-tokens: 16384
          --enforce-eager: true
          --online_quant_config: '{"global_quant_config":"ptpc_fp8","layer_quant_config":{"model.layers.*.mlp.experts":"per_block_fp8"},"exclude_layer":["lm_head","model.embed_tokens","*.mlp.gate"]}'
      client:
        argv:
          --model: zai-org/GLM-5.2-FP8

# GLM-5.2 IndexShare MXFP4 (ATOM on MI355 — ROCm/ATOM recipes/GLM-5.md)
serving-moe-glm52-mxfp4-gpus:
  inherits: _serving
  enabled: true
  num_machines: 1
  max_duration: 3600
  tags:
    - multigpu
    - moe
    - mxfp4
    - indexshare
  plan:
    method: njobs
    n: 1
  requires_capabilities:
    - "arch == 'rocm'"
    - "gpu.get('count', 0) >= 4"
  url: https://huggingface.co/amd/GLM-5.2-MXFP4
  env:
    AITER_QUICK_REDUCE_QUANTIZATION: INT4
    AITER_USE_FLYDSL_MOE_SORTING: '1'

  client:
    argv:
      --num-prompts: 640
      --max-concurrency: 64

  variants:
    rocm:
      server:
        backend: atom
        argv:
          --model: amd/GLM-5.2-MXFP4
          -tp: "4"
          --kv_cache_dtype: fp8
          --no-enable_prefix_caching: true
          --max-num-seqs: 64
          --max-num-batched-tokens: 16384
          --enforce-eager: true
          --online_quant_config: '{"global_quant_config":"ptpc_fp8","exclude_layer":["lm_head","model.embed_tokens","*.mlp.gate","*expert*"]}'
      client:
        argv:
          --model: amd/GLM-5.2-MXFP4
