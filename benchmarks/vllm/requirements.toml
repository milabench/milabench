[common]
dependencies = [
    "voir>=0.2.19,<0.3",
    "torch",
    # Required for multi-node vLLM via milabench.commands.ray.RayCluster
    "ray",
]

[cuda]
dependencies = [
    # vLLM installed manually for now (platforms.toml [vllm.cuda] kept for later)
    # "vllm",
    # "vllm[bench]",
    # "vllm[audio]",
    "flashinfer-python",
    "flashinfer-cubin",
    # "flashinfer-jit-cache",
    "torchcodec",
]

[rocm]
dependencies = [
    # vLLM installed manually for now (platforms.toml [vllm.rocm] kept for later)
    # "vllm",
    # ATOM serving (serving-* benchmarks): install atom + amd-aiter wheels from the
    # milabench ROCm release (build with `make GPU_BACKEND=rocm atom`).
    # MoE EP may also need amd_mori.
    # "atom",
    # No ROCm torchcodec; platforms.toml pins torchcodec==*+cpu
    "torchcodec",
]

[cpu]
dependencies = [
    # Version (+cpu) comes from platforms.toml [cpu.constraints] / [compat.vllm]
    "vllm",
    "vllm[bench]",
]

[hpu]
enabled = false

[xpu]
enabled = false
