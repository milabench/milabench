[common]
dependencies = [
    "voir>=0.2.17,<0.3",
    "torch",
    "torch-geometric",
    "torch-cluster",
    "torch-sparse",
    "torch-scatter",
    "pandas",
    "rdkit",
    "numpy",
]

[cuda]
dependencies = [
    # PyG 2.7+ radius_graph needs pyg-lib (CUDA wheels on data.pyg.org)
    "pyg-lib",
]

[rocm]
# No pyg-lib ROCm wheel; platforms.toml pins torch-geometric>=2.6,<2.7
# so radius_graph uses torch-cluster instead.

[xpu]
enabled = false
