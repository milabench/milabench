# Does the full model fit on 200 GPUs at EP8 (memory at the chosen micro-batch), and how long does a run take?
# G1's configuration, 4 steps. The per-rank peak memory (rankstore, after step 1) is in the run data; if it does
# not fit, use the fallbacks above. The first full G1 run (-full-50n) decides whether the other full runs go ahead.
megatron-glm5-check-fit-50n:
  inherits: megatron-glm5-g1-ep8-aligned
  tags: [frozen, check, placement]
  max_duration: 2400
  argv:
    --train-iters: 4

megatron-glm5-check-fit-full-50n:
  inherits: megatron-glm5-g1-ep8-aligned-full
