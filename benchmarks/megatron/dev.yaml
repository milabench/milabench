megatron-glm5-tri-pp25-ep8-n50-gbs1024:
  inherits: _tri_glm5
  num_machines: 50
  argv: {<<: *tri_pp25, --global-batch-size: 1024}

# --- C: precision. TransformerEngine FP8 (e4m3) recipes, bf16 master weights, MoE token counts padded for the FP8
# grouped GEMM. On B200 blockwise needs no NVTE_FP8_BLOCK_SCALING_FP32_SCALES (Hopper only: the Rorqual _fp8 entries
# set it). mxfp8 is Blackwell only: main.py stops at once on an older GPU. workload.precision / precision_detail ---
_tri_fp8_tensorwise: &tri_fp8_tensorwise
  --fp8-format: e4m3
  --fp8-recipe: tensorwise
  --moe-router-padding-for-quantization: true
_tri_fp8_blockwise: &tri_fp8_blockwise
  --fp8-format: e4m3
  --fp8-recipe: blockwise
  --moe-router-padding-for-quantization: true
_tri_mxfp8: &tri_mxfp8
  --fp8-format: e4m3
  --fp8-recipe: mxfp8
  --moe-router-padding-for-quantization: true

megatron-glm5-tri-pp13-ep8-n13-gbs256-fp8-tensorwise:
  inherits: megatron-glm5-tri-pp13-ep8-n13-gbs256
  argv: {<<: *tri_fp8_tensorwise}
megatron-glm5-tri-pp13-ep8-n13-gbs256-fp8-blockwise:
  inherits: megatron-glm5-tri-pp13-ep8-n13-gbs256
  argv: {<<: *tri_fp8_blockwise}
megatron-glm5-tri-pp13-ep8-n13-gbs256-mxfp8:
  inherits: megatron-glm5-tri-pp13-ep8-n13-gbs256
  argv: {<<: *tri_mxfp8}
megatron-glm5-tri-pp13-ep8-n52-gbs1024-fp8-tensorwise:
  inherits: megatron-glm5-tri-pp13-ep8-n52-gbs1024
  argv: {<<: *tri_fp8_tensorwise}
megatron-glm5-tri-pp13-ep8-n52-gbs1024-fp8-blockwise:
  inherits: megatron-glm5-tri-pp13-ep8-n52-gbs1024
  argv: {<<: *tri_fp8_blockwise}
megatron-glm5-tri-pp13-ep8-n52-gbs1024-mxfp8:
  inherits: megatron-glm5-tri-pp13-ep8-n52-gbs1024
  argv: {<<: *tri_mxfp8}

# 39 nodes: for a 47-node window, in place of 52 (not run by default)
megatron-glm5-tri-pp13-ep8-n39-gbs768-fp8-tensorwise:
  inherits: megatron-glm5-tri-pp13-ep8-n39-gbs768
  argv: {<<: *tri_fp8_tensorwise}
megatron-glm5-tri-pp13-ep8-n39-gbs768-fp8-blockwise:
  inherits: megatron-glm5-tri-pp13-ep8-n39-gbs768
  argv: {<<: *tri_fp8_blockwise}
megatron-glm5-tri-pp13-ep8-n39-gbs768-mxfp8:
  inherits: megatron-glm5-tri-pp13-ep8-n39-gbs768
  argv: {<<: *tri_mxfp8}

# C-loss: 500 steps from the same seed and data, a realistic learning rate (warm-up 50, cosine to 1/10). The loss of
# every step comes from the last pipeline stage (`loss` events with `step`). Duration: BF16 took 28,004 s at 53.63 s per step, from 55.4 to 49.4 s over the run (job 1243850)
_tri_loss: &tri_loss
  --train-iters: 500
  --seed: 1234
  --lr: 3.0e-4
  --lr-warmup-iters: 50
  --lr-decay-style: cosine
  --min-lr: 3.0e-5
  --log-interval: 10
  # the first step's forward crosses 12 stages with cold kernel caches, ~52 s each: past Megatron's default 10 minutes (job 1243941)
  --distributed-timeout-minutes: 30
megatron-glm5-tri-loss-bf16-n13:
  inherits: megatron-glm5-tri-pp13-ep8-n13-gbs256
  # 8 h 30, 30 minutes under the job's limit (30_c.sh, 09:00:00): milabench stops the run itself and the job ends cleanly
  max_duration: 30600
  # 500 steps x 256 sequences x 8 slots = 1,024,000 slots. A slot takes ~2 documents (1024 tokens, ~700 per document): with a
  # stride of 4, 4.1 M documents and very few read twice. `data_loading` in the summary says how many, and if it wrapped
  data:
    samples: 4200000
    doc_stride: 4
  argv: {<<: *tri_loss}
# the same recipe again, to compare the FP8 vs BF16 gap with the noise: the same seed (scheduling, reduction order), another
# seed (initialization; the data order stays the same)
megatron-glm5-tri-loss-bf16-rep2-n13:
  inherits: megatron-glm5-tri-loss-bf16-n13
megatron-glm5-tri-loss-bf16-seed2-n13:
  inherits: megatron-glm5-tri-loss-bf16-n13
  argv: {--seed: 4321}
megatron-glm5-tri-loss-fp8-tensorwise-n13:
  inherits: megatron-glm5-tri-loss-bf16-n13
  argv: {<<: *tri_fp8_tensorwise}
megatron-glm5-tri-loss-fp8-blockwise-n13:
  inherits: megatron-glm5-tri-loss-bf16-n13
  argv: {<<: *tri_fp8_blockwise}
megatron-glm5-tri-loss-mxfp8-n13:
  inherits: megatron-glm5-tri-loss-bf16-n13
  argv: {<<: *tri_mxfp8}

# --- F1: checkpoint save then load (main.py `checkpoint:`), torch_dist format, into $TT_CKPT_DIR (set by the launcher,
# which deletes it after the load: one checkpoint on disk at a time). The save runs at step 10 of 20, so an async
# write overlaps 10 training steps; the load entries run 5 steps after loading. weights: model only (~2 bytes per
# parameter); full: + optimizer (FP32 master weights, BF16 moments here) and RNG ---
_tri_ckpt:
  inherits: megatron-glm5-tri-pp13-ep8-n13-gbs256
  tags: [trillium, full, checkpoint]
  # an 8.9 TB write (12.0 B/param measured on a truncated model x 744B) at 5.8 GB/s (worst case), an estimate: 26 min, with startup and steps around it
  max_duration: 7200
  checkpoint:
    dir: $TT_CKPT_DIR
    op: save
    content: weights
    mode: sync
    step: 10
  argv:
    # barriers wait for the slowest writer: 8.9 TB (estimate) does not fit Megatron's default 10 minutes
    --distributed-timeout-minutes: 120
_tri_ckpt_load: &tri_ckpt_load
  --train-iters: 5

megatron-glm5-tri-ckpt-weights-sync-save-n13:
  inherits: _tri_ckpt
megatron-glm5-tri-ckpt-weights-async-save-n13:
  inherits: _tri_ckpt
  checkpoint: {mode: async}
megatron-glm5-tri-ckpt-weights-load-n13:
  inherits: _tri_ckpt
  checkpoint: {op: load}
  argv: {<<: *tri_ckpt_load}
megatron-glm5-tri-ckpt-full-sync-save-n13:
  inherits: _tri_ckpt
  checkpoint: {content: full}
megatron-glm5-tri-ckpt-full-async-save-n13:
  inherits: _tri_ckpt
  checkpoint: {content: full, mode: async}
megatron-glm5-tri-ckpt-full-load-n13:
  inherits: _tri_ckpt
  checkpoint: {content: full, op: load}
  argv: {<<: *tri_ckpt_load}
# 39 nodes: for a 47-node window, in place of 52 (not run by default)
megatron-glm5-tri-ckpt-weights-sync-save-n39:
  inherits: megatron-glm5-tri-ckpt-weights-sync-save-n13
  num_machines: 39
  argv: {--global-batch-size: 768}
megatron-glm5-tri-ckpt-weights-async-save-n39:
  inherits: megatron-glm5-tri-ckpt-weights-async-save-n13
  num_machines: 39
  argv: {--global-batch-size: 768}
megatron-glm5-tri-ckpt-weights-load-n39:
  inherits: megatron-glm5-tri-ckpt-weights-load-n13
  num_machines: 39
  argv: {--global-batch-size: 768}
megatron-glm5-tri-ckpt-full-sync-save-n39:
  inherits: megatron-glm5-tri-ckpt-full-sync-save-n13
  num_machines: 39
  argv: {--global-batch-size: 768}
megatron-glm5-tri-ckpt-full-async-save-n39:
  inherits: megatron-glm5-tri-ckpt-full-async-save-n13
  num_machines: 39
  argv: {--global-batch-size: 768}
megatron-glm5-tri-ckpt-full-load-n39:
  inherits: megatron-glm5-tri-ckpt-full-load-n13
  num_machines: 39
  argv: {--global-batch-size: 768}
# Fallback if the full checkpoint does not fit at 13 nodes (a full save raised the training peak 1.5 x on H100, ~190 GiB
# against 180 GB, an estimate): the expert state over twice the GPUs, pp13-ep16, one copy on 26 nodes
_tri_ckpt_ep16:
  inherits: _tri_ckpt
  num_machines: 26
  argv:
    --expert-model-parallel-size: 16
    --global-batch-size: 512
megatron-glm5-tri-ckpt-full-ep16-sync-save-n26:
  inherits: _tri_ckpt_ep16
  checkpoint: {content: full}
megatron-glm5-tri-ckpt-full-ep16-async-save-n26:
  inherits: _tri_ckpt_ep16
  checkpoint: {content: full, mode: async}
megatron-glm5-tri-ckpt-full-ep16-load-n26:
  inherits: _tri_ckpt_ep16
  checkpoint: {content: full, op: load}
  argv: {<<: *tri_ckpt_load}
megatron-glm5-tri-ckpt-weights-sync-save-n52:
  inherits: megatron-glm5-tri-ckpt-weights-sync-save-n13
  num_machines: 52
  argv: {--global-batch-size: 1024}
megatron-glm5-tri-ckpt-weights-async-save-n52:
  inherits: megatron-glm5-tri-ckpt-weights-async-save-n13
  num_machines: 52
  argv: {--global-batch-size: 1024}
megatron-glm5-tri-ckpt-weights-load-n52:
  inherits: megatron-glm5-tri-ckpt-weights-load-n13
  num_machines: 52
  argv: {--global-batch-size: 1024}
megatron-glm5-tri-ckpt-full-sync-save-n52:
  inherits: megatron-glm5-tri-ckpt-full-sync-save-n13
  num_machines: 52
  argv: {--global-batch-size: 1024}
megatron-glm5-tri-ckpt-full-async-save-n52:
  inherits: megatron-glm5-tri-ckpt-full-async-save-n13
  num_machines: 52
  argv: {--global-batch-size: 1024}
megatron-glm5-tri-ckpt-full-load-n52:
  inherits: megatron-glm5-tri-ckpt-full-load-n13
  num_machines: 52
  argv: {--global-batch-size: 1024}

# --- pre-window checks on Rorqual (H100, 4 GPUs per node): the Trillium code paths on a truncated model ---
# 8 layers (1 dense + 7 MoE), 64 experts top-8, seq 4096, PP2 (5 / 3) x EP4: one copy = 2 nodes. Batch 16 per copy.
_tri_test:
  inherits: _tri_glm5
  tags: [trillium, full, smoke]
  num_machines: 2
  max_duration: 1500
  placement:
    gpus_per_node: 4
  model:
    argv:
      --num-layers: 8
      --moe-layer-freq: "[0]*1+[1]*7"
      --num-experts: 64
  argv:
    --seq-length: 4096
    --max-position-embeddings: 4096
    --pipeline-model-parallel-size: 2
    --decoder-first-pipeline-num-layers: 5
    --decoder-last-pipeline-num-layers: 3
    --expert-model-parallel-size: 4
    --global-batch-size: 16
    --train-iters: 10
megatron-glm5-tri-test-n2-gbs16:
  inherits: _tri_test
megatron-glm5-tri-test-n4-gbs32:
  inherits: _tri_test
  num_machines: 4
  argv: {--global-batch-size: 32}
megatron-glm5-tri-test-n4-gbs16:
  inherits: _tri_test
  num_machines: 4
megatron-glm5-tri-test-n2-gbs16-sel:
  inherits: _tri_test
  argv: {<<: *tri_sel}
# FP8 on H100: blockwise needs FP32 block scales there (as the Rorqual _fp8 entries); mxfp8 must stop at once
megatron-glm5-tri-test-n2-gbs16-fp8-tensorwise:
  inherits: _tri_test
  argv: {<<: *tri_fp8_tensorwise}
megatron-glm5-tri-test-n2-gbs16-fp8-blockwise:
  inherits: _tri_test
  env:
    NVTE_FP8_BLOCK_SCALING_FP32_SCALES: "1"
  argv: {<<: *tri_fp8_blockwise}
megatron-glm5-tri-test-n2-gbs16-mxfp8:
  inherits: _tri_test
  argv: {<<: *tri_mxfp8}
# C-loss in small: 50 steps, warm-up 5
megatron-glm5-tri-test-loss-bf16:
  inherits: _tri_test
  argv: {<<: *tri_loss, --train-iters: 50, --lr-warmup-iters: 5}
megatron-glm5-tri-test-loss-fp8-tensorwise:
  inherits: megatron-glm5-tri-test-loss-bf16
  argv: {<<: *tri_fp8_tensorwise}
# F1 in small
_tri_test_ckpt:
  inherits: _tri_test
  tags: [trillium, full, smoke, checkpoint]
  checkpoint:
    dir: $TT_CKPT_DIR
    op: save
    content: weights
    mode: sync
    step: 5
  argv:
    --distributed-timeout-minutes: 120
megatron-glm5-tri-test-ckpt-weights-sync-save:
  inherits: _tri_test_ckpt
megatron-glm5-tri-test-ckpt-weights-async-save:
  inherits: _tri_test_ckpt
  checkpoint: {mode: async}
megatron-glm5-tri-test-ckpt-weights-load:
  inherits: _tri_test_ckpt
  checkpoint: {op: load}
  argv: {<<: *tri_ckpt_load}
megatron-glm5-tri-test-ckpt-full-sync-save:
  inherits: _tri_test_ckpt
  checkpoint: {content: full}
megatron-glm5-tri-test-ckpt-full-async-save:
  inherits: _tri_test_ckpt
  checkpoint: {content: full, mode: async}
megatron-glm5-tri-test-ckpt-full-load:
  inherits: _tri_test_ckpt
  checkpoint: {content: full, op: load}
  argv: {<<: *tri_ckpt_load}
# Full load on 80 GB GPUs: it holds the loaded and the current optimizer state at once, PP2 x EP4 runs out of memory (Fir
# 2302534). Same model at half the state per GPU: PP2 x EP8, 4 nodes, one copy.
_tri_test_ckpt_ep8:
  inherits: _tri_test_ckpt
  num_machines: 4
  argv:
    --expert-model-parallel-size: 8
    --global-batch-size: 32
megatron-glm5-tri-test-ckpt-ep8-full-sync-save:
  inherits: _tri_test_ckpt_ep8
  checkpoint: {content: full}
megatron-glm5-tri-test-ckpt-ep8-full-async-save:
  inherits: _tri_test_ckpt_ep8
  checkpoint: {content: full, mode: async}
megatron-glm5-tri-test-ckpt-ep8-full-load:
  inherits: _tri_test_ckpt_ep8
  checkpoint: {content: full, op: load}
  argv: {<<: *tri_ckpt_load}
# --- B200, 2 nodes: the same truncated model on 8 GPUs per node, PP2 x EP8, one stage per node as pp13-ep8. The entries above
# assume 4 GPUs per node (the n2 ones would run 16 ranks at EP4, the ep8 ones want 4 nodes), and their blockwise sets the
# Hopper-only NVTE_FP8_BLOCK_SCALING_FP32_SCALES ---
_tri_test_b200:
  inherits: _tri_test
  placement: {gpus_per_node: 8}
  argv:
    --expert-model-parallel-size: 8
    --global-batch-size: 32
megatron-glm5-tri-test-b200-n2-gbs32:
  inherits: _tri_test_b200
megatron-glm5-tri-test-b200-n2-gbs32-fp8-tensorwise:
  inherits: _tri_test_b200
  argv: {<<: *tri_fp8_tensorwise}
megatron-glm5-tri-test-b200-n2-gbs32-fp8-blockwise:
  inherits: _tri_test_b200
  argv: {<<: *tri_fp8_blockwise}
megatron-glm5-tri-test-b200-n2-gbs32-mxfp8:
  inherits: _tri_test_b200
  argv: {<<: *tri_mxfp8}
# 32 micro-batches per data-parallel rank as pp13-ep8 at 256, long enough to read clocks and power
megatron-glm5-tri-test-b200-n2-gbs256:
  inherits: _tri_test_b200
  argv:
    --global-batch-size: 256
    --train-iters: 30
_tri_test_b200_ckpt:
  inherits: _tri_test_ckpt_ep8
  num_machines: 2
  placement: {gpus_per_node: 8}
megatron-glm5-tri-test-b200-ckpt-weights-sync-save:
  inherits: _tri_test_b200_ckpt
megatron-glm5-tri-test-b200-ckpt-weights-async-save:
  inherits: _tri_test_b200_ckpt
  checkpoint: {mode: async}
megatron-glm5-tri-test-b200-ckpt-weights-load:
  inherits: _tri_test_b200_ckpt
  checkpoint: {op: load}
  argv: {<<: *tri_ckpt_load}
megatron-glm5-tri-test-b200-ckpt-full-sync-save:
  inherits: _tri_test_b200_ckpt
  checkpoint: {content: full}
megatron-glm5-tri-test-b200-ckpt-full-async-save:
  inherits: _tri_test_b200_ckpt
  checkpoint: {content: full, mode: async}
megatron-glm5-tri-test-b200-ckpt-full-load:
  inherits: _tri_test_b200_ckpt
  checkpoint: {content: full, op: load}
  argv: {<<: *tri_ckpt_load}
# --- GLM-FP4 (scripts/trillium/glm-fp4/README.md): NVFP4 training. TransformerEngine's NVFP4BlockScaling with its
# defaults (random Hadamard transforms on the weight-gradient inputs, 16x16 weight blocks, stochastic rounding of the
# gradients), MoE token counts padded for it, and the last layers in BF16: 5 of 78, the last stage of pp13 (NVIDIA's
# report, arXiv 2509.25149: fewer than 15 %). workload.precision nvfp4 ---
_tri_nvfp4: &tri_nvfp4
  --fp4-format: e2m1
  --moe-router-padding-for-quantization: true
  --first-last-layers-bf16: true
  --num-layers-at-start-in-bf16: 0
  --num-layers-at-end-in-bf16: 5
# C-speed at 13 nodes beside the campaign's (megatron-glm5-tri-pp13-ep8-n13-gbs256 and its -mxfp8, the same job)
megatron-glm5-tri-pp13-ep8-n13-gbs256-nvfp4:
  inherits: megatron-glm5-tri-pp13-ep8-n13-gbs256
  argv: {<<: *tri_nvfp4}
# Step 2: the B200 smoke model (8 layers, 1 dense + 7 MoE, 64 experts, seq 4096) on one node, PP1 x EP8 (data parallel
# 8), batch 32, the C-loss settings in small (50 steps, warm-up 5). BF16 tail: the last layer, 1 of 8
_fp4_test_n1:
  inherits: _tri_test_b200
  num_machines: 1
  argv:
    <<: *tri_loss
    --train-iters: 50
    --lr-warmup-iters: 5
    --pipeline-model-parallel-size: 1
    --decoder-first-pipeline-num-layers: null
    --decoder-last-pipeline-num-layers: null
megatron-glm5-fp4-test-n1-bf16:
  inherits: _fp4_test_n1
megatron-glm5-fp4-test-n1-nvfp4:
  inherits: _fp4_test_n1
  argv: {<<: *tri_nvfp4, --num-layers-at-end-in-bf16: 1}
# the campaign's MXFP8 on the same model: its memory per quantized parameter against NVFP4's
megatron-glm5-fp4-test-n1-mxfp8:
  inherits: _fp4_test_n1
  argv: {<<: *tri_mxfp8}
# the NVFP4 one for 3 steps, for cuBLASLt's trace (glm-fp4/job.sbatch lt:ENTRY): which GEMMs ran in E2M1
megatron-glm5-fp4-test-n1-nvfp4-lt:
  inherits: megatron-glm5-fp4-test-n1-nvfp4
  # warm-up below the decay steps (Megatron asserts it, job 1270151)
  argv: {--train-iters: 3, --lr-warmup-iters: 1}
# Step 3: 4 nodes, the real stages of pp13-ep8: 24 layers (3 dense + 21 MoE), 256 experts, EP8, seq 8192, PP4 split
# 7 / 6 / 6 / 5 (pp13's first stage, two middle ones and its last), 256 sequences (32 micro-batches per data-parallel
# rank, as pp13-ep8), 8 steps: per-stage memory and step time next to the campaign's 13-node numbers. NVFP4: the BF16
# tail is the last stage, as in pp13
_fp4_glm5_n4:
  inherits: _tri_glm5
  num_machines: 4
  max_duration: 1200
  model:
    argv:
      --num-layers: 24
      --moe-layer-freq: "[0]*3+[1]*21"
  argv:
    --pipeline-model-parallel-size: 4
    --decoder-first-pipeline-num-layers: 7
    --decoder-last-pipeline-num-layers: 5
    --train-iters: 8
megatron-glm5-fp4-n4-bf16:
  inherits: _fp4_glm5_n4
megatron-glm5-fp4-n4-mxfp8:
  inherits: _fp4_glm5_n4
  argv: {<<: *tri_mxfp8}
megatron-glm5-fp4-n4-nvfp4:
  inherits: _fp4_glm5_n4
  argv: {<<: *tri_nvfp4}

# --- Qwen3 32B dense (GLM-FP4's second model; QW-CP reuses the entry with context parallelism): Megatron's own TE layer
# spec (model.spec default), random weights, FineWeb packed as the GLM entries (8 documents per sample), tokenized
# with Qwen3's tokenizer. 64 layers, hidden 5120, FFN 25600 (SwiGLU), 64 query and 8 KV heads of 128, QK-norm (RMSNorm
# per head), RoPE base 1e6, untied embeddings, vocab 151,936. Layout TP2 (sequence parallel) x PP2 (32 / 32 layers) x
# data parallel, no recompute: one copy is 4 GPUs. Optimizer as the GLM-5 runs (FP32 master weights, BF16 gradients
# and Adam moments). 8192 tokens per micro-batch, 16 micro-batches per data-parallel rank. NVFP4 keeps the last 4 of 64
# layers in BF16 (6 %, as GLM-5's 5 of 78) ---
_qwen3_32b:
  inherits: _megatron_glm5
  tags: [trillium, full, dense, qwen3]
  url: https://huggingface.co/Qwen/Qwen3-32B
  num_machines: 1
  max_duration: 1800
  frozen:
    preset: none
  placement:
    nodes: as-is
    gpus_per_node: 8
    a2a_timing: false
  data:
    samples: 200000
  model:
    hf: Qwen/Qwen3-32B
    hf_path: "{milabench_data}/megatron/qwen3-32b"
    spec: default
    argv:
      --moe-layer-freq: null
      --num-experts: null
      --moe-shared-expert-intermediate-size: null
      --moe-router-topk: null
      --moe-grouped-gemm: null
      --moe-permute-fusion: null
      --moe-ffn-hidden-size: null
      --moe-router-score-function: null
      --moe-router-pre-softmax: null
      --moe-router-enable-expert-bias: null
      --moe-router-bias-update-rate: null
      --moe-router-load-balancing-type: null
      --moe-router-topk-scaling-factor: null
      --moe-aux-loss-coeff: null
      --moe-router-dtype: null
      --moe-token-dispatcher-type: null
      --multi-latent-attention: null
      --q-lora-rank: null
      --kv-lora-rank: null
      --qk-head-dim: null
      --v-head-dim: null
      --qk-pos-emb-head-dim: null
      --enable-experimental: null
      --num-layers: 64
      --hidden-size: 5120
      --ffn-hidden-size: 25600
      --num-attention-heads: 64
      --group-query-attention: true
      --num-query-groups: 8
      --kv-channels: 128
      --rotary-base: 1000000
      --norm-epsilon: 1.0e-6
  argv:
    <<: *full_argv
    --vocab-size: 151936
    --tensor-model-parallel-size: 2
    --sequence-parallel: true
    --pipeline-model-parallel-size: 2
    --decoder-first-pipeline-num-layers: null
    --decoder-last-pipeline-num-layers: null
    --expert-model-parallel-size: 1
    --recompute-granularity: null
    --recompute-method: null
    --recompute-num-layers: null
    --global-batch-size: 32
    --train-iters: 20
    --log-interval: 5
    --distributed-timeout-minutes: 30
_qwen3_nvfp4: &qwen3_nvfp4
  --fp4-format: e2m1
  --first-last-layers-bf16: true
  --num-layers-at-start-in-bf16: 0
  --num-layers-at-end-in-bf16: 4
_qwen3_mxfp8: &qwen3_mxfp8
  --fp8-format: e4m3
  --fp8-recipe: mxfp8
# 1 node, 8 layers (4 per stage), 50 steps with the C-loss settings in small: the loss goes down, the label is right,
# and the memory per layer (BF16 tail: the last layer of 8)
_qwen3_test_n1:
  inherits: _qwen3_32b
  model:
    argv:
      --num-layers: 8
  argv:
    <<: *tri_loss
    --train-iters: 50
    --lr-warmup-iters: 5
megatron-qwen3-32b-test-n1-bf16:
  inherits: _qwen3_test_n1
megatron-qwen3-32b-test-n1-mxfp8:
  inherits: _qwen3_test_n1
  argv: {<<: *qwen3_mxfp8}
megatron-qwen3-32b-test-n1-nvfp4:
  inherits: _qwen3_test_n1
  argv: {<<: *qwen3_nvfp4, --num-layers-at-end-in-bf16: 1}
# full depth, speed: 1 node (data parallel 2, 32 sequences) and 4 nodes (data parallel 8, 128 sequences), 20 steps
megatron-qwen3-32b-n1-bf16:
  inherits: _qwen3_32b
megatron-qwen3-32b-n1-mxfp8:
  inherits: _qwen3_32b
  argv: {<<: *qwen3_mxfp8}
megatron-qwen3-32b-n1-nvfp4:
  inherits: _qwen3_32b
  argv: {<<: *qwen3_nvfp4}
_qwen3_32b_n4:
  inherits: _qwen3_32b
  num_machines: 4
  argv:
    --global-batch-size: 128
megatron-qwen3-32b-n4-bf16:
  inherits: _qwen3_32b_n4
megatron-qwen3-32b-n4-mxfp8:
  inherits: _qwen3_32b_n4
  argv: {<<: *qwen3_mxfp8}
megatron-qwen3-32b-n4-nvfp4:
  inherits: _qwen3_32b_n4
  argv: {<<: *qwen3_nvfp4}
# NVFP4 with no BF16 layer: what the BF16 tail costs on the last stage (the pipeline waits for it)
megatron-qwen3-32b-n1-nvfp4-tail0:
  inherits: megatron-qwen3-32b-n1-nvfp4
  argv: {--first-last-layers-bf16: null, --num-layers-at-start-in-bf16: null, --num-layers-at-end-in-bf16: null}
# 4096 tokens per micro-batch, 16 micro-batches per data-parallel rank as at 8192
_qwen3_32b_s4k:
  inherits: _qwen3_32b
  argv:
    --seq-length: 4096
    --max-position-embeddings: 4096
megatron-qwen3-32b-n1-s4k-bf16:
  inherits: _qwen3_32b_s4k
megatron-qwen3-32b-n1-s4k-mxfp8:
  inherits: _qwen3_32b_s4k
  argv: {<<: *qwen3_mxfp8}
megatron-qwen3-32b-n1-s4k-nvfp4:
  inherits: _qwen3_32b_s4k
  argv: {<<: *qwen3_nvfp4}
# Megatron's PyTorch profiler on rank 0 at step 18 of 20; each entry names its directory (--tensorboard-dir, relative to
# the pack's directory, the ranks' working directory): the trace lands in $G/prof/<entry>/torch_profile
_qwen3_prof: &qwen3_prof
  --profile: true
  --use-pytorch-profiler: true
  --profile-step-start: 18
  --profile-step-end: 19
  --profile-ranks: 0
  --tensorboard-dir: ../../../prof/tb
# 1 node, 4096 tokens, PP2, profiled: why NVFP4 is slower than BF16 there; -lt: 3 steps for cuBLASLt's trace
megatron-qwen3-32b-n1-s4k-prof-bf16:
  inherits: megatron-qwen3-32b-n1-s4k-bf16
  argv: {<<: *qwen3_prof, --tensorboard-dir: ../../../prof/n1-s4k-prof-bf16/tb}
megatron-qwen3-32b-n1-s4k-prof-mxfp8:
  inherits: megatron-qwen3-32b-n1-s4k-mxfp8
  argv: {<<: *qwen3_prof, --tensorboard-dir: ../../../prof/n1-s4k-prof-mxfp8/tb}
megatron-qwen3-32b-n1-s4k-prof-nvfp4:
  inherits: megatron-qwen3-32b-n1-s4k-nvfp4
  argv: {<<: *qwen3_prof, --tensorboard-dir: ../../../prof/n1-s4k-prof-nvfp4/tb}
megatron-qwen3-32b-n1-s4k-nvfp4-lt:
  inherits: megatron-qwen3-32b-n1-s4k-nvfp4
  argv: {--train-iters: 3}
# no pipeline: TP2 x data parallel (the optimizer state sharded over 16 at 4 nodes, over 4 at 1), 8 micro-batches per
# data-parallel rank; -cg: CUDA graphs per layer (Megatron's local implementation). Profiled as above
_qwen3_32b_tp2:
  inherits: _qwen3_32b
  argv:
    <<: *qwen3_prof
    --pipeline-model-parallel-size: 1
_qwen3_cg: &qwen3_cg
  --cuda-graph-impl: local
megatron-qwen3-32b-n4-tp2-bf16:
  inherits: _qwen3_32b_tp2
  num_machines: 4
  argv: {--global-batch-size: 128, --tensorboard-dir: ../../../prof/n4-tp2-bf16/tb}
megatron-qwen3-32b-n4-tp2-mxfp8:
  inherits: megatron-qwen3-32b-n4-tp2-bf16
  argv: {<<: *qwen3_mxfp8, --tensorboard-dir: ../../../prof/n4-tp2-mxfp8/tb}
megatron-qwen3-32b-n4-tp2-nvfp4:
  inherits: megatron-qwen3-32b-n4-tp2-bf16
  argv: {<<: *qwen3_nvfp4, --tensorboard-dir: ../../../prof/n4-tp2-nvfp4/tb}
megatron-qwen3-32b-n4-tp2-cg-bf16:
  inherits: megatron-qwen3-32b-n4-tp2-bf16
  argv: {<<: *qwen3_cg, --tensorboard-dir: ../../../prof/n4-tp2-cg-bf16/tb}
megatron-qwen3-32b-n4-tp2-cg-mxfp8:
  inherits: megatron-qwen3-32b-n4-tp2-mxfp8
  argv: {<<: *qwen3_cg, --tensorboard-dir: ../../../prof/n4-tp2-cg-mxfp8/tb}
megatron-qwen3-32b-n4-tp2-cg-nvfp4:
  inherits: megatron-qwen3-32b-n4-tp2-nvfp4
  argv: {<<: *qwen3_cg, --tensorboard-dir: ../../../prof/n4-tp2-cg-nvfp4/tb}
megatron-qwen3-32b-n1-tp2-cg-bf16:
  inherits: _qwen3_32b_tp2
  argv: {<<: *qwen3_cg, --tensorboard-dir: ../../../prof/n1-tp2-cg-bf16/tb}
megatron-qwen3-32b-n1-tp2-cg-mxfp8:
  inherits: megatron-qwen3-32b-n1-tp2-cg-bf16
  argv: {<<: *qwen3_mxfp8, --tensorboard-dir: ../../../prof/n1-tp2-cg-mxfp8/tb}
megatron-qwen3-32b-n1-tp2-cg-nvfp4:
  inherits: megatron-qwen3-32b-n1-tp2-cg-bf16
  argv: {<<: *qwen3_nvfp4, --tensorboard-dir: ../../../prof/n1-tp2-cg-nvfp4/tb}
# -tpo: TP2's sequence-parallel all-gather / reduce-scatter overlapped with the GEMMs (TE userbuffers,
# --tp-comm-overlap), on the 4-node TP2 x DP16 layout with CUDA graphs
megatron-qwen3-32b-n4-tp2-cg-tpo-bf16:
  inherits: megatron-qwen3-32b-n4-tp2-cg-bf16
  argv: {--tp-comm-overlap: true, --tensorboard-dir: ../../../prof/n4-tp2-cg-tpo-bf16/tb}
megatron-qwen3-32b-n4-tp2-cg-tpo-mxfp8:
  inherits: megatron-qwen3-32b-n4-tp2-cg-mxfp8
  argv: {--tp-comm-overlap: true, --tensorboard-dir: ../../../prof/n4-tp2-cg-tpo-mxfp8/tb}
megatron-qwen3-32b-n4-tp2-cg-tpo-nvfp4:
  inherits: megatron-qwen3-32b-n4-tp2-cg-nvfp4
  argv: {--tp-comm-overlap: true, --tensorboard-dir: ../../../prof/n4-tp2-cg-tpo-nvfp4/tb}

# Qwen3 32B C-loss: 500 steps with the C-loss settings (seed 1234, lr 3e-4, warm-up 50, cosine to 3e-5), 1 node, TP2 x PP2
# x data parallel 2 without CUDA graphs (MXFP8 runs out of memory on one node with them), 32 x 8192 tokens per step:
# 128,000 slots of 1024 tokens, about 4 documents each with a stride of 4: 600,000 FineWeb documents staged
_qwen3_loss_n1:
  inherits: _qwen3_32b
  # BF16 took 8.04 s per step: 67 min for 500 steps, 90 min with startup and margin
  max_duration: 5400
  data:
    samples: 600000
    doc_stride: 4
  argv:
    <<: *tri_loss
megatron-qwen3-32b-loss-bf16-n1:
  inherits: _qwen3_loss_n1
megatron-qwen3-32b-loss-bf16-rep2-n1:
  inherits: _qwen3_loss_n1
megatron-qwen3-32b-loss-mxfp8-n1:
  inherits: _qwen3_loss_n1
  argv: {<<: *qwen3_mxfp8}
megatron-qwen3-32b-loss-nvfp4-n1:
  inherits: _qwen3_loss_n1
  argv: {<<: *qwen3_nvfp4}
# 20 steps of the NVFP4 one: the 600,000 documents read with the stride, data_loading in the summary
megatron-qwen3-32b-loss-check-n1:
  inherits: megatron-qwen3-32b-loss-nvfp4-n1
  max_duration: 1200
  argv: {--train-iters: 20, --lr-warmup-iters: 5}
# Qwen3 32B speed at 13 nodes: the 4-node speed layout (TP2 x data parallel, CUDA graphs, no TP comm overlap: NVFP4 cannot
# use it in this Megatron), data parallel 52, 8 micro-batches per data-parallel rank: 416 x 8192 tokens per step,
# 20 steps, without the profiler
_qwen3_n13: &qwen3_n13
  --global-batch-size: 416
  --profile: null
  --use-pytorch-profiler: null
  --profile-step-start: null
  --profile-step-end: null
  --profile-ranks: null
  --tensorboard-dir: null
megatron-qwen3-32b-n13-bf16:
  inherits: megatron-qwen3-32b-n4-tp2-cg-bf16
  num_machines: 13
  argv: {<<: *qwen3_n13}
megatron-qwen3-32b-n13-mxfp8:
  inherits: megatron-qwen3-32b-n4-tp2-cg-mxfp8
  num_machines: 13
  argv: {<<: *qwen3_n13}
megatron-qwen3-32b-n13-nvfp4:
  inherits: megatron-qwen3-32b-n4-tp2-cg-nvfp4
  num_machines: 13
  argv: {<<: *qwen3_n13}

# --- QW-CP: Qwen3 32B at long context with context parallelism (scripts/trillium/qw-cp/README.md) ---------------------
# One causal mask over each whole sequence: one slot per sample (data.docs_per_sample 1: FineWeb documents joined with EOS)
# in Megatron's sbhd input (no --dataloader-inter-document-masking, so no cu_seqlens: TE 2.18 refuses THD with the
# hierarchical a2a+p2p). Slots start 256 documents apart (a 128k slot holds about 190). RoPE as the 8k entries (base 1e6;
# Qwen3's YaRN for 128k changes the frequencies, not the compute). TP2 (sequence parallel) x CP4 on one node, no pipeline,
# 32,768 tokens per GPU per step as the 8k entries: 8 x 32k, 4 x 64k or 2 x 128k sequences
_qwcp:
  inherits: _qwen3_32b
  data:
    docs_per_sample: 1
    doc_stride: 256
  argv:
    --dataloader-inter-document-masking: null
    --no-create-attention-mask-in-dataloader: true
    --pipeline-model-parallel-size: 1
    --context-parallel-size: 4
    --cp-comm-type: p2p
    --seq-length: 32768
    --max-position-embeddings: 32768
    --global-batch-size: 8
_qwcp_128k: &qwcp_128k
  --seq-length: 131072
  --max-position-embeddings: 131072
  --global-batch-size: 2
_qwcp_64k: &qwcp_64k
  --seq-length: 65536
  --max-position-embeddings: 65536
  --global-batch-size: 4
# selective: Megatron's dense MLP (its layernorm included) recomputed; the default module, core_attn, saves nothing with
# TE's fused attention
_qwcp_sel: &qwcp_sel
  --recompute-granularity: selective
  --recompute-modules: [mlp]
_qwcp_full: &qwcp_full
  --recompute-granularity: full
  --recompute-method: uniform
  --recompute-num-layers: 1
# 8 layers, 10 steps: which CP options run, and TE's attention backend (NVTE_DEBUG: its selection log)
_qwcp_t8:
  inherits: _qwcp
  max_duration: 300
  env:
    NVTE_DEBUG: "1"
    NVTE_DEBUG_LEVEL: "2"
  model:
    argv:
      --num-layers: 8
  argv:
    --train-iters: 10
megatron-qwen3-32b-cp-t8-32k-p2p:
  inherits: _qwcp_t8
# the 8k entries' THD input (cu_seqlens), one slot per sample
megatron-qwen3-32b-cp-t8-32k-p2p-thd:
  inherits: _qwcp_t8
  argv: {--dataloader-inter-document-masking: true, --no-create-attention-mask-in-dataloader: null}
megatron-qwen3-32b-cp-t8-32k-a2a:
  inherits: _qwcp_t8
  argv: {--cp-comm-type: a2a}
# TE 2.18 names it all_gather (Megatron's help says allgather, which TE refuses: job 1272968)
megatron-qwen3-32b-cp-t8-32k-allgather:
  inherits: _qwcp_t8
  argv: {--cp-comm-type: all_gather}
# hierarchical: a2a inside pairs of GPUs, p2p between the pairs
megatron-qwen3-32b-cp-t8-32k-a2ap2p:
  inherits: _qwcp_t8
  argv: {--cp-comm-type: a2a+p2p, --hierarchical-context-parallel-sizes: [2, 2]}
megatron-qwen3-32b-cp-t8-32k-tp1cp8:
  inherits: _qwcp_t8
  argv: {--tensor-model-parallel-size: 1, --sequence-parallel: null, --context-parallel-size: 8}
# 128k without recompute: the activation memory per layer at 128k
megatron-qwen3-32b-cp-t8-128k-p2p:
  inherits: _qwcp_t8
  argv: {<<: *qwcp_128k}
megatron-qwen3-32b-cp-t8-32k-p2p-cg:
  inherits: _qwcp_t8
  argv: {<<: *qwen3_cg}
megatron-qwen3-32b-cp-t8-32k-a2a-cg:
  inherits: _qwcp_t8
  argv: {<<: *qwen3_cg, --cp-comm-type: a2a}
# full recompute: Megatron allows CUDA graphs with it only as one graph per iteration (full_iteration), which needs the
# NaN check off
megatron-qwen3-32b-cp-t8-128k-p2p-full-fi:
  inherits: _qwcp_t8
  argv: {<<: [*qwcp_128k, *qwcp_full], --cuda-graph-impl: full_iteration, --no-check-for-nan-in-loss-and-grad: true}
# full depth, one node, 20 steps. Activation memory measured on 8 layers (job 1272968): about 0.84 GiB per layer and 4.6 GiB
# of logits per 8k tokens on a CP rank (TP2), on about 84 GiB of weights, gradients and optimizer state (the 8k runs): no
# recompute fits 32k (est. 142 GiB), not 64k (est. 200); selective (MLP) fits 64k (est. 140), not 128k (est. 190); full
# fits 128k (est. 120). The -none / -sel entries one step short of fitting are there to measure it
megatron-qwen3-32b-cp-n1-8k:
  inherits: _qwcp
  argv: {--context-parallel-size: 1, --seq-length: 8192, --max-position-embeddings: 8192, --global-batch-size: 32}
megatron-qwen3-32b-cp-n1-32k-p2p:
  inherits: _qwcp
megatron-qwen3-32b-cp-n1-32k-a2a:
  inherits: _qwcp
  argv: {--cp-comm-type: a2a}
megatron-qwen3-32b-cp-n1-32k-p2p-cg:
  inherits: _qwcp
  argv: {<<: *qwen3_cg}
# TP1 x CP8: 32.8 B parameters per GPU, about 153 GiB before activations
megatron-qwen3-32b-cp-n1-32k-tp1cp8-full:
  inherits: _qwcp
  argv: {<<: *qwcp_full, --tensor-model-parallel-size: 1, --sequence-parallel: null, --context-parallel-size: 8}
megatron-qwen3-32b-cp-n1-64k-p2p-none:
  inherits: _qwcp
  argv: {<<: *qwcp_64k}
megatron-qwen3-32b-cp-n1-64k-p2p-sel:
  inherits: _qwcp
  argv: {<<: [*qwcp_64k, *qwcp_sel]}
# per-layer CUDA graphs with selective recompute (Megatron allows them with full recompute only as full_iteration graphs,
# which stop at step 2 with CP: megatron-qwen3-32b-cp-t8-128k-p2p-full-fi, job 1272968)
megatron-qwen3-32b-cp-n1-64k-p2p-sel-cg:
  inherits: megatron-qwen3-32b-cp-n1-64k-p2p-sel
  argv: {<<: *qwen3_cg}
megatron-qwen3-32b-cp-n1-128k-p2p-sel:
  inherits: _qwcp
  argv: {<<: [*qwcp_128k, *qwcp_sel]}
megatron-qwen3-32b-cp-n1-128k-p2p-full:
  inherits: _qwcp
  argv: {<<: [*qwcp_128k, *qwcp_full]}
megatron-qwen3-32b-cp-n1-128k-a2a-full:
  inherits: megatron-qwen3-32b-cp-n1-128k-p2p-full
  argv: {--cp-comm-type: a2a}
# 128k, 50 steps with the C-loss settings in small (seed 1234, lr 3e-4, warm-up 5, cosine to 3e-5): the loss goes down,
# no NaN; its step times are the 128k p2p speed point too. 2 x 128k tokens per step, 100 slots of about 190 documents
megatron-qwen3-32b-cp-n1-128k-loss:
  inherits: megatron-qwen3-32b-cp-n1-128k-p2p-full
  max_duration: 2700
  argv: {<<: *tri_loss, --train-iters: 50, --lr-warmup-iters: 5}
