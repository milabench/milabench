# --- Trillium B200 (scripts/trillium/DESIGN.md: A-G, B-G, C, F1) -----------------------------------------------------
# 8 B200 per node, full training (no frozen parameters), full depth (78 layers), seq 8192, micro-batch 1, no VPP.
# A model copy is PP x EP GPUs (EP is carved from one stage's data-parallel ranks): world % PP == 0, (world / PP) % EP
# == 0, checked before launch (placement.check_layout). Global batch: the pipeline bubble is (PP - 1) / (m + PP - 1)
# for m micro-batches per data-parallel rank, so the batch is set in micro-batches. Weak scaling (and the layout
# comparison at a node count): 32 micro-batches per data-parallel rank of pp13-ep8, i.e. 256 x nodes / 13 (256, 512,
# 768, 1024; bubble 12 / 44 = 27 %); the other layouts take the batch of their node count (12 nodes: 256, 48: 1024).
# Strong scaling: 768 in total (96 / 48 / 32 / 24 micro-batches at 13 / 26 / 39 / 52 nodes: bubble 11 % to 33 %).
# 64 per copy is the small-batch point. Every entry runs on exactly its num_machines nodes: submit each with that many.
# Names: megatron-glm5-tri-<layout>-n<nodes>-gbs<global batch>[-sel][-<precision>].
# Micro-batch is always 1: the GLM-5 plugin's attention takes THD input only (checked before launch).
# Stage splits (first / middle x stages / last, 78 layers; the first stage holds the 3 dense layers, the last the loss):
#   PP13 7 / 6 x 11 / 5     PP26 4 / 3 x 24 / 2     PP6 15 / 13 x 4 / 11     PP10 9 / 8 x 8 / 5     PP25 5 / 3 x 23 / 4
# DSA index sharing off (as the Rorqual G runs: it only allows some stage boundaries). Run `deviations`: dsa_index_share.
# Optimizer: as the Rorqual full runs (precision-aware: FP32 master weights, BF16 gradients and Adam moments).
_tri_glm5:
  inherits: _megatron_glm5
  tags: [trillium, full]
  data:
    # 20 steps x 1024 sequences x 8 slots (the 52-node entries), with a margin: no wrap in the speed runs
    samples: 200000
  num_machines: 13
  max_duration: 3600
  frozen:
    preset: none
  placement:
    nodes: as-is
    gpus_per_node: 8
    a2a_timing: true
  model:
    index_share: false
  argv:
    <<: *full_argv
    --pipeline-model-parallel-size: 13
    --decoder-first-pipeline-num-layers: 7
    --decoder-last-pipeline-num-layers: 5
    --expert-model-parallel-size: 8
    --global-batch-size: 256
    --train-iters: 20
    --log-straggler: true
    --log-interval: 5
    # the last stage's first receive waits for every stage before it to compile its kernels: 573 s of Megatron's default 600 at PP13 (job 1242058)
    --distributed-timeout-minutes: 30

_tri_pp26: &tri_pp26
  --pipeline-model-parallel-size: 26
  --decoder-first-pipeline-num-layers: 4
  --decoder-last-pipeline-num-layers: 2
_tri_pp10: &tri_pp10
  --pipeline-model-parallel-size: 10
  --decoder-first-pipeline-num-layers: 9
  --decoder-last-pipeline-num-layers: 5
_tri_pp25: &tri_pp25
  --pipeline-model-parallel-size: 25
  --decoder-first-pipeline-num-layers: 5
  --decoder-last-pipeline-num-layers: 4
_tri_pp6: &tri_pp6
  --pipeline-model-parallel-size: 6
  --decoder-first-pipeline-num-layers: 15
  --decoder-last-pipeline-num-layers: 11
# selective recompute instead of full (activations of the MoE activation and the norms only). Not mla_up_proj: the GLM-5
# plugin's attention never sets the checkpoint it asserts on (AssertionError in its forward, Rorqual 25574783)
_tri_sel: &tri_sel
  --recompute-granularity: selective
  --recompute-modules: [moe_act, layernorm]
  --recompute-method: null
  --recompute-num-layers: null

# --- A-G / B-G: layouts and copies (pp13-ep8 weak: 32 micro-batches per data-parallel rank; strong: 768 in total) ---
megatron-glm5-tri-pp13-ep8-n13-gbs256:
  inherits: _tri_glm5
megatron-glm5-tri-pp13-ep8-n26-gbs512:
  inherits: _tri_glm5
  num_machines: 26
  argv: {--global-batch-size: 512}
# 39 nodes: weak and strong scaling share this run (768)
megatron-glm5-tri-pp13-ep8-n39-gbs768:
  inherits: _tri_glm5
  num_machines: 39
  argv: {--global-batch-size: 768}
megatron-glm5-tri-pp13-ep8-n52-gbs1024:
  inherits: _tri_glm5
  num_machines: 52
  argv: {--global-batch-size: 1024}
# strong scaling: 768 in total
megatron-glm5-tri-pp13-ep8-n13-gbs768:
  inherits: _tri_glm5
  argv: {--global-batch-size: 768}
megatron-glm5-tri-pp13-ep8-n26-gbs768:
  inherits: _tri_glm5
  num_machines: 26
  argv: {--global-batch-size: 768}
megatron-glm5-tri-pp13-ep8-n52-gbs768:
  inherits: _tri_glm5
  num_machines: 52
  argv: {--global-batch-size: 768}
# small batch, 64 per copy (8 micro-batches for 13 stages)
megatron-glm5-tri-pp13-ep8-n13-gbs64:
  inherits: _tri_glm5
  argv: {--global-batch-size: 64}
# selective recompute
megatron-glm5-tri-pp13-ep8-n13-gbs256-sel:
  inherits: _tri_glm5
  argv: {<<: *tri_sel}
# Megatron's per-rank timers, for the send/recv between stages: a GPU sync at each timer and 2 barriers per step, so a
# separate short run, to compare with gbs256
megatron-glm5-tri-pp13-ep8-n13-gbs256-timers:
  inherits: megatron-glm5-tri-pp13-ep8-n13-gbs256
  argv: {--timing-log-level: 2, --timing-log-option: all, --train-iters: 11}
megatron-glm5-tri-pp13-ep8-n52-gbs1024-sel:
  inherits: megatron-glm5-tri-pp13-ep8-n52-gbs1024
  argv: {<<: *tri_sel}
# expert groups across nodes: EP16 (2 nodes), EP32 (4 nodes)
megatron-glm5-tri-pp13-ep16-n26-gbs512:
  inherits: _tri_glm5
  num_machines: 26
  argv: {--expert-model-parallel-size: 16, --global-batch-size: 512}
megatron-glm5-tri-pp13-ep16-n52-gbs1024:
  inherits: _tri_glm5
  num_machines: 52
  argv: {--expert-model-parallel-size: 16, --global-batch-size: 1024}
megatron-glm5-tri-pp13-ep32-n52-gbs1024:
  inherits: _tri_glm5
  num_machines: 52
  argv: {--expert-model-parallel-size: 32, --global-batch-size: 1024}
# deeper pipeline: PP26 (3 layers per middle stage)
megatron-glm5-tri-pp26-ep8-n26-gbs512:
  inherits: _tri_glm5
  num_machines: 26
  argv: {<<: *tri_pp26, --global-batch-size: 512}
megatron-glm5-tri-pp26-ep8-n52-gbs1024:
  inherits: _tri_glm5
  num_machines: 52
  argv: {<<: *tri_pp26, --global-batch-size: 1024}
# shallower pipeline: PP6 x EP16 (12 nodes per copy; 416 GPUs do not split in 6: 48 nodes for 4 copies)
megatron-glm5-tri-pp6-ep16-n12-gbs256:
  inherits: _tri_glm5
  num_machines: 12
  argv: {<<: *tri_pp6, --expert-model-parallel-size: 16}
# Megatron's per-rank timers, as pp13-ep8-n13-gbs256-timers: EP across nodes, send/recv and all-to-all
megatron-glm5-tri-pp6-ep16-n12-gbs256-timers:
  inherits: megatron-glm5-tri-pp6-ep16-n12-gbs256
  argv: {--timing-log-level: 2, --timing-log-option: all, --train-iters: 11}
# if only 47 nodes are available (5 reserved for SciNet): the n48 substitute, 288 GPUs, 48 per stage, 3 copies
megatron-glm5-tri-pp6-ep16-n36-gbs768:
  inherits: _tri_glm5
  num_machines: 36
  argv: {<<: *tri_pp6, --expert-model-parallel-size: 16, --global-batch-size: 768}
megatron-glm5-tri-pp6-ep16-n48-gbs1024:
  inherits: _tri_glm5
  num_machines: 48
  argv: {<<: *tri_pp6, --expert-model-parallel-size: 16, --global-batch-size: 1024}

# node counts 13 does not divide: 50 is the most Slurm accepts while trig0122 and trig0146 are out. PP10: 25 micro-batches per
# copy, bubble 9 / 34 = 26 %. PP25: 64, 24 / 88 = 27 %, the batches of pp26-ep8
megatron-glm5-tri-pp10-ep8-n10-gbs200:
  inherits: _tri_glm5
  num_machines: 10
  argv: {<<: *tri_pp10, --global-batch-size: 200}
megatron-glm5-tri-pp10-ep8-n20-gbs400:
  inherits: _tri_glm5
  num_machines: 20
  argv: {<<: *tri_pp10, --global-batch-size: 400}
megatron-glm5-tri-pp10-ep8-n30-gbs600:
  inherits: _tri_glm5
  num_machines: 30
  argv: {<<: *tri_pp10, --global-batch-size: 600}
megatron-glm5-tri-pp10-ep8-n40-gbs800:
  inherits: _tri_glm5
  num_machines: 40
  argv: {<<: *tri_pp10, --global-batch-size: 800}
megatron-glm5-tri-pp10-ep8-n50-gbs1000:
  inherits: _tri_glm5
  num_machines: 50
  argv: {<<: *tri_pp10, --global-batch-size: 1000}
# F2: long run, the best layout at 50 nodes (51.50 s per step, job 1256251), >= 1 h of measured steps: 80 steps, 78
# measured, ~67 min, + ~13 min startup (estimates). BF16, no checkpoint. 8,000 slots per step: the 200,000 documents wrap
# after ~25 steps (data_loading.wrapped). run.experiment F2 (TT_EXPERIMENT, no launcher of its own)
megatron-glm5-tri-f2-pp10-ep8-n50-gbs1000:
  inherits: megatron-glm5-tri-pp10-ep8-n50-gbs1000
  max_duration: 5700
