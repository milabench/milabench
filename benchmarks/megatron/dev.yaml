# F2 at 40 nodes, the compromise while only 49 are usable: pp10-ep8 x4 (51.00 s per step, job 1249100), the same 80 steps
megatron-glm5-tri-f2-pp10-ep8-n40-gbs800:
  inherits: megatron-glm5-tri-pp10-ep8-n40-gbs800
