# Variants of initial_training.yml, merged into it by merge.py (job.sbatch STEPS VARIANT...).
# The kernels are OpenFold3's settings.memory.train switches (openfold3/projects/of3_all_atom/config/model_config.py);
# the published training config sets none of them: plain PyTorch triangle attention and multiplication.
published: {}

# cuEquivariance triangle attention and triangle multiplication (falls back to PyTorch for short sequences and for
# head widths it does not handle, docs/source/kernels.md)
cueq:
  model_update: {custom: {settings: {memory: {train: {use_cueq_triangle_kernels: true}}}}}

# DeepSpeed's Evoformer attention (CUTLASS, built at first use with the CUDA toolkit in CUDA_HOME)
ds:
  model_update: {custom: {settings: {memory: {train: {use_deepspeed_evo_attention: true}}}}}

# both, as docs/source/kernels.md shows for inference: cuEquivariance first, DeepSpeed where cuEquivariance falls back
cueq-ds:
  model_update: {custom: {settings: {memory: {train: {use_cueq_triangle_kernels: true, use_deepspeed_evo_attention: true}}}}}

# OpenFold3's Triton triangle attention kernels
triton:
  model_update: {custom: {settings: {memory: {train: {use_triton_triangle_kernels: true}}}}}

# PyTorch profiler (OpenFold3's `profiler` block) over 2 steps after 27, Chrome traces per rank in the run's prof/
prof:
  profiler: {enabled: true, dirpath: "@RUN@/prof", skip_first: 25, wait: 0, warmup: 2, active: 2, record_shapes: false,
             with_stack: false}

# Fine-tuning stage 1 (examples/training_yamls/finetune_1.yml), from random weights: crops of 640 tokens, 32
# diffusion samples, its chunk sizes, loss weights and model-selection scheme
ft1:
  model_update:
    custom:
      settings:
        model_selection_weight_scheme: fine_tuning
        memory: {train: {msa_module: {swiglu_seq_chunk_size: 1024}}}
      architecture:
        shared: {diffusion: {no_samples: 32}}
        loss_module: {diffusion: {chunk_size: 2}}
  dataset_configs:
    train:
      weighted-pdb: {config: {crop: {token_crop: {token_budget: 640}}, loss: {loss_weights: {bond: 4.0, smooth_lddt: 0.0}}}}
      long-monomer-distillation: {config: {crop: {token_crop: {token_budget: 640}}, loss: {loss_weights: {bond: 4.0, smooth_lddt: 0.0}}}}
      RNA-monomer-distillation: {config: {crop: {token_crop: {token_budget: 640}}, loss: {loss_weights: {bond: 4.0, smooth_lddt: 0.0}}}}

# Step 2's data subset (data.sh subset-u uniform 700 subset): PDB entries drawn uniformly, so that the sampler's
# weighting reproduces the full set's mix (mix.py); same monomers, other RNA entries
uniform:
  dataset_paths:
    weighted-pdb: {dataset_cache_file: "@DATA@/subset-u/pdb_cache.json"}
    long-monomer-distillation: {dataset_cache_file: "@DATA@/subset-u/long_monomer_cache.json"}
    RNA-monomer-distillation: {dataset_cache_file: "@DATA@/subset-u/rna_cache.json"}
