include:
  - _defaults.yaml

# Diffusion fine-tuning tool comparison (see benchmarks/sdiffusion/README.md)
# Same job across tools: SDXL LoRA, naruto-blip-captions, fixed step count.

_sdiffusion:
  inherits: _defaults
  enabled: true
  install_variant: unpinned
  max_duration: 1800
  tags:
    - sdiffusion
  plan:
    method: per_gpu
  argv:
    --cache: "{milabench_cache}"
    --steps: 200
    --batch_size: 1

sdiffusion-aitoolkit:
  inherits: _sdiffusion
  definition: ../benchmarks/sdiffusion/aitoolkit
  install_group: sdiffusion-aitoolkit
  num_machines: 1

sdiffusion-simpletuner:
  inherits: _sdiffusion
  definition: ../benchmarks/sdiffusion/simpletuner
  install_group: sdiffusion-simpletuner
  num_machines: 1

sdiffusion-kohya:
  inherits: _sdiffusion
  definition: ../benchmarks/sdiffusion/kohya
  install_group: sdiffusion-kohya
  num_machines: 1
