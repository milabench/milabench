# Rorqual window configs (4x H100 per node) for Qwen3.8-27B pre-training.
#
#   sbatch --nodes=<N> ... scripts/slurm/tt_native.sh tt-w-<name>
#   (with MILABENCH_CONFIG pointing to this file, see journals/)
#
# Every entry has the same per-GPU settings as config/torchtitan_native.yaml
# (seq 8192, 2 sequences = 16k tokens/GPU, full AC, compile regions without CUDA
# graphs, FSDP over all GPUs), so results are directly comparable (weak scaling).
# Global batch = 16384 x GPUs tokens (4.85M tokens/step at 296 GPUs).
#
# Measurement: 30 warm-up steps, then a 5-minute window converted to a step
# count after warm-up. Each entry has a "-lowmem" fallback (bf16 AdamW moments,
# -4 B/param) for out-of-memory errors.
#
# Rorqual leaves (topology.conf): 22 leaves with 3 GPU nodes, plus leaves with
# 7, 8 and 12 GPU nodes. The single-leaf runs therefore use 3 nodes; pass the
# leaf's node list to sbatch (-w) and run one job per leaf concurrently.
#
# Planned topology comparisons at scale (2026-10-20):
# - homogeneous: only 3-node leaves (22 leaves x 3 nodes = 264 GPUs max) vs
#   heterogeneous mixes including the 7/8/12-node leaves;
# - 48 GPUs on the 12-node leaf (one switch) vs 4 leaves x 3 nodes (4 switches):
#   tt-w-leaf12 on the big leaf vs the same entry with a 4x3 node list.

# Expected memory per GPU (H100 80 GB = 79.2 GiB usable). Model: sharded state
# = 16 B/param x 26.9e9 / GPUs (12 B/param with -lowmem), plus a working set
# that does not depend on the GPU count (gathered layer, grads, activations,
# logits chunks): ~12-14 GiB at 1 sequence/GPU, ~6 GiB more at 2 sequences
# (measured at 8 GPUs, bf16 moments: 45.1/63.9 -> 50.9/69.0 GiB alloc/rsvd).
# Reserved ~ allocated + 12-18 GiB. Fitted on Fir runs at 8, 12 and 16 GPUs
# (full AC, no CUDA graphs); larger counts are extrapolated, not measured.
#
#   entry          GPUs   state   alloc (est.)   reserved (est.)   measured (2 seq)
#   tt-w-smoke        4   n/a     ~46             ~61              to re-measure
#   tt-w-leaf3       12   33.4    ~52             ~66              to re-measure
#   tt-w-leaf7       28   14.3    ~34             ~48
#   tt-w-leaf8       32   12.5    ~32             ~46
#   tt-w-leaf12      48    8.4    ~28             ~42
#   tt-w-n28        112    3.6    ~23             ~37
#   tt-w-n70/72/74  280-296 1.4   ~21             ~35
#
#   -lowmem (bf16 moments) lowers the state term by 25 %; measured at 8 GPUs,
#   2 seq: 50.9 / 69.0 GiB (fp32 moments OOM'd there at 1 seq).

include:
  - torchtitan_native.yaml

_tt_window:
  inherits: _tt_native
  max_duration: 2400
  voir:
    options:
      skip: 30
      stop_seconds: 300

# Smoke test: 1 node. The full 27B training state (~430 GB) does not fit on 4
# GPUs, so the smoke test uses the first 16 layers (same per-GPU settings).
tt-w-smoke:
  inherits: _tt_window
  num_machines: 1
  argv:
    --n-layers: 16

# Single leaf switch: 3 nodes (12 GPUs). Tightest memory of the full-model
# configs (36 GB of sharded state per GPU).
tt-w-leaf3:
  inherits: _tt_window
  num_machines: 3

# Larger leaves (7, 8 and 12 GPU nodes).
tt-w-leaf7:
  inherits: _tt_window
  num_machines: 7

tt-w-leaf8:
  inherits: _tt_window
  num_machines: 8

tt-w-leaf12:
  inherits: _tt_window
  num_machines: 12

# Mid scale: 28 nodes (112 GPUs).
tt-w-n28:
  inherits: _tt_window
  num_machines: 28

# Full scale and fallbacks if nodes are excluded at the health check.
tt-w-n74:
  inherits: _tt_window
  num_machines: 74

tt-w-n72:
  inherits: _tt_window
  num_machines: 72

tt-w-n70:
  inherits: _tt_window
  num_machines: 70

# --- Low-memory fallbacks: same per-GPU batch and AC, bf16 AdamW moments ---

tt-w-smoke-lowmem:
  inherits: tt-w-smoke
  argv: {--adam-moments: bf16}

tt-w-leaf3-lowmem:
  inherits: tt-w-leaf3
  argv: {--adam-moments: bf16}

tt-w-leaf7-lowmem:
  inherits: tt-w-leaf7
  argv: {--adam-moments: bf16}

tt-w-leaf8-lowmem:
  inherits: tt-w-leaf8
  argv: {--adam-moments: bf16}

tt-w-leaf12-lowmem:
  inherits: tt-w-leaf12
  argv: {--adam-moments: bf16}

tt-w-n28-lowmem:
  inherits: tt-w-n28
  argv: {--adam-moments: bf16}

tt-w-n74-lowmem:
  inherits: tt-w-n74
  argv: {--adam-moments: bf16}

tt-w-n72-lowmem:
  inherits: tt-w-n72
  argv: {--adam-moments: bf16}

tt-w-n70-lowmem:
  inherits: tt-w-n70
  argv: {--adam-moments: bf16}
