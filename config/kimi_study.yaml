# =============================================================================
# Kimi-K3 serving study: ATOM vs vLLM, 1 vs 2 nodes
#
#   * latency / throughput trade-off: concurrency passes (conc*)
#   * cost of a growing context: input-length passes (ctx*) and the ITL-by-context-position curve
#     of the long-decode passes (decodelong*), see pass_summary.itl_by_context
#   * accuracy of the quantization we add (ATOM online ptpc_fp8 on the BF16 layers, fp8 KV cache):
#     lm-eval GSM8K / ARC-Challenge / GPQA diamond against the running server (eval pass)
#
# Kimi-K3 ships its routed experts in MXFP4 (release format); attention, shared experts and lm_head
# are BF16. kimi-atom-tp8-bf16 (no online quant, bf16 KV) is the accuracy reference.
#
# One entry per server configuration: the server loads once and every client pass runs against it
# (client.passes, see benchmarks/serving: one client benchmark per pass). Toggle flags (--enforce-eager, --enable-dp-attention,
# --online_quant_config) cannot be switched by a placeholder, hence explicit entries rather than a matrix.
#
#   MILABENCH_CONFIG_OVERRIDE=$PWD/milabench/config/kimi_study.yaml bash run.sh --select kimi-atom-tp8-bf16
#
# Results: runs/<run name>/<entry>.*.data, events pass_summary / eval_summary;
# scripts/analysis/kimi_study.py turns them into tables and plots.
# =============================================================================

include:
  - ../benchmarks/vllm/dev.yaml

_kimi:
  inherits: _serving
  # milabench runs the server, each client pass is its own benchmark (<entry>.<pass>.<job>.data)
  definition: ../benchmarks/serving
  enabled: true
  num_machines: 1
  max_duration: 10800
  tags:
    - multigpu
    - moe
    - mxfp4
    - kimi-study
  plan:
    method: njobs
    n: 1
  requires_capabilities:
    - "arch in ('cuda', 'rocm')"
    - "gpu.get('count', 0) >= 8"
  url: https://huggingface.co/moonshotai/Kimi-K3
  voir:
    options:
      # several passes push many more rate events than one: do not stop after the first ones
      stop: 1000000
  client:
    argv:
      --model: moonshotai/Kimi-K3
      --trust-remote-code: true
      --dataset-name: random
      --ignore-eos: true
      --random-range-ratio: 0.0
      --ready-check-timeout-sec: 10800
    passes:
      # Sized for the HIP-graphs configs (~15 ms TPOT at concurrency 1, ~3k tok/s at saturation): about 55 min of
      # passes per config. Every pass sends at least 60 requests and 2 per concurrency slot, so p99 is not one request.
      # The eager configs are ~10x slower and only run the eval (see kimi-atom-tp8-bf16).
      # latency / throughput: 1k in, 256 out
      - {name: conc1,   argv: {--max-concurrency: 1,   --num-prompts: 60,  --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc4,   argv: {--max-concurrency: 4,   --num-prompts: 60,  --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc16,  argv: {--max-concurrency: 16,  --num-prompts: 64,  --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc64,  argv: {--max-concurrency: 64,  --num-prompts: 128, --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc128, argv: {--max-concurrency: 128, --num-prompts: 256, --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc256, argv: {--max-concurrency: 256, --num-prompts: 512, --random-input-len: 1024, --random-output-len: 256}}
      # past 256 the GPUs are not saturated yet; the server runs at most 512 (see --max-num-seqs)
      - {name: conc512,  argv: {--max-concurrency: 512,  --num-prompts: 1024, --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc1024, argv: {--max-concurrency: 1024, --num-prompts: 2048, --random-input-len: 1024, --random-output-len: 256}}
      # prefill / decode cost vs input length: 128 out (TPOT here = decode at that context length)
      - {name: ctx1k-c1,    argv: {--max-concurrency: 1,  --num-prompts: 60, --random-input-len: 1024,   --random-output-len: 128}}
      - {name: ctx8k-c1,    argv: {--max-concurrency: 1,  --num-prompts: 60, --random-input-len: 8192,   --random-output-len: 128}}
      - {name: ctx32k-c1,   argv: {--max-concurrency: 1,  --num-prompts: 60, --random-input-len: 32768,  --random-output-len: 128}}
      - {name: ctx64k-c1,   argv: {--max-concurrency: 1,  --num-prompts: 60, --random-input-len: 65536,  --random-output-len: 128}}
      - {name: ctx128k-c1,  argv: {--max-concurrency: 1,  --num-prompts: 60, --random-input-len: 131072, --random-output-len: 128}}
      - {name: ctx1k-c16,   argv: {--max-concurrency: 16, --num-prompts: 64, --random-input-len: 1024,   --random-output-len: 128}}
      - {name: ctx8k-c16,   argv: {--max-concurrency: 16, --num-prompts: 64, --random-input-len: 8192,   --random-output-len: 128}}
      - {name: ctx32k-c16,  argv: {--max-concurrency: 16, --num-prompts: 64, --random-input-len: 32768,  --random-output-len: 128}}
      - {name: ctx64k-c16,  argv: {--max-concurrency: 16, --num-prompts: 64, --random-input-len: 65536,  --random-output-len: 128}}
      - {name: ctx128k-c16, argv: {--max-concurrency: 16, --num-prompts: 64, --random-input-len: 131072, --random-output-len: 128}}
      # decode slowdown as the context fills within the requests: 1k in, 4k out. Read per token position
      # (pass_summary.itl_by_context: 4096 ITL samples per request), not as a request percentile: few requests suffice.
      - {name: decodelong-c1,  argv: {--max-concurrency: 1,  --num-prompts: 4,  --random-input-len: 1024, --random-output-len: 4096}}
      - {name: decodelong-c16, argv: {--max-concurrency: 16, --num-prompts: 32, --random-input-len: 1024, --random-output-len: 4096}}

# accuracy pass, appended by the entries that measure it (quantization variants, one reference layout
# per backend): `client: {passes: {append: [*eval]}}`. Kimi-K3 reasons before answering: leave room for it.
# GSM8K (1319) and ARC-Challenge (1172) are near 98%: they catch a broken config, not a small loss.
# MMLU-Pro (2002 of 12,032, stratified, ~75-85%: +-0.9 pt) and AIME 24/25 (60 problems x 4 samples) are the
# sensitive ones. Every answer is logged (samples_<task>_*.jsonl) to compare configs question by question.
_kimi_eval_pass:
  enabled: false
  pass: &eval
    name: eval
    eval:
      tasks: [milabench_gsm8k, milabench_arc_challenge, milabench_gpqa_diamond, milabench_mmlu_pro]
      num_concurrent: 128
      gen_kwargs: {max_gen_toks: 8192, temperature: 0}
      log_samples: true
  # gen_kwargs apply to every task of a pass: AIME samples (avg@4) and needs room to reason (32k context left)
  aime: &eval_aime
    name: eval-aime
    eval:
      tasks: [milabench_aime24, milabench_aime25]
      num_concurrent: 240
      gen_kwargs: {max_gen_toks: 32768, temperature: 1.0, top_p: 0.95}
      log_samples: true

# -----------------------------------------------------------------------------
# ATOM (ROCm). 1-node entries: TP8 inside the node.
# -----------------------------------------------------------------------------

_kimi_atom:
  inherits: _kimi
  # load ~15 min + the performance passes ~55 + eval ~35 + eval-aime ~40
  max_duration: 14400
  server:
    backend: atom
    argv:
      --model: moonshotai/Kimi-K3
      --trust-remote-code: true
      -tp: "{gpu_count}"
      --max-model-len: 133120
      # Kimi-K3's linear-attention state is ~56 MB per sequence per GPU (TP8): with the BF16 weights (198 GB of
      # 288 GB) 1024 sequences need 57.5 GB of the 48 GB left (InsufficientPoolBudget). 512: 29 GB, the rest for KV.
      # conc1024 then shows the saturation (requests beyond 512 queue).
      --max-num-seqs: 512
      --max-num-batched-tokens: 16384
      --gpu-memory-utilization: 0.93
      --block-size: 128
      --no-enable_prefix_caching: true

# Eager configs: performance in study.2026-11-02_20-16-04 (~10x slower than graphs, host-bound), small eval in
# study.2026-11-03_15-36-43. Accuracy is now measured on the graphs configs (graphs change how kernels are
# launched, not the arithmetic): kimi-atom-tp8-bf16-graphs is the reference.
kimi-atom-tp8-bf16:
  inherits: _kimi_atom
  # disabled: superseded by kimi-atom-tp8-bf16-graphs (see above)
  enabled: false
  client:
    passes: [*eval]
  server:
    argv:
      --kv_cache_dtype: bf16
      --enforce-eager: true

# conc512 / conc1024 for the reference, which ran before they were added (same server flags)
kimi-atom-tp8-bf16-hiconc:
  inherits: kimi-atom-tp8-bf16
  # disabled: make-up for the first run (max-num-seqs 256); kimi-atom-tp8-bf16 now runs every point
  enabled: false
  client:
    passes:
      - {name: conc256,  argv: {--max-concurrency: 256,  --num-prompts: 512,  --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc512,  argv: {--max-concurrency: 512,  --num-prompts: 1024, --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc1024, argv: {--max-concurrency: 1024, --num-prompts: 2048, --random-input-len: 1024, --random-output-len: 256}}

# The reference's performance passes again with the same --max-num-seqs as every other config (512): its first
# run used 256, and the cap changes the state / KV pools and the scheduling. Accuracy does not depend on it.
kimi-atom-tp8-bf16-seqs512:
  inherits: _kimi_atom
  # disabled: superseded: kimi-atom-tp8-bf16 runs with --max-num-seqs 512 now
  enabled: false
  server:
    argv:
      --kv_cache_dtype: bf16
      --enforce-eager: true

# what serving-moe-kimi-k3-mxfp4-gpus runs: ptpc_fp8 on the BF16 linear layers + fp8 KV cache
kimi-atom-tp8-fp8:
  inherits: _kimi_atom
  # disabled: superseded by kimi-atom-tp8-fp8-graphs (see kimi-atom-tp8-bf16)
  enabled: false
  client:
    passes: [*eval]
  server:
    argv:
      --kv_cache_dtype: fp8
      --enforce-eager: true
      --online_quant_config: &ptpc '{"global_quant_config":"ptpc_fp8","exclude_layer":["lm_head","model.embed_tokens","*self_attn.[qkv]_conv1d*","*self_attn.f_b_proj*","*block_sparse_moe.experts*","*block_sparse_moe.routed_expert_*","*vision_tower*","*mm_projector*"]}'

# fp8 weights only: separates the two quantization effects
kimi-atom-tp8-fp8w-bf16kv:
  inherits: _kimi_atom
  # disabled: scored exactly like kimi-atom-tp8-fp8 on every task (study.2026-11-02_20-16-04); the fp8 KV cache
  # stays in every graphs config
  enabled: false
  client:
    passes: [*eval]
  server:
    argv:
      --kv_cache_dtype: bf16
      --enforce-eager: true
      --online_quant_config: *ptpc

# GPQA diamond for kimi-atom-tp8-fp8w-bf16kv, whose first run hit max_duration (then 2 h) during it
kimi-atom-tp8-fp8w-bf16kv-gpqa:
  inherits: kimi-atom-tp8-fp8w-bf16kv
  # disabled: make-up after a 2 h max_duration; the limit is 3 h now
  enabled: false
  client:
    passes:
      - name: eval
        eval:
          tasks: [milabench_gpqa_diamond]
          num_concurrent: 128
          gen_kwargs: {max_gen_toks: 8192, temperature: 0}

# CUDA graphs (no --enforce-eager)
kimi-atom-tp8-fp8-graphs:
  inherits: _kimi_atom
  # load ~15 min + random passes ~55 + real-text twins ~55 + chat ~10 + eval ~35 + eval-aime ~40
  max_duration: 21600
  # the fastest 1-node config. Also: real-text twins of the random passes and a chat workload (OpenHermes-2.5,
  # benchmarks/serving/text_corpus.py), and its accuracy measured directly rather than through kimi-atom-tp8-fp8
  client:
    passes:
      append:
      # real text, same lengths as the random-token passes above: the difference is the content only
      - {name: text-conc1,    argv: {--real-text: true, --max-concurrency: 1, --num-prompts: 60, --random-input-len: 1024, --random-output-len: 256}}
      - {name: text-conc4,    argv: {--real-text: true, --max-concurrency: 4, --num-prompts: 60, --random-input-len: 1024, --random-output-len: 256}}
      - {name: text-conc16,   argv: {--real-text: true, --max-concurrency: 16, --num-prompts: 64, --random-input-len: 1024, --random-output-len: 256}}
      - {name: text-conc64,   argv: {--real-text: true, --max-concurrency: 64, --num-prompts: 128, --random-input-len: 1024, --random-output-len: 256}}
      - {name: text-conc128,  argv: {--real-text: true, --max-concurrency: 128, --num-prompts: 256, --random-input-len: 1024, --random-output-len: 256}}
      - {name: text-conc256,  argv: {--real-text: true, --max-concurrency: 256, --num-prompts: 512, --random-input-len: 1024, --random-output-len: 256}}
      - {name: text-conc512,  argv: {--real-text: true, --max-concurrency: 512, --num-prompts: 1024, --random-input-len: 1024, --random-output-len: 256}}
      - {name: text-conc1024, argv: {--real-text: true, --max-concurrency: 1024, --num-prompts: 2048, --random-input-len: 1024, --random-output-len: 256}}
      - {name: text-ctx1k-c1,   argv: {--real-text: true, --max-concurrency: 1, --num-prompts: 60, --random-input-len: 1024, --random-output-len: 128}}
      - {name: text-ctx8k-c1,   argv: {--real-text: true, --max-concurrency: 1, --num-prompts: 60, --random-input-len: 8192, --random-output-len: 128}}
      - {name: text-ctx32k-c1,  argv: {--real-text: true, --max-concurrency: 1, --num-prompts: 60, --random-input-len: 32768, --random-output-len: 128}}
      - {name: text-ctx64k-c1,  argv: {--real-text: true, --max-concurrency: 1, --num-prompts: 60, --random-input-len: 65536, --random-output-len: 128}}
      - {name: text-ctx128k-c1, argv: {--real-text: true, --max-concurrency: 1, --num-prompts: 60, --random-input-len: 131072, --random-output-len: 128}}
      - {name: text-ctx1k-c16,  argv: {--real-text: true, --max-concurrency: 16, --num-prompts: 64, --random-input-len: 1024, --random-output-len: 128}}
      - {name: text-ctx8k-c16,  argv: {--real-text: true, --max-concurrency: 16, --num-prompts: 64, --random-input-len: 8192, --random-output-len: 128}}
      - {name: text-ctx32k-c16, argv: {--real-text: true, --max-concurrency: 16, --num-prompts: 64, --random-input-len: 32768, --random-output-len: 128}}
      - {name: text-ctx64k-c16, argv: {--real-text: true, --max-concurrency: 16, --num-prompts: 64, --random-input-len: 65536, --random-output-len: 128}}
      - {name: text-ctx128k-c16, argv: {--real-text: true, --max-concurrency: 16, --num-prompts: 64, --random-input-len: 131072, --random-output-len: 128}}
      # chat workload: OpenHermes-2.5 first user turn as the prompt, output length = the dataset reply's token count
      # (EOS still ignored: Kimi-K3 would otherwise reason for as long as it likes); vLLM keeps prompt <= 1024,
      # prompt + reply <= 2048 tokens
      - {name: chat-conc1,   argv: {--dataset-name: sharegpt, --max-concurrency: 1, --num-prompts: 60}}
      - {name: chat-conc16,  argv: {--dataset-name: sharegpt, --max-concurrency: 16, --num-prompts: 60}}
      - {name: chat-conc64,  argv: {--dataset-name: sharegpt, --max-concurrency: 64, --num-prompts: 128}}
      - {name: chat-conc256, argv: {--dataset-name: sharegpt, --max-concurrency: 256, --num-prompts: 512}}
      - {name: chat-conc512, argv: {--dataset-name: sharegpt, --max-concurrency: 512, --num-prompts: 1024}}
      - *eval
      - *eval_aime
  server:
    argv:
      --kv_cache_dtype: fp8
      --online_quant_config: *ptpc

# BF16 with CUDA graphs: eager mode spends ~90% of a decode step outside the GPU (FP8: 154 ms -> 15 ms TPOT at
# concurrency 1), so every layout runs with graphs. Accuracy reference: no online quantization, bf16 KV cache.
kimi-atom-tp8-bf16-graphs:
  inherits: _kimi_atom
  client:
    passes: {append: [*eval, *eval_aime]}
  server:
    argv:
      --kv_cache_dtype: bf16

# -----------------------------------------------------------------------------
# Quantization ladder past FP8 (CUDA graphs, fp8 KV cache): how far ATOM's online quantization goes on Kimi-K3,
# not what is production-ready. The routed experts already ship in MXFP4 (BF16 activations: the A4W4 MoE path
# is Triton + SiLU only, Kimi uses SiTU). mxfp4 = W4A4, block 32: weights and activations in FP4.
#   fp8-graphs      ptpc_fp8 on attention, shared experts, dense MLP
#   mxfp4-mlp       + shared experts (92 layers) and the dense MLP (layer 0) in MXFP4, attention stays FP8
#   mxfp4-attn      + attention projections (69 KDA o_proj, 24 MLA qkv_a/q_b/kv_b/g/o_proj) in MXFP4. The KDA in_proj
#                   stays FP8: it fuses q/k/v/g + b_proj (96 rows) + f_a_proj (128, replicated), 6284 rows per GPU at
#                   TP8, and aiter's MXFP4 weight shuffle needs a multiple of 16 (AssertionError: 6284 % 16 == 12)
#   mxfp4-max       + lm_head, the routed experts' latent projections, f_b_proj: everything that is a Linear
#                   (the short convolutions and the embedding are not)
# -----------------------------------------------------------------------------

kimi-atom-tp8-mxfp4-mlp:
  inherits: _kimi_atom
  client:
    passes: {append: [*eval, *eval_aime]}
  server:
    argv:
      --kv_cache_dtype: fp8
      --online_quant_config: '{"global_quant_config":"ptpc_fp8","layer_quant_config":{"*block_sparse_moe.shared_experts.*":"mxfp4","*.mlp.*":"mxfp4"},"exclude_layer":["lm_head","model.embed_tokens","*self_attn.[qkv]_conv1d*","*self_attn.f_b_proj*","*block_sparse_moe.experts*","*block_sparse_moe.routed_expert_*","*vision_tower*","*mm_projector*"]}'

kimi-atom-tp8-mxfp4-attn:
  inherits: _kimi_atom
  # disabled: MXFP4 smoke kimi-quant-smoke-4 failed (fail passes={} gsm8k=None)
  enabled: false
  client:
    passes: {append: [*eval, *eval_aime]}
  server:
    argv:
      --kv_cache_dtype: fp8
      --online_quant_config: '{"global_quant_config":"mxfp4","layer_quant_config":{"*self_attn.in_proj":"ptpc_fp8"},"exclude_layer":["lm_head","model.embed_tokens","*self_attn.[qkv]_conv1d*","*self_attn.f_b_proj*","*block_sparse_moe.experts*","*block_sparse_moe.routed_expert_*","*vision_tower*","*mm_projector*"]}'

kimi-atom-tp8-mxfp4-max:
  inherits: _kimi_atom
  # disabled: MXFP4 smoke kimi-quant-smoke-4 failed (fail passes={} gsm8k=None)
  enabled: false
  client:
    passes: {append: [*eval, *eval_aime]}
  server:
    argv:
      --kv_cache_dtype: fp8
      --online_quant_config: '{"global_quant_config":"mxfp4","layer_quant_config":{"*self_attn.in_proj":"ptpc_fp8"},"exclude_layer":["model.embed_tokens","*self_attn.[qkv]_conv1d*","*block_sparse_moe.experts*","*vision_tower*","*mm_projector*"]}'

# DP attention + expert parallel over the 8 GPUs (CUDA graphs)
kimi-atom-dpattn8-ep8-fp8:
  inherits: _kimi_atom
  # disabled: out of memory: DP attention replicates attention + shared layers on every GPU (266 GB/GPU before KV)
  enabled: false
  client:
    passes: {append: [*eval]}
  server:
    argv:
      --kv_cache_dtype: fp8
      --online_quant_config: *ptpc
      --enable-dp-attention: true
      --enable-expert-parallel: true

# -----------------------------------------------------------------------------
# ATOM, 2 nodes: data parallelism across the nodes (ATOM has no cross-node TP/PP)
# -----------------------------------------------------------------------------

_kimi_atom_nodes:
  inherits: _kimi_atom
  num_machines: 2
  tags:
    - multinode
    - moe
    - mxfp4
    - kimi-study
  requires_capabilities:
    - "arch in ('cuda', 'rocm')"
    - "gpu.get('count', 0) >= 8"
    - "len(nodes) >= ${..num_machines}"
  server:
    multinode: dp
    dp_local: 1

# one replica per node behind the coordinator's endpoint
kimi-atom-2n-dp2-tp8-fp8:
  inherits: _kimi_atom_nodes
  server:
    argv:
      --kv_cache_dtype: fp8
      --online_quant_config: *ptpc

# DP attention on the 16 GPUs, experts sharded over both nodes (cross-node all-to-all)
kimi-atom-2n-dpattn16-ep16-fp8:
  inherits: _kimi_atom_nodes
  # disabled: aiter fused_moe: a16w4 (bf16 A x MXFP4 W) SiTUv2 does not support expert-parallel masking
  enabled: false
  client:
    passes: {append: [*eval]}
  server:
    argv:
      --kv_cache_dtype: fp8
      --online_quant_config: *ptpc
      --enable-dp-attention: true
      --enable-expert-parallel: true

# -----------------------------------------------------------------------------
# vLLM. On ROCm the MXFP4 experts run on vLLM's EMULATION MoE backend (no native kernel for this model).
# -----------------------------------------------------------------------------

_kimi_vllm:
  inherits: _kimi
  server:
    backend: vllm
    argv:
      moonshotai/Kimi-K3: true
      --trust-remote-code: true
      # text-only benchmark: skip the vision tower and its profiling memory
      --language-model-only: true
      --max-model-len: 133120
      # Kimi-K3's linear-attention state is ~56 MB per sequence per GPU (TP8): with the BF16 weights (198 GB of
      # 288 GB) 1024 sequences need 57.5 GB of the 48 GB left (InsufficientPoolBudget). 512: 29 GB, the rest for KV.
      # conc1024 then shows the saturation (requests beyond 512 queue).
      --max-num-seqs: 512
      --max-num-batched-tokens: 16384
      --gpu-memory-utilization: 0.9
      --no-enable-prefix-caching: true

kimi-vllm-tp8:
  inherits: _kimi_vllm
  # disabled: vLLM 0.32 on ROCm: Quark hw_emulation JIT build gets -DUSE_CUDA on HIP (cuda.h), grouped_topk compile stalls
  enabled: false
  client:
    passes: {append: [*eval]}
  server:
    argv:
      --tensor-parallel-size: "{gpu_count}"
      # per-rank weight shards (benchmate.vllm_sharded_loader): the first run saves them
      --load-format: milabench_sharded

kimi-vllm-tp8-ep:
  inherits: _kimi_vllm
  # disabled: vLLM not runnable for Kimi-K3 on ROCm (see kimi-vllm-tp8)
  enabled: false
  server:
    argv:
      --tensor-parallel-size: "{gpu_count}"
      --enable-expert-parallel: true
      --load-format: milabench_sharded

_kimi_vllm_nodes:
  inherits: _kimi_vllm
  num_machines: 2
  tags:
    - multinode
    - moe
    - mxfp4
    - kimi-study
  requires_capabilities:
    - "arch in ('cuda', 'rocm')"
    - "gpu.get('count', 0) >= 8"
    - "len(nodes) >= ${..num_machines}"
  server:
    multinode: dp

kimi-vllm-2n-dp2-tp8:
  inherits: _kimi_vllm_nodes
  # disabled: vLLM not runnable for Kimi-K3 on ROCm (see kimi-vllm-tp8)
  enabled: false
  server:
    dp_local: 1
    argv:
      --tensor-parallel-size: "{gpu_count}"
      --load-format: milabench_sharded

# wide EP: one DP rank per GPU, experts over the 16 GPUs. No sharded loader: its shard names are
# per (PP, TP) rank and every rank here is TP 0 with different experts.
kimi-vllm-2n-dp16-ep16:
  inherits: _kimi_vllm_nodes
  # disabled: vLLM not runnable for Kimi-K3 on ROCm (see kimi-vllm-tp8)
  enabled: false
  server:
    dp_local: 8
    argv:
      --tensor-parallel-size: 1
      --enable-expert-parallel: true

# -----------------------------------------------------------------------------
# vLLM on B200 (CUDA, vLLM 0.32.0: platforms.toml, torch 2.13.0 + cu130). One B200 node holds ~1.44 TB, the
# checkpoint 1.56 TB: 2 nodes at least. TP8 inside each node (NVLink), PP2 across the two (Ray): the layout of
# vLLM's Kimi-K3 recipe for 2 x 8 B200 (without its DCP8 and DSpark draft, which the MI355X study did not use).
# -----------------------------------------------------------------------------

kimi-vllm-2n-tp8pp2:
  inherits: _kimi_vllm
  num_machines: 2
  tags:
    - multinode
    - moe
    - mxfp4
    - kimi-study
  requires_capabilities:
    - "arch in ('cuda', 'rocm')"
    - "gpu.get('count', 0) >= 8"
    - "len(nodes) >= ${..num_machines}"
  # ready after ~37 min (load 11.5, FlashInfer autotune ~24: job 1262824), the performance passes ~1 h and the eval
  # 35-60 min (estimates): 2.2-2.7 h
  max_duration: 12600
  env:
    # the API server waits this long for the engine (default 600 s): 2192 s from start to ready in job 1262824
    VLLM_ENGINE_READY_TIMEOUT_S: "5400"
  client:
    passes:
      # throwaway, before the measured passes: kernels that JIT-compile on their first batches of a shape (Triton's
      # layer_norm_gated_fwd_kernel: a 9.8 s stall at the start of conc64 in jobs 1261890 and 1262824)
      prepend:
        - &warmup {name: warmup, argv: {--max-concurrency: 64, --num-prompts: 64, --random-input-len: 1024, --random-output-len: 64}}
      append: [*eval]
  server:
    argv:
      --tensor-parallel-size: "{gpu_count}"
      --pipeline-parallel-size: "{num_machines}"

# bring-up: the server loads and two passes of the study run against it. In a 1 h job: every start autotunes FlashInfer's
# kernels, 20-25 min (jobs 1261631, 1261890; the MXFP4 MoE entries of the saved cache do not match again, job 1262548)
kimi-vllm-2n-tp8pp2-bringup:
  inherits: kimi-vllm-2n-tp8pp2
  max_duration: 3420
  client:
    passes:
      - *warmup
      - {name: conc1,   argv: {--max-concurrency: 1,   --num-prompts: 60,  --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc64,  argv: {--max-concurrency: 64,  --num-prompts: 128, --random-input-len: 1024, --random-output-len: 256}}

# 4 nodes: the same server over four nodes, TP8 inside each and PP4 across them. The 2-node server's limit was its 512
# sequences (--max-num-seqs), with KV left: its KV pool (vLLM's "3,606,273 tokens", 27.09 x max-model-len) was 26.7% in
# use at 256 running and 53.4% at 512 (job 1263799), full at about 960 requests of 1,280 tokens (about 1.2M tokens).
# PP4 [23,23,24,23] halves the weights per GPU (95.7-96.1 GiB -> about 48) and so leaves about 1.9x the KV memory
# (51.4-53.5 GiB -> about 100), and halves the layers whose KV and KDA state each GPU keeps (46-47 -> 23-24): about
# 3,400-3,650 sequences (estimate; the last stage binds), 1,820 on the memory alone. 1024, the study's highest
# concurrency, then fills about 30% of the pool (56% on the memory alone). The one server change beyond the layout
kimi-vllm-4n-tp8pp4:
  inherits: kimi-vllm-2n-tp8pp2
  num_machines: 4
  server:
    argv:
      --max-num-seqs: 1024

# its bring-up in a 1 h job: each node loads its ~24 shards (~390 GB instead of ~780: ~6 min cold at the ~1.1 GB/s per
# node of job 1263799), then FlashInfer's autotune again (a new config hash; the same TP8 shapes per GPU, ~24 min), the
# warm-up, conc1, conc64 and conc1024 (the changed --max-num-seqs at work); job.sh's USR1 stop 5 min before --time
kimi-vllm-4n-tp8pp4-bringup:
  inherits: kimi-vllm-4n-tp8pp4
  max_duration: 3420
  client:
    passes:
      - *warmup
      - {name: conc1,    argv: {--max-concurrency: 1,    --num-prompts: 60,   --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc64,   argv: {--max-concurrency: 64,   --num-prompts: 128,  --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc1024, argv: {--max-concurrency: 1024, --num-prompts: 2048, --random-input-len: 1024, --random-output-len: 256}}

# the bring-up without FlashInfer's autotune, as vLLM's Kimi-K3 recipes run: what the 20-25 min of autotune at every
# start buys, against kimi-vllm-2n-tp8pp2-bringup
kimi-vllm-2n-tp8pp2-bringup-notune:
  inherits: kimi-vllm-2n-tp8pp2-bringup
  server:
    argv:
      --no-enable-flashinfer-autotune: true

# the full model with random weights: memory, CUDA graphs and FlashInfer's autotune at 93 layers, before the checkpoint
# is there
kimi-vllm-2n-tp8pp2-dummy:
  inherits: kimi-vllm-2n-tp8pp2-bringup
  server:
    argv:
      --load-format: dummy

# K3-XN: the experts over the nodes, with data-parallel attention. One TP8 engine per node joined by vLLM's data
# parallelism (`multinode: dp`, no Ray); --enable-expert-parallel shards the experts over DP x TP = 16 GPUs (EP16: 56
# whole experts of the 896 on each GPU). Attention and the latent projections stay TP8 inside the node (K3's
# sequence-parallel MoE path, PP 1). The all-to-all is vLLM 0.32's NCCL one, allgather_reducescatter (its default, no
# driver setting): each MoE layer all-gathers the 16 ranks' tokens at the latent 3,584 (MXFP8) and reduce-scatters the
# outputs; the TRTLLM MXFP4 kernel then runs in its modular form (the monolithic one takes no DP). Without
# --enable-ep-weight-filter every rank reads every expert: 1.56 TB per node, about 24 min at job 1263799's 1.1 GB/s.
# VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT: under sequence parallelism vLLM holds the shared experts and layer 0's dense MLP
# whole on every GPU (weights 128.31 GiB per GPU, KV 13.61 GiB, job 1270053); this TP-shards them (all-gather of the TP
# group's tokens, partial GEMMs, reduce-scatter). The shared experts only with deepep_v2 (or deep_gemm_mega_moe): 107.41
# GiB, KV 26.47 GiB (job 1270725); DeepEP does not start without it (KV 5.0 GiB, job 1270544). Set on both backends
# (coordinator, 2026-11-08), but with allgather_reducescatter vLLM shards layer 0's dense MLP only: the shared experts
# stay whole there (127.13 GiB, KV 4.23x against DeepEP's 107.41 GiB, 7.55x).
#
# The study's passes that the KV memory holds without queueing: per engine about 150 requests of 1,280 tokens with
# allgather_reducescatter and 267 with deepep_v2 (est., from vLLM's 4.23x and 7.55x max-model-len, jobs 1271244,
# 1271240). Dropped: conc512 and conc1024 (256 and 512 per engine), ctx64k-c16 (8 x 65.6k tokens per engine against
# 562,563) and ctx128k-c16 (8 x 131k against 562,563 and 1,004,792). A second throwaway warm-up shaped like conc64:
# its later requests mix prefill and decode in one batch, so DeepEP JIT-compiles the kernels of those batch sizes before
# the measured passes (the first conc64 of job 1271240 stalled 20 s, its repeat did not)
kimi-vllm-2n-dp2tp8-ep16:
  inherits: kimi-vllm-2n-tp8pp2
  env:
    VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT: "1"
  client:
    passes:
      - *warmup
      - {name: warmup-mixed, argv: {--max-concurrency: 64, --num-prompts: 128, --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc1,   argv: {--max-concurrency: 1,   --num-prompts: 60,  --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc4,   argv: {--max-concurrency: 4,   --num-prompts: 60,  --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc16,  argv: {--max-concurrency: 16,  --num-prompts: 64,  --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc64,  argv: {--max-concurrency: 64,  --num-prompts: 128, --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc128, argv: {--max-concurrency: 128, --num-prompts: 256, --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc256, argv: {--max-concurrency: 256, --num-prompts: 512, --random-input-len: 1024, --random-output-len: 256}}
      - {name: ctx1k-c1,    argv: {--max-concurrency: 1,  --num-prompts: 60, --random-input-len: 1024,   --random-output-len: 128}}
      - {name: ctx8k-c1,    argv: {--max-concurrency: 1,  --num-prompts: 60, --random-input-len: 8192,   --random-output-len: 128}}
      - {name: ctx32k-c1,   argv: {--max-concurrency: 1,  --num-prompts: 60, --random-input-len: 32768,  --random-output-len: 128}}
      - {name: ctx64k-c1,   argv: {--max-concurrency: 1,  --num-prompts: 60, --random-input-len: 65536,  --random-output-len: 128}}
      - {name: ctx128k-c1,  argv: {--max-concurrency: 1,  --num-prompts: 60, --random-input-len: 131072, --random-output-len: 128}}
      - {name: ctx1k-c16,   argv: {--max-concurrency: 16, --num-prompts: 64, --random-input-len: 1024,   --random-output-len: 128}}
      - {name: ctx8k-c16,   argv: {--max-concurrency: 16, --num-prompts: 64, --random-input-len: 8192,   --random-output-len: 128}}
      - {name: ctx32k-c16,  argv: {--max-concurrency: 16, --num-prompts: 64, --random-input-len: 32768,  --random-output-len: 128}}
      - {name: decodelong-c1,  argv: {--max-concurrency: 1,  --num-prompts: 4,  --random-input-len: 1024, --random-output-len: 4096}}
      - {name: decodelong-c16, argv: {--max-concurrency: 16, --num-prompts: 32, --random-input-len: 1024, --random-output-len: 4096}}
      - *eval
  server:
    multinode: dp
    dp_local: 1
    argv:
      --pipeline-parallel-size: 1
      --enable-expert-parallel: true
      --all2all-backend: allgather_reducescatter
      --enable-ep-weight-filter: true

# the same on vLLM 0.32's deepep_v2 all-to-all: DeepEP V2 (ElasticBuffer) on NCCL Gin, RDMA between the nodes. Its own
# venv, venv/deepep (scripts/trillium/kimi/deepep_build.sh: K3-INF's copied, DeepEP a56d615, NCCL 2.30.7, nixl 1.5.2).
# DeepEP compiles its kernels at run time: CUDA_HOME for its JIT (FlashInfer and torch see it too; K3-INF's runs had none),
# its JIT cache node-local (job.sh)
kimi-vllm-2n-dp2tp8-ep16-deepep:
  inherits: kimi-vllm-2n-dp2tp8-ep16
  install_group: deepep
  env:
    CUDA_HOME: /cvmfs/soft.computecanada.ca/easybuild/software/2023/x86-64-v3/Core/cudacore/13.2.0
  server:
    argv:
      --all2all-backend: deepep_v2

# bring-ups in a 1 h job, without FlashInfer's autotune (engine start minutes instead of ~24): warm-up, conc1, conc64
# (against kimi-vllm-2n-tp8pp2-bringup-notune, job 1263425) and GSM8K's first 200 questions (correctness, against the same
# 200 in K3-INF-01's samples)
kimi-vllm-2n-dp2tp8-ep16-bringup-notune:
  inherits: kimi-vllm-2n-dp2tp8-ep16
  max_duration: 3420
  client:
    passes: &ep16_bringup
      - *warmup
      - {name: conc1,   argv: {--max-concurrency: 1,   --num-prompts: 60,  --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc64,  argv: {--max-concurrency: 64,  --num-prompts: 128, --random-input-len: 1024, --random-output-len: 256}}
      - name: eval-gsm8k200
        eval:
          tasks: [milabench_gsm8k]
          limit: 200
          num_concurrent: 128
          gen_kwargs: {max_gen_toks: 8192, temperature: 0}
          log_samples: true
  server:
    argv:
      --no-enable-flashinfer-autotune: true

kimi-vllm-2n-dp2tp8-ep16-deepep-bringup-notune:
  inherits: kimi-vllm-2n-dp2tp8-ep16-deepep
  max_duration: 3420
  client:
    passes: *ep16_bringup
  server:
    argv:
      --no-enable-flashinfer-autotune: true

# where a step's time goes: vLLM's per-iteration log (requests, tokens, elapsed time) through every pass, and its torch
# profiler on 10 iterations (after 20) of a conc1 and a conc64 pass after the bring-up's: per-kernel CUDA time per rank in
# runs/profile-<entry>/*.profiler_out.txt, traces beside them
kimi-vllm-2n-dp2tp8-ep16-bringup-diag:
  inherits: kimi-vllm-2n-dp2tp8-ep16-bringup-notune
  client:
    passes:
      append: &ep16_profile_passes
        - {name: conc1-profile,  argv: {--max-concurrency: 1,  --num-prompts: 4,   --random-input-len: 1024, --random-output-len: 256, --profile: true}}
        - {name: conc64-profile, argv: {--max-concurrency: 64, --num-prompts: 128, --random-input-len: 1024, --random-output-len: 256, --profile: true}}
  server:
    argv: &ep16_diag_argv
      --enable-logging-iteration-details: true
      --profiler-config: '{"profiler": "torch", "torch_profiler_dir": "${...dirs.runs}/profile-${...name}", "delay_iterations": 20, "max_iterations": 10, "ignore_frontend": true, "torch_profiler_with_stack": false}'

kimi-vllm-2n-dp2tp8-ep16-deepep-bringup-diag:
  inherits: kimi-vllm-2n-dp2tp8-ep16-deepep-bringup-notune
  client:
    passes:
      append: *ep16_profile_passes
  server:
    argv: *ep16_diag_argv

# K3-XN part 3, prefill and decode on separate nodes: scripts/trillium/kimi/pd_serve.sh (server.command, on the main node)
# starts a prefill EP16 instance on the job's nodes 0-1 and a decode EP16 instance on nodes 2-3, with NIXL's KV transfer
# (KV cache and KDA state), and vLLM v0.32.0's NIXL toy proxy on the main node's port 8000. The bring-up's passes,
# GSM8K included. num_machines 1: milabench starts the launcher on the main node only; the launcher places the instances.
# All-gather all-to-all (prefill under deepep_v2 runs its decode mode, 2.1 s TTFT p50 against 1.3 at conc64, job 1271240);
# venv/deepep for nixl only
kimi-vllm-4n-pd-ep16-bringup-notune:
  inherits: kimi-vllm-2n-dp2tp8-ep16-bringup-notune
  install_group: deepep
  num_machines: 1
  server:
    command: [bash, "${...config_base}/../scripts/trillium/kimi/pd_serve.sh"]

# its colocated reference (coordinator, 2026-11-08): the same two EP16 instances, flags and proxy, but the proxy sends each
# request whole to one instance, round-robin (pd_proxy.py --colocated), so that only the disaggregation changes
kimi-vllm-4n-pd-ep16-colocated-bringup-notune:
  inherits: kimi-vllm-4n-pd-ep16-bringup-notune
  env:
    K3XN_PD_MODE: colocated

# the P/D study row's two servers: K3-XN-01's passes (kimi-vllm-2n-dp2tp8-ep16), FlashInfer's autotune on
kimi-vllm-4n-pd-ep16:
  inherits: kimi-vllm-2n-dp2tp8-ep16
  install_group: deepep
  num_machines: 1
  server:
    command: [bash, "${...config_base}/../scripts/trillium/kimi/pd_serve.sh"]

kimi-vllm-4n-pd-ep16-colocated:
  inherits: kimi-vllm-4n-pd-ep16
  env:
    K3XN_PD_MODE: colocated

# K3-XN part 1 on 4 nodes: the experts over 4 nodes, EP32 (DP4 x TP8, one engine per node, 28 experts per GPU), against
# K3-INF-02 (TP8 x PP4). The same server as EP16 otherwise (all-gather all-to-all, shared experts whole): half the experts
# per GPU (84.2 -> 42.1 GiB), so about 42 GiB more for the KV cache (est.)
kimi-vllm-4n-dp4tp8-ep32:
  inherits: kimi-vllm-2n-dp2tp8-ep16
  num_machines: 4

# its bring-up in a 1 h job, without the autotune: the EP16 bring-up's passes and conc1024 (as K3-INF-02's bring-up, job
# 1264956), 256 sequences per engine
kimi-vllm-4n-dp4tp8-ep32-bringup-notune:
  inherits: kimi-vllm-4n-dp4tp8-ep32
  max_duration: 3420
  client:
    passes:
      - *warmup
      - {name: conc1,    argv: {--max-concurrency: 1,    --num-prompts: 60,   --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc64,   argv: {--max-concurrency: 64,   --num-prompts: 128,  --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc1024, argv: {--max-concurrency: 1024, --num-prompts: 2048, --random-input-len: 1024, --random-output-len: 256}}
      - name: eval-gsm8k200
        eval:
          tasks: [milabench_gsm8k]
          limit: 200
          num_concurrent: 128
          gen_kwargs: {max_gen_toks: 8192, temperature: 0}
          log_samples: true
  server:
    argv:
      --no-enable-flashinfer-autotune: true

# EP32's conc1024 crash (job 1271715: illegal memory access on DP3, trig0108 GPU 0, 22:39:04): the same server, the warm-up
# and conc1024 only, on 4 other nodes (coordinator: repeatability first)
kimi-vllm-4n-dp4tp8-ep32-conc1024:
  inherits: kimi-vllm-4n-dp4tp8-ep32-bringup-notune
  client:
    passes:
      - *warmup
      - &ep32_conc1024 {name: conc1024, argv: {--max-concurrency: 1024, --num-prompts: 2048, --random-input-len: 1024, --random-output-len: 256}}

# EP32's study (draft row, coordinator 2026-11-09): all-gather, at most 128 sequences per engine, 512 in flight (K3-INF-02's
# one engine took 1024): at this setting job 1272263 ran conc1024 with none failed, where 256 per engine crashed three
# times (SW-25). K3-XN-01's passes plus conc512 and conc1024; FlashInfer's autotune on
kimi-vllm-4n-dp4tp8-ep32-s128:
  inherits: kimi-vllm-4n-dp4tp8-ep32
  client:
    passes:
      - *warmup
      - {name: warmup-mixed, argv: {--max-concurrency: 64, --num-prompts: 128, --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc1,    argv: {--max-concurrency: 1,    --num-prompts: 60,   --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc4,    argv: {--max-concurrency: 4,    --num-prompts: 60,   --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc16,   argv: {--max-concurrency: 16,   --num-prompts: 64,   --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc64,   argv: {--max-concurrency: 64,   --num-prompts: 128,  --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc128,  argv: {--max-concurrency: 128,  --num-prompts: 256,  --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc256,  argv: {--max-concurrency: 256,  --num-prompts: 512,  --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc512,  argv: {--max-concurrency: 512,  --num-prompts: 1024, --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc1024, argv: {--max-concurrency: 1024, --num-prompts: 2048, --random-input-len: 1024, --random-output-len: 256}}
      - {name: ctx1k-c1,    argv: {--max-concurrency: 1,  --num-prompts: 60, --random-input-len: 1024,   --random-output-len: 128}}
      - {name: ctx8k-c1,    argv: {--max-concurrency: 1,  --num-prompts: 60, --random-input-len: 8192,   --random-output-len: 128}}
      - {name: ctx32k-c1,   argv: {--max-concurrency: 1,  --num-prompts: 60, --random-input-len: 32768,  --random-output-len: 128}}
      - {name: ctx64k-c1,   argv: {--max-concurrency: 1,  --num-prompts: 60, --random-input-len: 65536,  --random-output-len: 128}}
      - {name: ctx128k-c1,  argv: {--max-concurrency: 1,  --num-prompts: 60, --random-input-len: 131072, --random-output-len: 128}}
      - {name: ctx1k-c16,   argv: {--max-concurrency: 16, --num-prompts: 64, --random-input-len: 1024,   --random-output-len: 128}}
      - {name: ctx8k-c16,   argv: {--max-concurrency: 16, --num-prompts: 64, --random-input-len: 8192,   --random-output-len: 128}}
      - {name: ctx32k-c16,  argv: {--max-concurrency: 16, --num-prompts: 64, --random-input-len: 32768,  --random-output-len: 128}}
      - {name: decodelong-c1,  argv: {--max-concurrency: 1,  --num-prompts: 4,  --random-input-len: 1024, --random-output-len: 4096}}
      - {name: decodelong-c16, argv: {--max-concurrency: 16, --num-prompts: 32, --random-input-len: 1024, --random-output-len: 4096}}
      - *eval
  server:
    argv:
      --max-num-seqs: 128

# the conc1024 crash with at most 128 sequences per engine (coordinator, 2026-11-08): if it passes, the 256-per-engine
# batch is implicated; a configuration option, not a fix. conc1024 then queues at 512 in flight; conc64 after it as a check
kimi-vllm-4n-dp4tp8-ep32-seqs128:
  inherits: kimi-vllm-4n-dp4tp8-ep32-conc1024
  client:
    passes:
      - *warmup
      - *ep32_conc1024
      - {name: conc64, argv: {--max-concurrency: 64, --num-prompts: 128, --random-input-len: 1024, --random-output-len: 256}}
  server:
    argv:
      --max-num-seqs: 128

# the same with CUDA_LAUNCH_BLOCKING=1, so that the error comes from the kernel that faults, if the crash repeats on other
# GPUs (a kernel inside a CUDA graph still reports at the graph's launch)
kimi-vllm-4n-dp4tp8-ep32-conc1024-blocking:
  inherits: kimi-vllm-4n-dp4tp8-ep32-conc1024
  env:
    CUDA_LAUNCH_BLOCKING: "1"

# EP32 on deepep_v2 (coordinator): at 4 nodes the all-gather sends every token to all 32 GPUs, DeepEP only to the ranks
# holding its experts. venv/deepep, CUDA_HOME for DeepEP's JIT, as kimi-vllm-2n-dp2tp8-ep16-deepep
kimi-vllm-4n-dp4tp8-ep32-deepep:
  inherits: kimi-vllm-4n-dp4tp8-ep32
  install_group: deepep
  env:
    CUDA_HOME: /cvmfs/soft.computecanada.ca/easybuild/software/2023/x86-64-v3/Core/cudacore/13.2.0
  server:
    argv:
      --all2all-backend: deepep_v2

# its bring-up: both warm-ups (the conc64-shaped one compiles DeepEP's kernels for mixed batches), conc1, conc64, conc1024.
# conc1 with 8 requests: one took 28.75 s on 4 nodes (job 1272042), 60 would not leave room for the others in the hour
kimi-vllm-4n-dp4tp8-ep32-deepep-bringup-notune:
  inherits: kimi-vllm-4n-dp4tp8-ep32-deepep
  max_duration: 3420
  client:
    passes:
      - *warmup
      - {name: warmup-mixed, argv: {--max-concurrency: 64, --num-prompts: 128, --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc1,    argv: {--max-concurrency: 1,    --num-prompts: 8,    --random-input-len: 1024, --random-output-len: 256}}
      - {name: conc64,   argv: {--max-concurrency: 64,   --num-prompts: 128,  --random-input-len: 1024, --random-output-len: 256}}
      - *ep32_conc1024
  server:
    argv:
      --no-enable-flashinfer-autotune: true

# -----------------------------------------------------------------------------
# Smokes of the machinery (launcher, passes, eval) on a small model, before spending Kimi time
# -----------------------------------------------------------------------------

_kimi_smoke:
  inherits: _kimi
  max_duration: 1800
  client:
    argv:
      --model: meta-llama/Llama-3.1-8B-Instruct
    passes:
      - {name: conc4,      argv: {--max-concurrency: 4,  --num-prompts: 16, --random-input-len: 1024, --random-output-len: 256}}
      - {name: ctx4k-c4,   argv: {--max-concurrency: 4,  --num-prompts: 8,  --random-input-len: 4096, --random-output-len: 512}}
      - name: eval
        eval:
          tasks: [milabench_gsm8k, milabench_arc_challenge, milabench_gpqa_diamond]
          limit: 20
          num_concurrent: 16
          gen_kwargs: {max_gen_toks: 2048, temperature: 0}

kimi-smoke-atom:
  inherits: _kimi_smoke
  # disabled: smoke of the machinery, not part of the study
  enabled: false
  server:
    backend: atom
    argv:
      --model: meta-llama/Llama-3.1-8B-Instruct
      -tp: 1
      --max-model-len: 8192
      --enforce-eager: true

# same layout as the Kimi 2-node entries (DP2 x TP8: every node full). With fewer GPUs per node than the
# DP slice, the RCCL group guesses its device from the global rank (rank % GPUs) and the worker fails with
# "Expected tensor on cuda:1 but found tensor on cuda:0".
kimi-smoke-atom-2n-dp2:
  inherits: kimi-smoke-atom
  # disabled: smoke of the machinery, not part of the study
  enabled: false
  num_machines: 2
  tags:
    - multinode
    - kimi-study
  requires_capabilities:
    - "len(nodes) >= ${..num_machines}"
  server:
    multinode: dp
    dp_local: 1
    argv:
      -tp: "{gpu_count}"

kimi-smoke-vllm-2n-dp2:
  inherits: _kimi_smoke
  # disabled: smoke of the machinery, not part of the study
  enabled: false
  num_machines: 2
  tags:
    - multinode
    - kimi-study
  requires_capabilities:
    - "len(nodes) >= ${..num_machines}"
  server:
    backend: vllm
    multinode: dp
    dp_local: 1
    argv:
      meta-llama/Llama-3.1-8B-Instruct: true
      --tensor-parallel-size: 1
      --max-model-len: 8192

# -----------------------------------------------------------------------------
# vLLM Kimi-K3 bring-up (ROCm): after loading, the workers spin on the CPU (3 threads at 100%, GPUs idle) and
# the engine waits forever ("No available shared memory broadcast block"), on 1 node as on 2 (TP8 x PP2).
# Short entries to bisect it; same server flags as kimi-vllm-tp8 plus one change each.
# -----------------------------------------------------------------------------

_kimi_vllm_debug:
  inherits: kimi-vllm-tp8
  max_duration: 2400
  client:
    passes:
      - {name: conc1,  argv: {--max-concurrency: 1,  --num-prompts: 2,  --random-input-len: 1024, --random-output-len: 128}}
      - {name: conc16, argv: {--max-concurrency: 16, --num-prompts: 32, --random-input-len: 1024, --random-output-len: 128}}

kimi-vllm-tp8-debug-eager:
  inherits: _kimi_vllm_debug
  # disabled: bring-up only
  enabled: false
  server:
    argv:
      --enforce-eager: true

# The "hang" is Inductor compiling vLLM's grouped_topk router (@torch.compile in
# fused_moe/router/grouped_topk_router.py): Triton's AMD backend (make_amdgcn) stays in LLVM for tens of
# minutes, even with --enforce-eager. TORCHDYNAMO_DISABLE turns torch.compile into plain eager code.
kimi-vllm-tp8-debug-nodynamo:
  inherits: kimi-vllm-tp8-debug-eager
  # disabled: bring-up only
  enabled: false
  env:
    TORCHDYNAMO_DISABLE: "1"
