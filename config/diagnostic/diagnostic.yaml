include:
  - ../_defaults.yaml
  - ../synthetic.yaml

# Dummy torchrun + srun multi-node smoke test.
# Main keeps metrics locally; workers are nolog via TorchrunSrun.
_torchsrun:
  inherits: _defaults
  definition: ../../benchmarks/diagnostic/torchsrun
  install_group: torch
  weight: 0.0
  # Smoke all-reduce; fail fast if rendezvous hangs (default is 600s).
  max_duration: 120
  tags:
    - multinode
    - diagnostic
    - nobatch
  plan:
    method: njobs
    n: 1
  voir:
    options:
      stop: 30
  argv:
    --repeats: 30
    --warmup: 5
    --size-mb: 64

torchsrun:
  inherits: _torchsrun
  num_machines: 2
  enabled: true
  weight: 0
  requires_capabilities:
    - "len(nodes) >= ${..num_machines}"
  argv:
    --repeats: 30
    --warmup: 5
    --size-mb: 64

# -----------------------------------------------------------------------------
# Interconnect bandwidth (benchmarks/diagnostic/netbench), one entry per kind of
# link. Each entry scores only its headline numbers (GB/s, see HEADLINE in
# main.py); every other measurement is still in the .data file as "detail".
#
#   net-host        CPU <-> GPU        per-GPU H2D/D2H pinned, all GPUs at once
#   net-p2p         GPU <-> GPU        send/recv, every pair of a node
#   net-coll        GPUs of a node     collectives busbw (rccl-tests style)
#   net-inter       GPU <-> GPU        send/recv GPU i <-> GPU i across nodes, per rail
#   net-coll-nodes  GPUs of all nodes  collectives busbw across nodes
#   net-net         node <-> node      ib_write_bw per RDMA NIC (+ TCP as detail)
#   net-latency       small messages   all_reduce/all_gather/sendrecv time in us at 8 B
#   net-latency-nodes small messages   same across nodes (lower is better; 8 B .. 1 MiB as detail)
# -----------------------------------------------------------------------------
_net:
  inherits: _defaults
  definition: ../../benchmarks/diagnostic/netbench
  install_group: torch
  weight: 0.0
  max_duration: 600
  num_machines: 1
  enabled: true
  tags:
    - diagnostic
    - network
    - nobatch
  plan:
    method: njobs
    n: 1
  argv:
    --size-mb: 256
    --coll-sizes-mb: "1,16,256,1024"
    --repeats: 20
    --warmup: 5

# tags are merged along inherits: each template adds its one monitor tag
_net_node:
  inherits: _net
  tags:
    - multigpu

_net_nodes:
  inherits: _net
  num_machines: 2
  tags:
    - multinode
  requires_capabilities:
    - "len(nodes) >= ${..num_machines}"

net-host:
  inherits: _net_node
  argv:
    --tests: host

net-p2p:
  inherits: _net_node
  argv:
    --tests: p2p

net-coll:
  inherits: _net_node
  argv:
    --tests: coll
    --coll-groups: intra

net-inter:
  inherits: _net_nodes
  argv:
    --tests: inter

net-coll-nodes:
  inherits: _net_nodes
  argv:
    --tests: coll
    --coll-groups: world

net-net:
  inherits: _net_nodes
  argv:
    --tests: net

net-latency:
  inherits: _net_node
  argv:
    --tests: latency
    --coll-groups: intra

net-latency-nodes:
  inherits: _net_nodes
  argv:
    --tests: latency
    --coll-groups: world

# -----------------------------------------------------------------------------
# GPU memory bandwidth (netbench "hbm" test): copy / read / write / triad on every
# GPU at once; scored on triad GB/s per GPU (counts read + write bytes).
# -----------------------------------------------------------------------------
gpu-hbm:
  inherits: _defaults
  definition: ../../benchmarks/diagnostic/netbench
  install_group: torch
  weight: 0.0
  max_duration: 300
  num_machines: 1
  enabled: true
  tags:
    - diagnostic
    - multigpu
    - nobatch
  plan:
    method: njobs
    n: 1
  argv:
    --tests: hbm
    --hbm-size-mb: 4096
    --repeats: 20
    --warmup: 5

# -----------------------------------------------------------------------------
# Storage throughput of $MILABENCH_BASE/data (benchmarks/diagnostic/storage).
# O_DIRECT so the page cache does not hide the disks; GB/s across all workers.
# Read files are created on first use in data/storage and kept.
#
#   storage-write   sequential write, one 2 GiB file per worker
#   storage-read    sequential read, one 2 GiB file per worker
#   storage-small   200k x 128 KiB files (dataset-like), files/s as detail
# -----------------------------------------------------------------------------
_storage:
  inherits: _defaults
  definition: ../../benchmarks/diagnostic/storage
  install_group: torch
  weight: 0.0
  max_duration: 600
  num_machines: 1
  enabled: true
  tags:
    - diagnostic
    - storage
    - multigpu
    - nobatch
  plan:
    method: njobs
    n: 1
  argv:
    --workers: 32
    --file-gb: 2
    --block-kb: 4096
    --small-kb: 128
    --small-count: 200000
    --repeats: 10

storage-write:
  inherits: _storage
  argv:
    --tests: write

storage-read:
  inherits: _storage
  argv:
    --tests: read

storage-small:
  inherits: _storage
  argv:
    --tests: small

# -----------------------------------------------------------------------------
# Ray cluster placement smoke test (independent of vllm: vllm's own
# vllm/platforms/cpu.py forces the local "mp" executor whenever world_size > 1
# on CPU, so the vllm-nodes benchmarks below never actually exercise
# multi-node Ray). Pins one task per node via a STRICT_SPREAD placement
# group and checks each ran on a distinct hostname.
# -----------------------------------------------------------------------------
_ray_smoke:
  inherits: _defaults
  definition: ../../benchmarks/diagnostic/ray_smoke
  install_group: torch
  weight: 0.0
  max_duration: 300
  tags:
    - multinode
    - diagnostic
    - nobatch
    - ray
  plan:
    method: njobs
    n: 1
  argv:
    --repeats: 30
    --warmup: 5
    --size-mb: 64

ray-cluster-smoke:
  inherits: _ray_smoke
  num_machines: 2
  enabled: true
  weight: 0
  requires_capabilities:
    - "len(nodes) >= ${..num_machines}"

ray-cluster-smoke-3nodes:
  inherits: _ray_smoke
  num_machines: 3
  enabled: true
  weight: 0
  requires_capabilities:
    - "len(nodes) >= ${..num_machines}"

ray-cluster-smoke-4nodes:
  inherits: _ray_smoke
  num_machines: 4
  enabled: true
  weight: 0
  requires_capabilities:
    - "len(nodes) >= ${..num_machines}"

# -----------------------------------------------------------------------------
# Multi-node Ray + vLLM CPU smoke (reuse benchmarks/vllm).
# Tiny OPT-125m (12 heads / 12 layers) so TP=2|4 and PP=2|4 are divisible.
# Goal: exercise milabench RayCluster + vllm serve path before GPU multi-node.
# -----------------------------------------------------------------------------
_vllm:
  inherits: _defaults
  definition: ../../benchmarks/vllm
  group: vllm
  install_group: torch
  weight: 0.0
  tags:
    - diagnostic
    - vllm
    - nobatch
  server:
    argv:
      --served-model-name: model
      --dtype: float32
  client:
    argv:
      --model: facebook/opt-125m
      --served-model-name: model
      --request-rate: inf
      --dataset-name: random
      --label: milabench
      --backend: openai
      --num-prompts: 4
      --endpoint: /v1/completions
      --ready-check-timeout-sec: 1800

_vllm_nodes:
  inherits: _vllm
  num_machines: 2
  max_duration: 1800
  enabled: true
  weight: 0
  requires_capabilities:
    - "len(nodes) >= ${..num_machines}"
  plan:
    method: njobs
    n: 1
  tags:
    - multinode
    - diagnostic
  env:
    # GiB reserved for KV cache on the CPU backend
    VLLM_CPU_KVCACHE_SPACE: "4"
  # Loosen Ray's node liveness check so a startup CPU/network blip isn't
  # mistaken for a dead node -- previously exported job-wide in
  # trilium_vllm_run.sbatch, now scoped to just this benchmark.
  ray:
    env:
      RAY_health_check_initial_delay_ms: "30000"
      RAY_health_check_period_ms: "5000"
      RAY_health_check_timeout_ms: "30000"
      RAY_health_check_failure_threshold: "10"
  client:
    argv:
      --dataset-name: random
      # Random dataset defaults (input 1024 / output 128) already exceed the
      # server's --max-model-len: 256 below before even accounting for the
      # BPE encode/decode round-trip on random token ids, which can further
      # shrink or grow the re-tokenized prompt vllm actually sees server-side
      # ("VLLMValidationError: max context length is 256 ... total of at
      # least 257"). Keep well under the cap instead of relying on incidental
      # tokenizer round-trip behavior to just barely squeak under it.
      --random-input-len: 64
      --random-output-len: 64
      --num-prompts: 4
      --max-concurrency: 1
      --ready-check-timeout-sec: 1800
  server:
    argv:
      facebook/opt-125m: true
      --distributed-executor-backend: ray
      --dtype: float32
      --max-model-len: 256
      --max-num-seqs: 1

# Tensor parallel across nodes (TP == num_machines, PP = 1)
vllm-opt-125m-fp32-tp-nodes:
  inherits: _vllm_nodes
  num_machines: 2
  server:
    argv:
      --tensor-parallel-size: 2
      --pipeline-parallel-size: 1

vllm-opt-125m-fp32-tp-4nodes:
  inherits: _vllm_nodes
  num_machines: 4
  server:
    argv:
      --tensor-parallel-size: 4
      --pipeline-parallel-size: 1

# Pipeline parallel across nodes (PP == num_machines, TP = 1)
vllm-opt-125m-fp32-pp-nodes:
  inherits: _vllm_nodes
  num_machines: 2
  server:
    argv:
      --tensor-parallel-size: 1
      --pipeline-parallel-size: 2

vllm-opt-125m-fp32-pp-4nodes:
  inherits: _vllm_nodes
  num_machines: 4
  server:
    argv:
      --tensor-parallel-size: 1
      --pipeline-parallel-size: 4
