system:
  arch: rocm

  # Forwarded into every benchmark process (survives WorkingDir's `env -` wipe).
  # Use "<FORWARD>" to copy a var from milabench's environment at load time
  # (resolved to a concrete value before the system state is used/saved).
  env:
    ROCM_PATH: <FORWARD>
    ROCM_HOME: <FORWARD>
    # amdsmi's bundled libamd_smi.so needs rocm_sysdeps; without it torch
    # import fails with KeyError: 'libamd_smi.so' under a cleared environment.
    # Set in the launch script (rerun.sh / clean_run.sh): ROCm libs, rocm_sysdeps,
    # and $venv/lib/python3.12/site-packages/mori for amd_mori (vLLM MoE).
    LD_LIBRARY_PATH: <FORWARD>
    # Required when libamd_smi is preloaded; otherwise RCCL aborts on init.
    HSA_NO_SCRATCH_RECLAIM: "1"
    # Optional: copy LD_PRELOAD from the parent shell (e.g. clean_run.sh).
    LD_PRELOAD: "<FORWARD>"

  nodes:
    - name: local
      ip: 127.0.0.1
      main: true
      user: amd


