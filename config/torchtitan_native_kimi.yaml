# Kimi K3 pre-training (TorchTitan's upstream kimi_k3 model, text only, random init) on Trillium B200:
# scripts/trillium/kimi-train/README.md.
#
#   scripts/trillium/kimi-train/k3_train.sh --nodelist trig0145 k3-1n-l4
#
# Full width (hidden 7168, 896 experts, top-16, 2 shared, LatentMoE 3584), truncated to the first --n-layers:
# 4 = KDA dense, KDA-MoE, KDA-MoE, MLA-MoE (every layer type). Per GPU one 8192-token sequence per micro-batch,
# full AC, compile regions, experts over the 8 GPUs of a node (EP8; dense FSDP over the same 8). FineWeb with
# DeepSeek-V3.1's tokenizer (tt_native/assets.py: K3's own is tiktoken, which TorchTitan cannot read).
# Precision: FP32 master weights and BF16 Adam moments (as GLM-5); -bf16 entries hold parameters, gradients and
# moments in BF16 (training.dtype bfloat16), no FP32 copy.
#
# Measured on 1 node with random tokens (job 1260631, 8 steps): 4 layers BF16 150 GiB peak, 0.74 s per step;
# 2 layers 89 GiB BF16, 96 GiB FP32 master.

include:
  - torchtitan_native.yaml

_k3:
  inherits: _tt_native
  max_duration: 1800
  num_machines: 1
  voir:
    options:
      skip: 5
      stop: 100
      stop_seconds: 0
  argv:
    --model: kimi_k3
    --flavor: Kimi-K3
    --stacked-layout: torchtitan
    --seq-len: 8192
    --microbatch-sequences: 1
    --compile: regions
    --ac: full
    --dataset: fineweb
    --samples: 500000
    --max-documents: 64
    --layout: fsdp
    --ep: 8
    --adam-moments: bf16
    --training-dtype: float32

# --- 1 node: loss check on FineWeb (105 steps, loss every 10) ---
k3-1n-l4:
  inherits: _k3
  argv:
    --n-layers: 4
k3-1n-l4-bf16:
  inherits: k3-1n-l4
  argv:
    --training-dtype: bfloat16

# --- 2 nodes: PP2 x EP8, 2 layers per stage (a stage = a node), 16 micro-batches per step (1F1B),
#     step 20 traced on every rank (pipeline hop = NCCL send/recv between the two nodes) ---
k3-pp2-l4:
  inherits: _k3
  num_machines: 2
  voir:
    options:
      skip: 5
      stop: 40
  argv:
    --n-layers: 4
    --layout: pp2-fsdp
    --pp-microbatches: 16
    --profile-freq: 20
k3-pp2-l4-bf16:
  inherits: k3-pp2-l4
  argv:
    --training-dtype: bfloat16

# --- 4 nodes, PP4 GPipe: all 64 micro-batches in flight on every stage, about as many activation bytes as the
#     worst stages of PP48 1F1B (stage s holds 48 - s, with a deeper AttnRes stack). 6 layers: stages 1-2 hold 2 MoE
#     layers and no output. -4k: 4096-token micro-batches, the fallback (PP48 at 256 micro-batches keeps 8.4M
#     tokens per step; 1F1B keeps 48 - s in flight whatever the count, so 64 here) ---
k3-pp4-l6-gpipe:
  inherits: _k3
  num_machines: 4
  voir:
    options:
      skip: 3
      stop: 10
  argv:
    --n-layers: 6
    --layout: pp4-fsdp
    --pp-schedule: GPipe
    --pp-microbatches: 64
    --training-dtype: bfloat16
k3-pp4-l6-gpipe-4k:
  inherits: k3-pp4-l6-gpipe
  argv:
    --seq-len: 4096
# GPipe failed at step 1 (job 1261381: "Loss or gradient norm is not finite"; GPipe never ran with the AttnRes stage).
# 1F1B instead: stage s holds 4 - s micro-batches, so stage 1 (3 in flight) minus stage 2 (2), both 2 MoE layers and
# no output, is one micro-batch in flight, measured
k3-pp4-l6:
  inherits: k3-pp4-l6-gpipe
  argv:
    --pp-schedule: 1F1B
    --pp-microbatches: 16
# k3-pp4-l6 failed after step 1 on 3 node sets (jobs 1261433, 1261501, 1261567: per-stage gradient norms, then
# "Invalid access of peer GPU memory over nvlink"); its stage 0 (embedding + dense layer 0) has no MoE layer, which
# skips the quantile-balancing hook's all-reduce. 7 layers: every stage has an MoE layer (emb + 0-1 / 2-3 / 4-5 / 6 + out)
k3-pp4-l7:
  inherits: k3-pp4-l6
  argv:
    --n-layers: 7
# The GPipe test of the review with an MoE layer on every stage (k3-pp4-l6-gpipe had none on stage 0, job 1261381).
# Its last stage also keeps 64 micro-batches with the output and loss, which PP48's never does (1 in flight).
k3-pp4-l7-gpipe:
  inherits: k3-pp4-l6-gpipe
  argv:
    --n-layers: 7
# 8192 did not fit (job 1261657: no step 2, allocator failures on stages 1-3); the fallback's 4096-token micro-batches:
# -gpipe-4k for memory (64 in flight), -4k for time (1F1B, 32 micro-batches = the tokens per step of k3-pp4-l7)
k3-pp4-l7-gpipe-4k:
  inherits: k3-pp4-l7-gpipe
  argv:
    --seq-len: 4096
k3-pp4-l7-4k:
  inherits: k3-pp4-l7
  argv:
    --seq-len: 4096
    --pp-microbatches: 32
# Allocator (review option c): reserved ran ~50 GiB above allocated on MoE stages (job 1261618), and the GPipe tests
# failed with "expandable_segments: memory mapping failed" (expandable segments already on: benchfile sets
# PYTORCH_ALLOC_CONF=expandable_segments:True). garbage_collection_threshold frees unused cached blocks of every pool
# (stream) once the cap's threshold is passed; it only acts with a memory fraction set (0.99: 176.6 of 178.3 GiB)
k3-pp4-l7-gpipe-gc:
  inherits: k3-pp4-l7-gpipe
  env:
    PYTORCH_ALLOC_CONF: "expandable_segments:True,per_process_memory_fraction:0.99,garbage_collection_threshold:0.8"
# no effect: the same step-1 peaks to 0.01 GiB and no step 2 (job 1261880); Muon alone: worker exit after step 1
# (1261917), Muon + gc: no step 2 (1261943), step-1 peaks 164-167 GiB on stages 1-3 in both
# The failures' "free: ~18 MiB, total: 191,495,471,104" is the driver's count: the device is full, ~161 GiB reserved by
# torch and the rest outside it. The native allocator instead of expandable segments; its out-of-memory error says how
# much of the reserved memory is unallocated. (TORCH_NCCL_AVOID_RECORD_STREAMS: not read by this torch build.)
k3-pp4-l7-gpipe-noexp:
  inherits: k3-pp4-l7-gpipe
  env:
    PYTORCH_ALLOC_CONF: "expandable_segments:False"
# its 1F1B companion (the GPipe output stage may hold the run at step 1, as in 1262015): steady state after step 2
k3-pp4-l7-noexp:
  inherits: k3-pp4-l7
  env:
    PYTORCH_ALLOC_CONF: "expandable_segments:False"
# The native allocator failed at a 6.89 GiB request in FSDP's gradient cast for the FP32 reduction, with 81 GiB
# allocated and 86 GiB reserved but unallocated (job 1262141): BF16 reduction (no cast; the experts' group is one rank)
k3-pp4-l7-gpipe-rbf16:
  inherits: k3-pp4-l7-gpipe
  argv:
    --grad-reduce: bf16
k3-pp4-l7-rbf16:
  inherits: k3-pp4-l7
  argv:
    --grad-reduce: bf16
# Timeouts (job 1262377): the init timeout now reaches every group before step 1, the pipeline's included
# (configs._patch_init_timeouts); its 2-rank P2P child groups, created during step 1, keep it for the whole run.
# Check on 4 nodes: 30 s is shorter than stage 3's wait for its first shape metadata (~55 s: stages 0-2 infer one after
# another, ~10 / 20 / 25 s, job 1262230), so this must fail there, on the pipeline group, after 30 s
k3-pp4-l7-rbf16-t30:
  inherits: k3-pp4-l7-rbf16
  argv:
    --init-timeout-seconds: 30
# What the ~21 s of single-core CPU per stage before step 1 is: the same without torch.compile
k3-pp4-l7-rbf16-eager:
  inherits: k3-pp4-l7-rbf16
  argv:
    --compile: eager
# Eager: the same ~10 / 20 / 26 / 14 s per stage (job 1262562); the native allocator: ~9 / 10 / 15 / 12 s (job 1262143,
# FP32 reduction) against ~10 / 23 / 25 / 14 with expandable segments (1261618). Native allocator + BF16 reduction on
# the stand-in: does it fit (the FP32 reduction did not, 1262141), and what does it leave of the per-stage warm-up
k3-pp4-l7-gpipe-rbf16-noexp:
  inherits: k3-pp4-l7-gpipe-rbf16
  env:
    PYTORCH_ALLOC_CONF: "expandable_segments:False"
# Fewer layers (review option b): a stage of one MoE layer with 64 micro-batches in flight. 5 layers with no extra
# weight for the embedding / output: emb + 0-1 / 2 / 3 / 4 + out, so stages 1-2 hold one MoE layer and no output
k3-pp4-l5-gpipe:
  inherits: k3-pp4-l6-gpipe
  argv:
    --n-layers: 5
    --pp-first-stage-less-layers: 0
    --pp-last-stage-less-layers: 0
# GPipe's last stage also keeps 64 micro-batches with the output and loss (PP48's keeps 1): it hit the memory limit and
# held the run at step 1 (job 1262015, all failures on rank 24). 1F1B on the same split, for the steady state after
# step 2: steady(64 in flight) = this run's steady + (k3-pp4-l5-gpipe step 1 - this run's step 1)
k3-pp4-l5:
  inherits: k3-pp4-l5-gpipe
  argv:
    --pp-schedule: 1F1B
    --pp-microbatches: 16
# PP48's last stage at depth (K3-TRN-04, job 1262896: stage 47 = layer 92 + output ran out of memory in its first
# 1F1B micro-batches; 74.7 GiB reserved on the stand-in's last stage, job 1262576). Layer 92 receives 8 AttnRes blocks
# (12-layer blocks start at layers 0, 12, ..., 84); the stand-ins' last stages received 1. 8 layers in 1-layer blocks,
# split emb + 0-2 / 3-4 / 5-6 / 7 + out: stage 3 = layer 7 (MLA + MoE, as layer 92) + output receives 7 blocks and
# holds 8 after its own; 128 micro-batches as PP48. Memory snapshot at step 3 and at the first out-of-memory (the pack's
# allocator observer; TorchTitan's own exit dump never fires at this pin); one [k3-mem] line per micro-batch on the last
# stage. -m16: 16 micro-batches; -4k: 4096-token micro-batches, 256 per step (the same tokens per step)
k3-pp4-l8-depth:
  inherits: k3-pp4-l7-rbf16
  voir:
    options:
      skip: 2
      stop: 3
  argv:
    --n-layers: 8
    --attn-res-block-size: 1
    --pp-first-stage-less-layers: 0
    --pp-last-stage-less-layers: 1
    --pp-microbatches: 128
    --memory-snapshot-freq: 3
    --pp-memory-log: "1"
    --log-freq: 1
k3-pp4-l8-depth-m16:
  inherits: k3-pp4-l8-depth
  argv:
    --pp-microbatches: 16
k3-pp4-l8-depth-4k:
  inherits: k3-pp4-l8-depth
  argv:
    --seq-len: 4096
    --pp-microbatches: 256
# k3-pp4-l8-depth (job 1263416): the last stage's allocated memory grows by 0.875 GiB per micro-batch and drops at the
# next step: out of memory in step 2 (169.2 GiB reserved at step 1). 0.875 GiB = the stage's received inputs (hidden + 7
# AttnRes blocks, [8192, 7168] BF16 each): torch's schedule keeps every micro-batch's loss tensor until the step ends,
# its graph's AccumulateGrad nodes keep those leaves (reproduced on CPU, 2-rank gloo 1F1B). -m64ga2: half the
# micro-batches per schedule step, two per optimizer step (job 1263463: drops between the two, 139.8 GiB reserved at
# step 2). -detach: 128 micro-batches with --pp-detach-losses (the schedule keeps a detached loss after its backward)
k3-pp4-l8-depth-m64ga2:
  inherits: k3-pp4-l8-depth
  argv:
    --pp-microbatches: 64
    --grad-accum: 2
k3-pp4-l8-depth-detach:
  inherits: k3-pp4-l8-depth
  argv:
    --pp-detach-losses: "1"

# --- One copy over the machine: PP x EP8 (expert groups inside a node), at most 2 layers per stage, an MoE layer on
#     every stage (PP4 failed with a stage of none: jobs 1261433-1261567; with both less-layers options at 0, stage 0
#     holds the embedding + layers 0-1 and the last stages one layer each). BF16 parameters: the FP32 master did not
#     fit 2 MoE layers + the output on a stage (job 1261155). 1F1B, 128 micro-batches per data-parallel rank: bubble
#     (PP-1)/(m+PP-1) = 27% at PP48, as GLM-5's pp13 runs; 1,024 sequences = 8.4M tokens per step. 20 steps, none
#     traced. Before step 1 torch infers the stage shapes one stage after another, a real forward then a backward
#     each: ~10-25 s and ~5 s per stage on 4 nodes (jobs 1262230, 1262576), 10-28 s forward at 48 (job 1262377). The
#     longest wait, stage 0's for the backward metadata, is ~48 x 21-28 + 47 x 5 s = 21-26 min (est.): init timeout
#     60 min, which configs._patch_init_timeouts applies to every group (the pipeline's: 600 s before, job 1262377);
#     the pipeline's P2P child groups keep it after step 1 (README, "Running the scale rows").
#     max_duration: 2 min of startup (1262377) + the chain + 20 steps of 50-70 s (est.) ~ 50 min, so 90 min.
#     A log line per step (TorchTitan's default here, 10, printed steps 1, 10 and 20 only: job 1263259), for the
#     cancel rule on steps and each step's peak reserved memory. --pp-detach-losses: without it the last stage keeps
#     every micro-batch's received inputs until the step ends, ~1 GiB each at layer 92 (hidden + 8 AttnRes blocks):
#     126 GiB over 128 micro-batches, what ran K3-TRN-04 out of memory (stand-in: job 1263416). ---
_k3_scale:
  inherits: _k3
  num_machines: 48
  max_duration: 5400
  voir:
    options:
      skip: 3
      stop: 17
  argv:
    --layout: pp48-fsdp
    --pp-microbatches: 128
    --training-dtype: bfloat16
    --pp-first-stage-less-layers: 0
    --pp-last-stage-less-layers: 0
    --init-timeout-seconds: 3600
    --log-freq: 1
    --pp-detach-losses: "1"
# Full size needs the BF16 gradient reduction (the campaign's default is FP32): with FP32 a stage of 2 MoE layers runs
# out of memory with the in-flight load of PP48's worst stages (k3-pp4-l7-gpipe with AdamW, the allocator's garbage
# collection, Muon, Muon + gc, the native allocator: jobs 1261657-1262141); with BF16, 143.3 GiB reserved on the
# stand-in's 2-MoE-layer stages after step 2 (job 1262207)
k3-pp48-full-rbf16:
  inherits: _k3_scale
  argv:
    --grad-reduce: bf16
# 40 nodes, 78 layers (19 MLA, 59 KDA), the same 2 MoE layers per stage: stage 0 = embedding + layers 0-1, stages 1-37
# two layers each, 38 = layer 76, 39 = layer 77 + output (TorchTitan's split, checked); bubble 23%
k3-pp40-l78-rbf16:
  inherits: k3-pp48-full-rbf16
  num_machines: 40
  argv:
    --layout: pp40-fsdp
    --n-layers: 78
# Fallback of k3-pp48-full-rbf16 with the FP32 reduction: one MoE layer per stage fits, ~120 GiB reserved after step 2
# with 64 micro-batches in flight (1F1B steady state of k3-pp4-l5, job 1262121, + the in-flight cost of
# k3-pp4-l5-gpipe at step 1, job 1262015): 49 layers (12 MLA, 37 KDA), stage 0 = embedding + layers 0-1, then one each
k3-pp48-l49:
  inherits: _k3_scale
  argv:
    --n-layers: 49
