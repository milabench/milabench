include:
  - _defaults.yaml

vllm_tt:
  inherits: _defaults
  definition: ../benchmarks/vllm
  group: vllm
  install_group: torch
  enabled: true
  tags:
    - inference
    - vllm

  plan:
    method: njobs
    n: 1
  
  # Inference Server Args
  server:
   argv:
      --served-model-name: model
      --dtype: bfloat16

  # Benchmarking client Args
  client:
    argv:
      # --model: meta-llama/Llama-3.2-3B-Instruct
      # --served-model-name: meta-llama/Llama-3.2-3B-Instruct
      --request-rate: inf
      --dataset-name: random
      --label: milabench
      --backend: openai 
      --num-prompts: 198
      --max-concurrency: 1
      --endpoint: /v1/completions
      --ready-check-timeout-sec: 1200
      --external: true
      --host: 127.0.0.1
      --port: 8000
      --input-len: 4096
      --output-len: 2048
