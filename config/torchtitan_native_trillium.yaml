# --- B-Q-strong: fixed global batch of 52 x 8 x 24k tokens (10.2M) ----------
# Gradient accumulation of 24k microbatches: 4 at 13 nodes, 2 at 26, 1 at 52.
# B-Q-weak uses the A-Q entries at 1-52 nodes. At 47 nodes the A-Q, C and F1 entries run as they are
# (--nodes 47; hsdp16 needs an even count), but this batch does not divide: 2496 sequences on 376 GPUs is
# 6.64 per GPU. No n47 entry (scripts/trillium/DESIGN.md, "If only 47 nodes").

tri-bqs-fsdp-n13:
  inherits: tri-aq-fsdp-24k
  num_machines: 13
  argv:
    --grad-accum: 4

tri-bqs-fsdp-n26:
  inherits: tri-aq-fsdp-24k
  num_machines: 26
  argv:
    --grad-accum: 2

tri-bqs-fsdp-n52:
  inherits: tri-aq-fsdp-24k
  num_machines: 52
  argv:
    --grad-accum: 1

# 39 nodes, the same batch: 8 sequences per GPU (32,768 tokens, more than the other points' 24k), no accumulation.
tri-bqs-fsdp-n39:
  inherits: tri-aq-fsdp-24k
  num_machines: 39
  argv:
    --grad-accum: 1
    --microbatch-sequences: 8

tri-bqs-hsdp8-n13:
  inherits: tri-aq-hsdp8-24k
  num_machines: 13
  argv:
    --grad-accum: 4

tri-bqs-hsdp8-n26:
  inherits: tri-aq-hsdp8-24k
  num_machines: 26
  argv:
    --grad-accum: 2

tri-bqs-hsdp8-n52:
  inherits: tri-aq-hsdp8-24k
  num_machines: 52
  argv:
    --grad-accum: 1

# --- C: precision -----------------------------------------------------------
# hsdp8 + torchtitan stacked layout, 24k: MXFP8 on every target linear,
# feed_forward.w13 included. C-speed at 1 and 52 nodes, C-loss at 13 nodes:
# 500 steps from seed 1234 on FineWeb, all measured (no warm-up skipped, as
# scripts/trillium/FORMAT.md asks), loss pushed every step (lr 3e-4, 10
# warm-up steps, AdamW: tt_native.configs).

tri-c-bf16:
  inherits: _tri
  argv:
    --layout: hsdp8
    --microbatch-sequences: 6
    --stacked-layout: torchtitan

tri-c-mxfp8:
  inherits: tri-c-bf16
  argv:
    --precision: mxfp8

# Selective AC also saves MXFP8's GEMMs (all of them: BF16 saves every second mm), which it otherwise recomputes.
tri-c-mxfp8-savemm:
  inherits: tri-c-mxfp8
  argv:
    --sac-save-scaled-mm: 1

# Full recompute treats BF16 and MXFP8 alike: FP8 without the selective AC save-list asymmetry.
tri-c-bf16-acfull:
  inherits: tri-c-bf16
  argv:
    --ac: full

tri-c-mxfp8-acfull:
  inherits: tri-c-mxfp8
  argv:
    --ac: full

tri-closs-bf16:
  inherits: tri-c-bf16
  max_duration: 5400
  voir:
    options:
      skip: 0
      stop: 500
      stop_seconds: 0
  argv:
    --seed: 1234
    # 500 steps x 104 GPUs x 24,576 tokens = 1.28e9 tokens: ~36 documents per GPU and step, 1.87 M documents (a sample
    # of 6,000 documents through the packer), 18,940 at most for a GPU. _tri's 500,000 would repeat after ~134 steps.
    # Staged in $SCRATCH/trillium/data (tt_trillium.sh, README.md)
    --samples: 2000000

tri-closs-mxfp8:
  inherits: tri-closs-bf16
  argv:
    --precision: mxfp8

# BF16 again, to compare the MXFP8 vs BF16 gap with the noise. Another seed:
tri-closs-bf16-seed2:
  inherits: tri-closs-bf16
  argv:
    --seed: 4321
tri-closs-mxfp8-seed2:
  inherits: tri-closs-bf16-seed2
  argv:
    --precision: mxfp8
tri-closs-bf16-seed3:
  inherits: tri-closs-bf16
  argv:
    --seed: 5678
tri-closs-mxfp8-seed3:
  inherits: tri-closs-bf16-seed3
  argv:
    --precision: mxfp8
# The same seed: tri-closs-bf16 again with TT_REPETITION=2 (a leading argument of tt_trillium.sh).

# --- F1: checkpoint save / load (after a short measurement) ------------------
# Folder: $TT_CKPT_ROOT/<run name> ($SCRATCH/trillium/checkpoints, set by the launcher), deleted after the load
# is timed. full = fp32 weights + AdamW moments + data loader state: 12 B/param
# (measured on a truncated model, Rorqual), ~0.32 TB for 26.9e9 params (est.);
# model = weights only in bf16, 2 B/param (~54 GB, est.), synchronous only.
# Two save / load repetitions per run: the first async_with_pinned_mem save also
# allocates the pinned host buffers (its blocked_s is an upper bound), the
# second reuses them.

tri-ckpt-full-sync:
  inherits: _tri
  voir:
    options:
      skip: 10
      stop: 10
      stop_seconds: 0
  argv:
    --layout: fsdp
    --checkpoint: full
    --checkpoint-async: disabled
    --checkpoint-repeats: 2

tri-ckpt-full-async:
  inherits: _tri
  voir:
    options:
      skip: 10
      stop: 10
      stop_seconds: 0
  argv:
    --layout: fsdp
    --checkpoint: full
    --checkpoint-async: async
    --checkpoint-repeats: 2

tri-ckpt-full-pinned:
  inherits: _tri
  voir:
    options:
      skip: 10
      stop: 10
      stop_seconds: 0
  argv:
    --layout: fsdp
    --checkpoint: full
    --checkpoint-async: async_with_pinned_mem
    --checkpoint-repeats: 2

tri-ckpt-model-sync:
  inherits: _tri
  voir:
    options:
      skip: 10
      stop: 10
      stop_seconds: 0
  argv:
    --layout: fsdp
    --checkpoint: model
    --checkpoint-async: disabled
    --checkpoint-repeats: 2

# --- R: reference run (4 nodes, FSDP, 12k, every ~3 h through the window) ----

tri-ref:
  inherits: tri-aq-fsdp-12k
  num_machines: 4
  voir:
    options:
      skip: 30
      stop: 100
      stop_seconds: 300

# --- Smoke tests (1 node, first 16 layers) -----------------------------------

tri-smoke:
  inherits: _tri
  num_machines: 1
  max_duration: 1200
  voir:
    options:
      skip: 10
      stop: 20
      stop_seconds: 0
  argv:
    --n-layers: 16

# MXFP8 (rows layout: feed_forward.w13 stays BF16) and with w13 (torchtitan layout).
tri-smoke-mxfp8:
  inherits: tri-smoke
  argv:
    --precision: mxfp8

tri-smoke-mxfp8-tt:
  inherits: tri-smoke-mxfp8
  argv:
    --stacked-layout: torchtitan
