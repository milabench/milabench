# Trillium B200 configs (8x B200 180 GB per node) for Qwen3.8-27B pre-training:
# experiment groups A-Q, B-Q, C, F1 and R of scripts/trillium/DESIGN.md.
#
#   scripts/trillium/qwen/tt_trillium.sh --nodes 13 tri-aq-hsdp8-24k
#
# Entries do not fix the node count (num_machines: 999 = every node of the
# allocation, capped by milabench), except B-Q-strong and R. Per GPU: sequences
# of 4096 tokens; "12k / 24k / 48k" = 12,288 / 24,576 / 49,152 tokens per GPU per
# step (global batch = tokens per GPU x GPUs, weak scaling). Defaults: selective
# AC, compile regions (no CUDA graphs), fp32 gradient reduction, BF16, rows
# stacked layout, 30 warm-up steps then a 5-minute measurement.
#
# Layouts (tt_native.configs.parallel_degrees):
#   fsdp        FSDP over all GPUs
#   hsdp8/16    shard over 8 / 16 GPUs (1 / 2 nodes), replicate across. hsdp16
#               needs an even node count: not part of the 1-node runs (the
#               launcher refuses it)
#   tp2/4-fsdp  TP in a node (at most 4: 4 KV heads), FSDP over the rest. Per DP
#               rank the microbatch is tp x the per-GPU tokens.
#   pp2/4-fsdp  1F1B over 2 / 4 stages (stage = contiguous rank block, so a stage
#               spans nodes), FSDP inside a stage. Pipeline microbatches of one
#               sequence; pp x 3 / 6 / 12 of them per step keep the per-GPU tokens.
# The torchtitan stacked layout needs the FSDP shard group to divide F = 17408
# (fails at 104 or 416 GPUs): "rows" stays the default; tri-c-* use torchtitan
# (hsdp8: shard group 8) so MXFP8 also covers feed_forward.w13.
#
# Expected memory per GPU (B200 180 GB ~ 178 GiB usable). Sharded state =
# 16 B/param x 26.9e9 / shard group; activations scale with the tokens per GPU.
# Rorqual measured ~12-18 GiB of working set at 12k with full AC (H100); selective
# AC and 24k / 48k are extrapolated. All values are estimates (est.), none measured
# on B200.
#
#   shard group   state     12k selective   24k selective   48k selective (est.)
#   8 (hsdp8)     50 GiB    ~85             ~120            OOM risk: use -acfull
#   16 (hsdp16)   25 GiB    ~60             ~95             ~165
#   104 (13 n)    3.9 GiB   ~40             ~75             ~145
#   416 (52 n)    1.0 GiB   ~37             ~72             ~142
#
# -acnone (no AC) roughly doubles the activations: expected to fit at 12k only.

include:
  - torchtitan_native.yaml

_tri:
  inherits: _tt_native
  max_duration: 2400
  num_machines: 999
  voir:
    options:
      skip: 30
      stop: 100
      stop_seconds: 300
  argv:
    --flavor: 27B
    --seq-len: 4096
    --microbatch-sequences: 3
    --compile: regions
    --ac: selective
    --dataset: fineweb
    --samples: 500000
    --max-documents: 64
    --layout: fsdp

