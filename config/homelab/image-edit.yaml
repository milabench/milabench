# -----------------------------------------------------------------------------
# vLLM-Omni (benchmarks/omni_edit: POST /v1/images/edits, the same edits / seeds / 1024x1024 / steps as the
# ComfyUI entries, so the two engines compare directly). Diffusers repos, downloaded by the prepare step.
# -----------------------------------------------------------------------------

_omni_edit:
  inherits: _omni
  definition: ../../benchmarks/omni_edit
  tags:
    - image-edit
  enabled: false

# Qwen-Image 2.1 BF16 (QwenImage21Pipeline): image.yaml's homelab-omni-qwen-image-21-bf16 snapshot (33 GB)
homelab-omni-edit-qwen-image-21-bf16:
  inherits: _omni_edit
  enabled: true
  weight: 1
  url: https://huggingface.co/Qwen/Qwen-Image-2.1
  server:
    argv:
      Qwen/Qwen-Image-2.1: true
  client:
    argv:
      --width: 1024
      --height: 1024
      --steps: 20

homelab-omni-edit-qwen-image-21-fp8:
  inherits: homelab-omni-edit-qwen-image-21-bf16
  server:
    argv:
      --quantization: fp8

# FLUX.2 klein 4B (Flux2KleinPipeline, Apache-2.0, 24 GB snapshot): the small point on the other engine
homelab-omni-edit-flux2-klein-4b:
  inherits: _omni_edit
  enabled: true
  weight: 1
  url: https://huggingface.co/black-forest-labs/FLUX.2-klein-4B
  server:
    argv:
      black-forest-labs/FLUX.2-klein-4B: true
  client:
    argv:
      --width: 1024
      --height: 1024
      --steps: 4
      --guidance: 1.0

# Qwen-Image-Edit 2511 (QwenImageEditPlusPipeline): true CFG 4, 20 steps, as the ComfyUI fp8 entry; online fp8
# (the 58 GB BF16 snapshot is one download for both). DISK: +58 GB
homelab-omni-edit-qwen-image-edit-2511-fp8:
  inherits: _omni_edit
  enabled: false
  weight: 1
  max_duration: 5400
  url: https://huggingface.co/Qwen/Qwen-Image-Edit-2511
  voir:
    options:
      stop: 8
  server:
    argv:
      Qwen/Qwen-Image-Edit-2511: true
      --quantization: fp8
  client:
    argv:
      --width: 1024
      --height: 1024
      --steps: 20
      --true-cfg: 4.0
      --negative-prompt: " "
      --max-steps: 9
