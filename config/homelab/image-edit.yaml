# 4-bit point: w4a8 transformer + NVFP4 (AWQ) encoder (~32 GB in memory)
homelab-comfyui-edit-minimax-h3-image-w4a8:
  name: homelab-comfyui-edit-minimax-h3-image-w4a8
  inherits: homelab-comfyui-edit-minimax-h3-image-int8
