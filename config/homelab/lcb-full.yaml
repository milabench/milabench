# --- added 2026-11-16: thinking on in full, for the models whose quick thinking-on score passed 75 (the quick tier's
# 18 LiveCodeBench problems carry ±20 points: a jump that large needs the 175 to stand). Qwen3.8-27B NVFP4: 66 -> 83.
homelab-vllm-qwen38-27b-nvfp4-dflash2-think-lcbfull:
  inherits: homelab-vllm-qwen38-27b-nvfp4-dflash2
  enabled: true
  max_duration: 64800  # the quick 18 took 34 min thinking on: ~6 h for 175, with margin
  client:
    passes:
      - {name: lcbfull, quality: {tier: full, thinking: ["on"], thinking_max_tokens: 32768, reply_window: 3600, tasks: [lcb]}}
  server:
    argv:
      --max-model-len: 40960  # 32k of reply + the prompt
      --reasoning-parser: qwen3

