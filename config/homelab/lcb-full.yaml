  server:
    argv:
      --max-model-len: 40960  # 32k of reply + the prompt
      --reasoning-parser: gemma4

# Inkling 2 Mini, full LiveCodeBench in both of its modes (thinking.yaml's pair: 32k cap, 40k context). It always
