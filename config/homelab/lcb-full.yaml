  inherits: homelab-vllm-inkling2-mini-dspark
  enabled: true
  max_duration: 43200  # the quick run took 1h06
  client:
    passes:
      - {name: lcbfull, quality: {tier: full, thinking: ["on"], thinking_max_tokens: 32768, preflight_retry: true, reply_window: 3600, tasks: [lcb]}}
  server:
    argv:
      --max-model-len: 40960  # 32k of reply + the prompt
      --reasoning-parser: inkling
      --default-chat-template-kwargs: '{"reasoning_effort": "none"}'

