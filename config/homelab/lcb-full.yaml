# =============================================================================
# Homelab — LiveCodeBench v6 in full (175 problems) for the coding-agent candidates
#
# The quick tier scores LiveCodeBench on 18 problems: ±11 points of noise per model, while it is the task that
# separates the models most (the quality score weighs it most). This runs the fixed 175-problem slice, alone
# (no throughput passes), on each candidate's own server (text.yaml's flags): about ±4 points.
#   milabench run --config homelab/lcb-full.yaml [--select <bench>]
# Replies up to 32k tokens (max_tokens floor), in a 40k context: QualityBench caps LiveCodeBench answers at 4096
# tokens with thinking off, and the models that reason in their visible answer (Qwen3, Nemotron) lost more than
# half the problems there (first run, 2026-11-15). Several hours per model. Not in all.yaml.
# Candidates: the best quality scores, the quality-vs-speed front, and the coding models.
# =============================================================================

include:
  - text.yaml

# the one pass, shared by every entry (YAML anchor)
_lcb_full:
  client:
    passes: &lcb_full_passes
      - {name: lcbfull, quality: {tier: full, thinking: ["off"], max_tokens: 32768, tasks: [lcb]}}

homelab-vllm-gemma4-31b-nvfp4-mtp-lcbfull:
  inherits: homelab-vllm-gemma4-31b-nvfp4-mtp
  enabled: true
  max_duration: 43200
  client:
    passes: *lcb_full_passes
  server:
    argv:
      --max-model-len: 40960  # 32k of reply + the prompt

