# =============================================================================
# Homelab — tool / function calling accuracy (DRAFT, choosing a coding-agent model)
#
# BFCL (Berkeley Function Calling Leaderboard, bfcl-eval 2026.3.23) on each candidate's agent server
# (coding-agent.yaml: the same model, engine flags, 64k context, prefix caching, --enable-auto-tool-choice and the
# model's --tool-call-parser / --reasoning-parser). FC mode: the request carries `tools` and the SERVER's parser
# turns the reply into tool_calls, so the score covers the weights + chat template + vLLM parser, as an agent sees
# them (a model whose calls the parser misreads scores low here even when its text is right).
#
#   bfcl       QualityBench's bfcl task (quality.py), full tier: 400 fixed items, 100 each of simple_python,
#              multiple, parallel, parallel_multiple (AST match against the possible answers), greedy (seed 608).
#              Paired item by item with the bfcl task of coding-agent.yaml's quality pass (same items, same server).
#              Thinking off; thinking on as well for the top 4 hybrids only (Qwen3.8-27B, Qwen3.6-27B, Gemma 4 31B,
#              Qwen3.6-35B-A3B; the reasoning parser keeps the reasoning out of the parsed calls), the other
#              hybrids thinking off only. Always-reasoning models (gpt-oss, Muse Glimmer): on only.
#              Non-thinking models (Qwen3-Coder 30B / Next, Kimi-Linear): off only.
#
# benchmate/benchserve/bfcl.py (the `bfcl:` pass kind, dispatched; see _bfcl_extended below): the categories
# QualityBench leaves out (irrelevance = hallucinated calls, live user-contributed sets, multi-turn with simulated
# tool APIs), per-category scores, and latency per call (single stream).
#
# Offline once prepared: QualityBench's BFCL venv (~6 GB, torch + CUDA wheels pinned by its lock, aarch64 wheels
# exist) carries bfcl-eval and its data. No container runtime. ~5-15 min per model thinking off.
#   milabench run --config homelab/toolcall.yaml --select <bench>     (not in all.yaml)
# =============================================================================

include:
  - coding-agent.yaml

# the passes, shared by the entries (YAML anchors)
_toolcall:
  client:
    passes: &bfcl_off
      - {name: bfcl, quality: {tier: full, thinking: ["off"], tasks: [bfcl]}}
    passes_off_on: &bfcl_off_on
      - {name: bfcl, quality: {tier: full, thinking: ["off", "on"], thinking_max_tokens: 32768, preflight_retry: true, reply_window: 3600, tasks: [bfcl]}}
    passes_on: &bfcl_on
      - {name: bfcl, quality: {tier: full, thinking: ["on"], thinking_max_tokens: 32768, reply_window: 3600, tasks: [bfcl]}}
    # the strongest models also get the extended passes (see _bfcl_extended below)
    passes_off_on_ext: &bfcl_off_on_ext
      - {name: bfcl, quality: {tier: full, thinking: ["off", "on"], thinking_max_tokens: 32768, preflight_retry: true, reply_window: 3600, tasks: [bfcl]}}
      - {name: bfcl-ext, bfcl: {every: 2, threads: 16, thinking: ["off"]}}
      - {name: bfcl-lat, bfcl: {categories: [simple_python, parallel_multiple, multi_turn_base], every: 10, threads: 1, thinking: ["off"]}}
    passes_off_ext: &bfcl_off_ext
      - {name: bfcl, quality: {tier: full, thinking: ["off"], tasks: [bfcl]}}
      - {name: bfcl-ext, bfcl: {every: 2, threads: 16, thinking: ["off"]}}
      - {name: bfcl-lat, bfcl: {categories: [simple_python, parallel_multiple, multi_turn_base], every: 10, threads: 1, thinking: ["off"]}}

# `bfcl:` passes (benchmate/benchserve/bfcl.py, dispatched by benchserve): append these to an entry's passes.
# Not referenced by any entry yet.
#   bfcl-ext   9 categories, every 2nd item (~1800 items: simple / multiple / parallel / parallel_multiple,
#              irrelevance, live_simple / live_multiple / live_irrelevance, multi_turn_base), 16 in flight
#   bfcl-lat   single stream (threads 1): latency per call and per multi-turn turn, ~80 entries
_bfcl_extended:
  client:
    passes:
      - {name: bfcl-ext, bfcl: {every: 2, threads: 16, thinking: ["off"]}}
      - {name: bfcl-lat, bfcl: {categories: [simple_python, parallel_multiple, multi_turn_base], every: 10, threads: 1, thinking: ["off"]}}

# agent server settings for the entries with no coding-agent counterpart
_toolcall_server:
  server:
    argv: &toolcall_server
      --no-enable-prefix-caching: null
      --enable-prefix-caching: true
      --max-model-len: 65536
      --enable-auto-tool-choice: true

