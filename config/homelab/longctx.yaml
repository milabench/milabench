# its FP8 release: does 4-bit weights cost long-context accuracy?
homelab-longctx-qwen38-27b-fp8-dflash2:
  inherits: homelab-vllm-qwen38-27b-fp8-dflash2
  max_duration: 21600
  tags: [longctx, longctx-quant]
  longctx: *longctx_ruler
