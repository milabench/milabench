# --- gpt-oss-120b MXFP4 (half its layers full attention, bf16 KV: the KV-heavy reference; 131072 native, so
# no ctx256k and RULER to 64k: its 128k samples need ~131.2k with the chat template). Always reasons: the
# reasoning parser keeps the reasoning out of the scored content, low effort and room for it in the replies ---
homelab-longctx-gptoss-120b-mxfp4:
  inherits: homelab-vllm-gptoss-120b-mxfp4
  max_duration: 14400
  tags: [longctx]
  longctx:
    ruler_lengths: [8192, 32768, 65536]
    ruler_samples: 8
  server:
    argv:
      --max-model-len: 131072
      --max-num-seqs: 8
      --reasoning-parser: openai_gptoss
  client:
    passes:
      - {name: ctx8k,     argv: {--max-concurrency: 1, --num-warmups: 1, --num-prompts: 4, --random-input-len: 8192,   --random-output-len: 256}}
      - {name: ctx32k,    argv: {--max-concurrency: 1, --num-warmups: 1, --num-prompts: 4, --random-input-len: 32768,  --random-output-len: 256}}
      - {name: ctx64k,    argv: {--max-concurrency: 1, --num-warmups: 0, --num-prompts: 3, --random-input-len: 65536,  --random-output-len: 256}}
      - {name: ctx128k,   argv: {--max-concurrency: 1, --num-warmups: 0, --num-prompts: 3, --random-input-len: 130048, --random-output-len: 256}}
      - {name: conc4-32k, argv: {--max-concurrency: 4, --num-warmups: 0, --num-prompts: 8, --random-input-len: 32768,  --random-output-len: 256}}
      # a reasoning reply needs more than the needle's 24 tokens: max_tokens floor. The 128k prompts (130.9k with
      # the template) then exceed the context: QualityBench skips that length (marked partial), 32k only
      - {name: needle, quality: {tier: full, thinking: ["off"], tasks: [needle], max_tokens: 1024}}
      - name: ruler
        eval:
          tasks:
            - ../longctx/eval_tasks/longctx_ruler_niah_multikey.yaml
            - ../longctx/eval_tasks/longctx_ruler_niah_multivalue.yaml
            - ../longctx/eval_tasks/longctx_ruler_vt.yaml
            - ../longctx/eval_tasks/longctx_ruler_qa_hotpot.yaml
          num_concurrent: 4
          gen_kwargs: {max_gen_toks: 4096, temperature: 0, reasoning_effort: low}
          log_samples: true
