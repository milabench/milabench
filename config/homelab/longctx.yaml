# =============================================================================
# Homelab — long context ("chat with this codebase / PDF"): DRAFT, not included from all.yaml
#
# For each long-context candidate of text.yaml, the same model, engine flags and drafter, its context raised
# to the model's native maximum (262k; 128k for gpt-oss), prefix caching still off (every prompt is a cold
# read of the document; the warm follow-up question is coding-agent.yaml's ctx32k / ctx60k passes). Passes:
#
#   ctx8k / ctx32k / ctx64k / ctx128k / ctx256k   1 stream, a real-text prompt of that length (--real-text:
#                     OpenHermes cut to length), 256 tokens out: TTFT = the prefill of the whole document,
#                     TPOT / itl_by_context = decode speed at that depth, energy per pass (GPU power in the
#                     pass window). ctx128k sends 127k tokens (130048 + 256 out fit a 131072 context),
#                     ctx256k 254k; 64k and up skip the warmup request (the server is warm by then)
#   conc4-32k         4 sessions of 32k at once: aggregate decode with 4 documents resident
#   needle            QualityBench needle, full tier (quick keeps 2 of the 20 prompts): a 7-digit number
#                     at 10 depths of a 32k and a 128k C4 haystack, thinking off
#   ruler             a pinned RULER slice (benchmarks/longctx/eval_tasks: lm-eval's generators and seeds,
#                     8 samples per task and length): multi-key and multi-value NIAH, 4-hop variable
#                     tracking, HotpotQA among distractor documents, at 8k / 32k / 64k / 128k; one score
#                     per task and length (eval_summary), thinking off (chat_template_kwargs)
#
# Sessions that fit per context length (KV cache + recurrent state vs the memory left beside the weights):
#   <milabench venv>/bin/python benchmarks/longctx/kv_capacity.py config/homelab/longctx.yaml
#
#   milabench run --config homelab/longctx.yaml [--select longctx]
# Needs: wonderwords + nltk in the homelab-serving venv (lm-eval's RULER generators), network for
# HotpotQA (lm-eval downloads it at each run), a container runtime is NOT needed (needle and RULER only).
# =============================================================================

include:
  - text.yaml

_longctx_settings:
  server:
    argv: &longctx_server
      --max-model-len: 262144
      # long sessions, not many users: CUDA graphs and the scheduler sized for 8 sequences
      --max-num-seqs: 8
  # RULER lengths / samples, read by benchmarks/longctx/eval_tasks/longctx_ruler.py (MILABENCH_CONFIG)
  longctx: &longctx_ruler
    ruler_lengths: [8192, 32768, 65536, 131072]
    ruler_samples: 8
  client:
    passes: &longctx_passes
      - {name: ctx8k,     argv: {--max-concurrency: 1, --num-warmups: 1, --num-prompts: 4, --random-input-len: 8192,   --random-output-len: 256}}
      - {name: ctx32k,    argv: {--max-concurrency: 1, --num-warmups: 1, --num-prompts: 4, --random-input-len: 32768,  --random-output-len: 256}}
      - {name: ctx64k,    argv: {--max-concurrency: 1, --num-warmups: 0, --num-prompts: 3, --random-input-len: 65536,  --random-output-len: 256}}
      - {name: ctx128k,   argv: {--max-concurrency: 1, --num-warmups: 0, --num-prompts: 3, --random-input-len: 130048, --random-output-len: 256}}
      - {name: ctx256k,   argv: {--max-concurrency: 1, --num-warmups: 0, --num-prompts: 2, --random-input-len: 260096, --random-output-len: 256}}
      - {name: conc4-32k, argv: {--max-concurrency: 4, --num-warmups: 0, --num-prompts: 8, --random-input-len: 32768,  --random-output-len: 256}}
      - {name: needle, quality: {tier: full, thinking: ["off"], tasks: [needle]}}
      # task paths relative to the serving client's cwd (benchmarks/serving)
      - name: ruler
        eval: &longctx_ruler_eval
          tasks:
            - ../longctx/eval_tasks/longctx_ruler_niah_multikey.yaml
            - ../longctx/eval_tasks/longctx_ruler_niah_multivalue.yaml
            - ../longctx/eval_tasks/longctx_ruler_vt.yaml
            - ../longctx/eval_tasks/longctx_ruler_qa_hotpot.yaml
          num_concurrent: 4
          # every task's own answer length (30-128 tokens) is below 128; the templates without thinking ignore the kwarg
          gen_kwargs: {max_gen_toks: 128, temperature: 0, chat_template_kwargs: {enable_thinking: false}}
          log_samples: true

# the accuracy passes and the 128k point only: format comparisons (weights, KV cache) of an entry below
_longctx_compare:
  client:
    passes: &longctx_compare_passes
      - {name: ctx32k,    argv: {--max-concurrency: 1, --num-warmups: 1, --num-prompts: 4, --random-input-len: 32768,  --random-output-len: 256}}
      - {name: ctx128k,   argv: {--max-concurrency: 1, --num-warmups: 0, --num-prompts: 3, --random-input-len: 130048, --random-output-len: 256}}
      - {name: needle, quality: {tier: full, thinking: ["off"], tasks: [needle]}}
      - {name: ruler, eval: *longctx_ruler_eval}

# --- Qwen3.6-35B-A3B NVFP4 + MTP (Gated DeltaNet hybrid: 10 of 40 layers keep a KV cache, 262k native) ---
homelab-longctx-qwen36-35b-a3b-nvfp4-mtp:
  inherits: homelab-vllm-qwen36-35b-a3b-nvfp4-mtp
  max_duration: 14400
  tags: [longctx]
  longctx: *longctx_ruler
  server:
    argv:
      <<: *longctx_server
  client:
    passes: *longctx_passes

# the same with an unquantized (bf16) KV cache: does the fp8 KV cache cost retrieval at 128k?
homelab-longctx-qwen36-35b-a3b-nvfp4-mtp-kvbf16:
  inherits: homelab-vllm-qwen36-35b-a3b-nvfp4-mtp
  max_duration: 10800
  tags: [longctx, kv-compare]
  longctx: *longctx_ruler
  server:
    argv:
      <<: *longctx_server
      --kv-cache-dtype: auto
  client:
    passes: *longctx_compare_passes

# --- Qwen3.8-27B dense NVFP4 + DFlash 2 (Gated DeltaNet hybrid, 16 of 64 layers with KV, 262k) ---
homelab-longctx-qwen38-27b-nvfp4-dflash2:
