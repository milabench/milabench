# =============================================================================
# Homelab — image understanding (vision-language models): document / chart / OCR question answering,
# college-level visual questions, image description.
#
# The VLMs of text.yaml's LLM deployments (Gemma 4, Qwen3.6 / 3.8, Nemotron 3.5 Bolt, EXAONE 4.5, Muse Glimmer,
# Inkling) run these image passes in their own entry there (img1 ... vqa, same settings as below). Here: the
# 32 GB-card set's small Gemma 4 (its own server profile), then dedicated VLMs that are not in the suite.
#
# benchmarks/vlm = benchmarks/serving's package (milabench runs the vLLM server) with its own client:
#
#   img1 / img8      a DocVQA page + its question, 64 tokens out, 1 / 8 users: time per image, TTFT = the
#                    image's encode + prefill (prompt tokens = text + image tokens, from the server's usage)
#   desc1 / desc8    "Describe this image in detail." on chart / OCR / MMMU images, 256 tokens out, 1 / 8 users
#   vqa              accuracy on pinned slices (quick tier: ~100 items each, 390 requests, 8 in flight):
#                    DocVQA (ANLS), ChartQA (relaxed acc.), OCRBench (official match), MMMU val (single-image),
#                    thinking off where the model has a switch; per task also TTFT / latency / prefill tok/s
# Throughput passes run vLLM's serving benchmark on real images (--dataset-name custom_image, the request sets
# prepare.py builds under $MILABENCH_DATA/vlm), every pass after its warmup requests, fixed output lengths.
# Power / energy and memory: the GPU monitor of each pass (its own .data file), as for every serving bench.
#
#   milabench run --config homelab/vision.yaml --select vision
# (text.yaml is included for the parents: without --select its benches run too)
# =============================================================================

include:
  - text.yaml

# vision settings, merged into each model's own server (YAML anchors: one definition, every bench)
_vision_settings:
  server:
    argv: &vision_server
      # one image per request (the slices are single-image): the encoder cache and the profiling run are sized
      # for one, no video
      --limit-mm-per-prompt: '{"image": 1, "video": 0}'
  client:
    argv: &vision_client
      --backend: openai-chat
      --endpoint: /v1/chat/completions
      --real-text: null
      # images sent inline as base64: the server reads no local file
      --custom-ensure-client-side-data: true
    passes: &vision_passes
      - {name: img1,  argv: {--dataset-name: custom_image, --dataset-path: vlm/perf-doc.jsonl, --custom-output-len: 64,
                             --max-concurrency: 1, --num-warmups: 1, --num-prompts: 16}}
      - {name: img8,  argv: {--dataset-name: custom_image, --dataset-path: vlm/perf-doc.jsonl, --custom-output-len: 64,
                             --max-concurrency: 8, --num-warmups: 8, --num-prompts: 64}}
      - {name: desc1, argv: {--dataset-name: custom_image, --dataset-path: vlm/perf-describe.jsonl, --custom-output-len: 256,
                             --max-concurrency: 1, --num-warmups: 1, --num-prompts: 8}}
      - {name: desc8, argv: {--dataset-name: custom_image, --dataset-path: vlm/perf-describe.jsonl, --custom-output-len: 256,
                             --max-concurrency: 8, --num-warmups: 8, --num-prompts: 48}}
      # ignored by templates without the switch (Gemma 4 does not think unless asked)
      - {name: vqa, vqa: {tier: quick, concurrency: 8, max_tokens: 256, tasks: [docvqa, chartqa, ocrbench, mmmu],
                          chat_template_kwargs: {enable_thinking: false}}}

# always-reasoning models (Muse Glimmer): the answer comes after the reasoning, so a larger budget
_vision_settings_reasoning:
  client:
    passes: &vision_passes_reasoning
      - {name: img1,  argv: {--dataset-name: custom_image, --dataset-path: vlm/perf-doc.jsonl, --custom-output-len: 64,
                             --max-concurrency: 1, --num-warmups: 1, --num-prompts: 16}}
      - {name: img8,  argv: {--dataset-name: custom_image, --dataset-path: vlm/perf-doc.jsonl, --custom-output-len: 64,
                             --max-concurrency: 8, --num-warmups: 8, --num-prompts: 64}}
      - {name: desc1, argv: {--dataset-name: custom_image, --dataset-path: vlm/perf-describe.jsonl, --custom-output-len: 256,
                             --max-concurrency: 1, --num-warmups: 1, --num-prompts: 8}}
      - {name: desc8, argv: {--dataset-name: custom_image, --dataset-path: vlm/perf-describe.jsonl, --custom-output-len: 256,
                             --max-concurrency: 8, --num-warmups: 8, --num-prompts: 48}}
      - {name: vqa, vqa: {tier: quick, concurrency: 8, max_tokens: 4096, tasks: [docvqa, chartqa, ocrbench, mmmu]}}

# =============================================================================
# Reused from text.yaml: the same server (weights already in the cache), the vision passes
# =============================================================================

# --- Gemma 4 E2B / E4B BF16 (Apache-2.0): the small end, per-layer embeddings (~2B / ~4B effective) ---
homelab-vlm-gemma4-e2b-bf16:
  inherits: homelab-vllm-gemma4-e2b-bf16
  definition: ../../benchmarks/vlm
  tags: [vision]
  server: {argv: {<<: *vision_server}}
  client: {argv: {<<: *vision_client}, passes: *vision_passes}

homelab-vlm-gemma4-e4b-bf16:
  inherits: homelab-vllm-gemma4-e4b-bf16
  definition: ../../benchmarks/vlm
  tags: [vision]
  server: {argv: {<<: *vision_server}}
  client: {argv: {<<: *vision_client}, passes: *vision_passes}

# =============================================================================
# Dedicated VLMs not in the suite (new downloads)
# =============================================================================

_vlm_vllm:
  inherits: _serving_vllm
  definition: ../../benchmarks/vlm
  enabled: false
  tags: [vision]
  server: {argv: {<<: *vision_server}}
  client: {argv: {<<: *vision_client}, passes: *vision_passes}

# --- MiniCPM-V 4.7 35B-A3B (OpenBMB, 2026-10; Apache-2.0): the newest dedicated open VLM of the class,
# OpenBMB's own int4 (compressed-tensors W4A16, 22.6 GB) ---
homelab-vlm-minicpmv47-35b-a3b-int4:
  inherits: _vlm_vllm
  enabled: true
  weight: 1
  tags: [moe, w4a16]
  url: https://huggingface.co/openbmb/MiniCPM-V-4.7-35B-A3B-int4
  client:
    argv:
      --model: openbmb/MiniCPM-V-4.7-35B-A3B-int4
      --trust-remote-code: true
  server:
    argv:
      openbmb/MiniCPM-V-4.7-35B-A3B-int4: true
      --trust-remote-code: true

# --- The same, OpenBMB's FP8 (38 GB): off, the format comparison if disk allows ---
homelab-vlm-minicpmv47-35b-a3b-fp8:
  inherits: _vlm_vllm
  enabled: false
  weight: 1
  tags: [moe, fp8, vision-quant-compare]
  url: https://huggingface.co/openbmb/MiniCPM-V-4.7-35B-A3B-FP8
  client:
    argv:
      --model: openbmb/MiniCPM-V-4.7-35B-A3B-FP8
      --trust-remote-code: true
  server:
    argv:
      openbmb/MiniCPM-V-4.7-35B-A3B-FP8: true
      --trust-remote-code: true

# --- Nemotron 3.5 Super VL 120B-A12B NVFP4 (NVIDIA, 2026-10; OpenMDW-1.1): the largest open VLM that fits
# (75 GB), with its LiLiCorr drafter (1.3 GB). Flags from the model card's DGX Spark recipe (minus video) ---
homelab-vlm-nemotron35-super-vl-120b-a12b-nvfp4-dflash:
  inherits: _vlm_vllm
  enabled: false  # 75 GB download: off until the new SSD (MiniCPM-V int4 and Qwen3.5-9B stay on)
  weight: 1
  max_duration: 10800
  tags: [moe, nvfp4, dflash]
  url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
  client:
    argv:
      --model: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
      --trust-remote-code: true
  server:
    argv:
      nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4: true
      --trust-remote-code: true
      --gpu-memory-utilization: 0.85
      --max-num-batched-tokens: 8192
      --mamba-backend: flashinfer
      --mamba-ssm-cache-dtype: float16
      --reasoning-parser: nemotron_v3
      --speculative-config: '{"method": "dflash", "model": "nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4-LiLiCorr", "num_speculative_tokens": 7}'

# --- Qwen3.5-9B FP8 dynamic (RedHatAI, 14 GB; Apache-2.0): the ~9B dense point between Gemma 4 E4B and the
# 27-35B models, a native Qwen VLM ---
homelab-vlm-qwen35-9b-fp8:
  inherits: _vlm_vllm
  enabled: true
  weight: 1
  tags: [dense, fp8]
  url: https://huggingface.co/RedHatAI/Qwen3.5-9B-FP8-dynamic
  client:
    argv:
      --model: RedHatAI/Qwen3.5-9B-FP8-dynamic
  server:
    argv:
      RedHatAI/Qwen3.5-9B-FP8-dynamic: true
