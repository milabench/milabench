# Inkling 2 Mini: always reasons (no switch, reasoning_effort defaults to 0.9 "high"); text.yaml scores it
# thinking on in a 16k context (8k of reasoning, as Muse Glimmer). This is the 32k-reply run the other -think
# entries get, so its score sets beside theirs.
homelab-vllm-inkling2-mini-dspark-think:
  inherits: homelab-vllm-inkling2-mini-dspark
  enabled: true
  max_duration: 43200
  client:
    passes: *thinking_on_passes
  server:
    argv:
      --max-model-len: 40960  # 32k of reply + the prompt
      --reasoning-parser: inkling

# Inkling 2 Mini "thinking off": its template has no off switch, the nearest is reasoning_effort "none" (0.0),
# which the model card says still reasons a little. Same pass, cap and context as -think (effort 0.9, "high"),
# so the pair is its on/off. QualityBench runs it as "on" (its "off" preflight fails on any reasoning text), with
# the preflight retry in case effort none skips reasoning on the trivial prompt: if it never reasons at all, the
# preflight fails within minutes and nothing else is lost.
homelab-vllm-inkling2-mini-dspark-effort-none:
  inherits: homelab-vllm-inkling2-mini-dspark
  enabled: true
  max_duration: 43200
  client:
    passes:
      - {name: quality, quality: {tier: quick, thinking: ["on"], thinking_max_tokens: 32768, preflight_retry: true, reply_window: 3600, tasks: [gsm8k, ifeval, mmlu_pro, humaneval, mbpp, lcb]}}
  server:
    argv:
      --max-model-len: 40960  # 32k of reply + the prompt, as -think
      --reasoning-parser: inkling
      --default-chat-template-kwargs: '{"reasoning_effort": "none"}'
