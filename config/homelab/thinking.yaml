# =============================================================================
# Homelab — thinking on vs off, for the models whose chat template has the switch (enable_thinking)
#
# text.yaml scores every model thinking off (QualityBench quick tier). This scores the same tasks thinking on, on
# the model's own server (text.yaml's flags), so the report can set them side by side: accuracy gained, and what
# it costs in time and energy (the accuracy pass's duration and joules, off vs on).
#   milabench run --config homelab/thinking.yaml [--select <bench>]
# One build per model (its fastest: accuracy belongs to the weights). The reply (reasoning + answer) is capped at
# 32k tokens (QualityBench's default), in a 40k context; replies cut there score as wrong, the report counts them.
# Not in all.yaml. (2026-11-14: an 8k cap cut the Qwen3.6 models on most hard items; 2026-11-15: at 24k Qwen3.6-35B
# still ran past it on 11 of 18 LiveCodeBench problems.)
# reply_window: the time-to-solution window, 1 h per reply (as long as QualityBench's own limits allowed before,
# so earlier results compare): a reply not back by then scores as wrong and is not retried (2026-11-16: EXAONE 4.5
# and Qwen3.6-27B thinking on were retrying hour-long replies from scratch).
# preflight_retry: Gemma 4 E4B decides per prompt whether to think, and skips it on the trivial preflight one.
# Always-thinking models are not here: gpt-oss and Muse Glimmer are scored thinking on in text.yaml already.
# No switch in their template: Llama 3.1, Qwen3-Coder (30B, Next), Kimi-Linear.
# Each entry names its reasoning parser: without it the reasoning stays in the reply (<think>...), and the format
# checks (IFEval) and answer extraction fail on it (Qwen3-8B, 2026-11-14: IFEval 78 -> 40).
# =============================================================================

include:
  - text.yaml

# the one pass, shared by every entry (YAML anchor)
_thinking_on:
  client:
    passes: &thinking_on_passes
      - {name: quality, quality: {tier: quick, thinking: ["on"], thinking_max_tokens: 32768, preflight_retry: true, reply_window: 3600, tasks: [gsm8k, ifeval, mmlu_pro, humaneval, mbpp, lcb]}}

homelab-vllm-qwen3-8b-fp8-think:
  inherits: homelab-vllm-qwen3-8b-fp8
  enabled: true
  max_duration: 28800
  client:
    passes: *thinking_on_passes
  server:
    argv:
      --max-model-len: 40960  # 32k of reply + the prompt
      --reasoning-parser: qwen3

