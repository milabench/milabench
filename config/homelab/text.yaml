      --repo: unsloth/GLM-5.3-Flash-GGUF
      --file: UD-Q2_K_XL/GLM-5.3-Flash-UD-Q2_K_XL-00001-of-00004.gguf
      --model: zai-org/GLM-5.3-Flash
      # GLM always reasons: QualityBench's thinking-off preflight gets reasoning and no content (2026-11-13)
