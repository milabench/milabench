# =============================================================================
# Homelab — text generation (LLM)
#
#   homelab-llm-chat        HF transformers, Llama-3.1-8B-Instruct
#   homelab-vllm-*          vLLM quantized serving (fp8 / w8a8) for a 32 GB card, passes conc 1 / 8 / 32
#   homelab-llamacpp-*      llama.cpp GGUF, native backend (SYCL / CUDA / HIP) vs Vulkan, conc 1 / 8
#
# Then, on the regular per-arch install (bottom of the file), recent 4-bit models + speculative decoding:
#   homelab-vllm-{qwen36-35b-a3b, gemma4-26b-a4b}-*-mtp, homelab-vllm-qwen38-27b-nvfp4-dflash2,
#   homelab-vllm-{qwen3-coder-30b-a3b-awq, nemotron3-nano-30b-a3b-nvfp4, qwen36-27b-nvfp4, gptoss-120b-mxfp4},
#   homelab-llamacpp-glm53-flash-q2 (and homelab-sglang-qwen38-27b-nvfp4-dflash2, off)
#
# Runtime FP8 vs pre-quantized (Qwen3-8B, Llama-3.1-8B, gemma-4-E4B): --select quant-compare
#
# Every perf pass sends real text (--real-text), not random token ids, after its warmup requests.
#
# 2-GPU variants (TP=2 / DP=2): multigpu.yaml
# =============================================================================

include:
  - _base.yaml

# =============================================================================
# One entry per LLM deployment (homelab-vllm-<model>): every measurement of the report runs on that one server.
#
# A deployment = the weights, the engine and the server flags. A second entry exists only when one of those
# differs (another quantization, a KV dtype comparison, the batch-tuned servers of batch.yaml, the 32 GB-card
# set below). Reproduce a row of the report: scripts/homelab/run.sh with SELECT=<entry>; part of it only:
# PASSES=quality,bfcl-ext (the pass names below), QUALITY=probe (QualityBench's quick tier).
#
# The server (_llm_vllm): the model's native context up to 262144 (131072 for gpt-oss / Muse Glimmer), prefix
# caching on, 32 sequences, the model's tool-call and reasoning parsers; VLMs also take one image per request.
# Prefix caching on serves the agent passes (a resent context is not prefilled again); the other speed passes
# send a fresh cache_salt with every request (benchserve --prefix-cache, auto): each prompt is prefilled in full.
#
# The passes, in order (a pass that needs more context than the server has is left out, e.g. ctx256k at 131k):
#   single / fill4k / conc8      1 / 1 / 8 streams of 1k / 4k / 1k real text in, 512 out
#   ctx8k ... ctx256k            1 stream, an 8k-256k real-text prompt, 256 out: the prefill of a whole document
#                                (TTFT), decode speed at that depth; conc4-32k: 4 documents of 32k at once
#   ctx32k-1 / ctx32k-4 / ctx60k-4  agent-shaped load: 1 / 4 sessions, each a 32k / 60k shared context continued
#                                by 1k-token turns (512 out), prefix cache warm: only the new turn is prefilled
#   quality                      QualityBench, full tier: gsm8k, ifeval, mmlu_pro, humaneval, mbpp, lcb (32k
#                                replies), logprobs, bfcl (400 tool calls), needle (32k / 128k haystacks); hybrids
#                                thinking off and on, always-reasoning models on, non-thinking models off
#   bfcl-ext / bfcl-lat          BFCL categories QualityBench leaves out (every 2nd item), tool-call latency
#   ruler                        RULER slice (multi-key / multi-value NIAH, variable tracking, HotpotQA) at
#                                8k-128k, lengths beyond the context dropped
#   img1 / img8 / desc1 / desc8 / vqa   VLMs only: DocVQA pages and image descriptions (1 / 8 users), accuracy on
#                                DocVQA / ChartQA / OCRBench / MMMU slices (see vision.yaml)
#   swebench                     mini-swe-agent on 50 SWE-bench Verified tasks, 4 at a time
#   terminalbench                Terminus-2 on the 89 Terminal-Bench 2.0 tasks, 4 at a time (4-10 h)
#   conc32                       32 streams, last: the heaviest load, a crash there costs only it
# A full run: 1-3 days per model (quality in two thinking modes and Terminal-Bench are most of it).
# Needs a container runtime (SWE-bench, Terminal-Bench, QualityBench's sandboxes).
# =============================================================================

_llm_vllm:
  inherits: _serving_vllm
  max_duration: 345600  # every pass of the deployment, Terminal-Bench included
  tags: [longctx, agent]  # benchmarks/longctx/kv_capacity.py reads the longctx ones
  longctx:
    ruler_lengths: [8192, 32768, 65536, 131072]  # beyond --max-model-len: dropped
    ruler_samples: 8
  server:
    argv:
      --max-model-len: 262144
      --max-num-seqs: 32
      --no-enable-prefix-caching: null
      --enable-prefix-caching: true
      --enable-auto-tool-choice: true

# the passes, one list per kind of model; the items are shared (anchors), the lists differ in thinking modes and
# the image passes. Change a pass here, every deployment changes.
_llm_passes:
  client:
    hybrid: &llm_hybrid
      - &single {name: single, argv: {--max-concurrency: 1,  --num-warmups: 1,  --num-prompts: 8,   --random-input-len: 1024, --random-output-len: 512}}
      - &fill4k {name: fill4k, argv: {--max-concurrency: 1,  --num-warmups: 1,  --num-prompts: 8,   --random-input-len: 4096, --random-output-len: 512}}
      - &conc8  {name: conc8,  argv: {--max-concurrency: 8,  --num-warmups: 8,  --num-prompts: 40,  --random-input-len: 1024, --random-output-len: 512}}
      - &ctx8k     {name: ctx8k,     argv: {--max-concurrency: 1, --num-warmups: 1, --num-prompts: 4, --random-input-len: 8192,   --random-output-len: 256}}
      - &ctx32k    {name: ctx32k,    argv: {--max-concurrency: 1, --num-warmups: 1, --num-prompts: 4, --random-input-len: 32768,  --random-output-len: 256}}
      - &ctx64k    {name: ctx64k,    argv: {--max-concurrency: 1, --num-warmups: 0, --num-prompts: 3, --random-input-len: 65536,  --random-output-len: 256}}
      - &ctx128k   {name: ctx128k,   argv: {--max-concurrency: 1, --num-warmups: 0, --num-prompts: 3, --random-input-len: 130048, --random-output-len: 256}}
      - &ctx256k   {name: ctx256k,   argv: {--max-concurrency: 1, --num-warmups: 0, --num-prompts: 2, --random-input-len: 260096, --random-output-len: 256}}
      - &conc4_32k {name: conc4-32k, argv: {--max-concurrency: 4, --num-warmups: 0, --num-prompts: 8, --random-input-len: 32768,  --random-output-len: 256}}
      - &ctx32k_1 {name: ctx32k-1, argv: {--dataset-name: prefix_repetition, --prefix-repetition-prefix-len: 32000, --prefix-repetition-suffix-len: 1000, --prefix-repetition-output-len: 512, --prefix-repetition-num-prefixes: 1, --max-concurrency: 1, --num-warmups: 1, --num-prompts: 8}}
      - &ctx32k_4 {name: ctx32k-4, argv: {--dataset-name: prefix_repetition, --prefix-repetition-prefix-len: 32000, --prefix-repetition-suffix-len: 1000, --prefix-repetition-output-len: 512, --prefix-repetition-num-prefixes: 4, --max-concurrency: 4, --num-warmups: 4, --num-prompts: 32}}
      - &ctx60k_4 {name: ctx60k-4, argv: {--dataset-name: prefix_repetition, --prefix-repetition-prefix-len: 60000, --prefix-repetition-suffix-len: 1000, --prefix-repetition-output-len: 512, --prefix-repetition-num-prefixes: 4, --max-concurrency: 4, --num-warmups: 4, --num-prompts: 32}}
      - &quality_off_on
        name: quality
        quality:
          thinking: ["off", "on"]
          thinking_max_tokens: 32768
          preflight_retry: true
          reply_window: 3600
          tasks: {gsm8k: full, ifeval: full, mmlu_pro: full, humaneval: full, mbpp: full, lcb: {tier: full, max_tokens: 32768}, logprobs: full, bfcl: full, needle: full}
      - &bfcl_ext_off {name: bfcl-ext, bfcl: {every: 2, threads: 16, thinking: ["off"]}}
      - &bfcl_lat_off {name: bfcl-lat, bfcl: {categories: [simple_python, parallel_multiple, multi_turn_base], every: 10, threads: 1, thinking: ["off"]}}
      # task paths relative to the serving client's cwd (benchmarks/serving or benchmarks/vlm)
      - &ruler_off
        name: ruler
        eval:
          tasks: &ruler_tasks
            - ../longctx/eval_tasks/longctx_ruler_niah_multikey.yaml
            - ../longctx/eval_tasks/longctx_ruler_niah_multivalue.yaml
            - ../longctx/eval_tasks/longctx_ruler_vt.yaml
            - ../longctx/eval_tasks/longctx_ruler_qa_hotpot.yaml
          num_concurrent: 4
          # every task's own answer length (30-128 tokens) is below 128; templates without the switch ignore it
          gen_kwargs: {max_gen_toks: 128, temperature: 0, chat_template_kwargs: {enable_thinking: false}}
          log_samples: true
      - &swebench {name: swebench, swebench: {tier: quick, workers: 4, step_limit: 250, temperature: 0.0, config: swebench.yaml}}
      - &terminalbench {name: terminalbench, terminalbench: {tasks: full, harness: terminus-2, attempts: 1, workers: 4, timeout_multiplier: 1.0, thinking: null, temperature: 0.6, max_tokens: 16384, context: 65536}}
      - &conc32 {name: conc32, argv: {--max-concurrency: 32, --num-warmups: 32, --num-prompts: 160, --random-input-len: 1024, --random-output-len: 512}}

    # hybrids that read images: the same, plus the image passes (benchmarks/vlm's client, chat endpoint)
    hybrid_vlm: &llm_hybrid_vlm
      - *single
      - *fill4k
      - *conc8
      - *ctx8k
      - *ctx32k
      - *ctx64k
      - *ctx128k
      - *ctx256k
      - *conc4_32k
      - *ctx32k_1
      - *ctx32k_4
      - *ctx60k_4
      - *quality_off_on
      - *bfcl_ext_off
      - *bfcl_lat_off
      - *ruler_off
      - &img1  {name: img1,  argv: {<<: &image_argv {--backend: openai-chat, --endpoint: /v1/chat/completions, --no-real-text: true, --custom-ensure-client-side-data: true, --dataset-name: custom_image},
                                    --dataset-path: vlm/perf-doc.jsonl, --custom-output-len: 64, --max-concurrency: 1, --num-warmups: 1, --num-prompts: 16}}
      - &img8  {name: img8,  argv: {<<: *image_argv, --dataset-path: vlm/perf-doc.jsonl, --custom-output-len: 64, --max-concurrency: 8, --num-warmups: 8, --num-prompts: 64}}
      - &desc1 {name: desc1, argv: {<<: *image_argv, --dataset-path: vlm/perf-describe.jsonl, --custom-output-len: 256, --max-concurrency: 1, --num-warmups: 1, --num-prompts: 8}}
      - &desc8 {name: desc8, argv: {<<: *image_argv, --dataset-path: vlm/perf-describe.jsonl, --custom-output-len: 256, --max-concurrency: 8, --num-warmups: 8, --num-prompts: 48}}
      # ignored by templates without the switch (Gemma 4 does not think unless asked)
      - {name: vqa, vqa: {tier: quick, concurrency: 8, max_tokens: 256, tasks: [docvqa, chartqa, ocrbench, mmmu], chat_template_kwargs: {enable_thinking: false}}}
      - *swebench
      - *terminalbench
      - *conc32

    # always reasoning (no off switch): thinking on everywhere, room for the reasoning before short answers
    reasoning: &llm_reasoning
      - *single
      - *fill4k
      - *conc8
      - *ctx8k
      - *ctx32k
      - *ctx64k
      - *ctx128k
      - *ctx256k
      - *conc4_32k
      - *ctx32k_1
      - *ctx32k_4
      - *ctx60k_4
      - &quality_on
        name: quality
        quality:
          thinking: ["on"]
          thinking_max_tokens: 32768
          preflight_retry: true
          reply_window: 3600
          tasks: {gsm8k: full, ifeval: full, mmlu_pro: full, humaneval: full, mbpp: full, lcb: full, logprobs: full, bfcl: full, needle: full}
      - &bfcl_ext_on {name: bfcl-ext, bfcl: {every: 2, threads: 16, thinking: ["on"]}}
      - &bfcl_lat_on {name: bfcl-lat, bfcl: {categories: [simple_python, parallel_multiple, multi_turn_base], every: 10, threads: 1, thinking: ["on"]}}
      - &ruler_on {name: ruler, eval: {tasks: *ruler_tasks, num_concurrent: 4, gen_kwargs: {max_gen_toks: 4096, temperature: 0}, log_samples: true}}
      - *swebench
      - *terminalbench
      - *conc32

    reasoning_vlm: &llm_reasoning_vlm
      - *single
      - *fill4k
      - *conc8
      - *ctx8k
      - *ctx32k
      - *ctx64k
      - *ctx128k
      - *ctx256k
      - *conc4_32k
      - *ctx32k_1
      - *ctx32k_4
      - *ctx60k_4
      - *quality_on
      - *bfcl_ext_on
      - *bfcl_lat_on
      - *ruler_on
      - *img1
      - *img8
      - *desc1
      - *desc8
      - {name: vqa, vqa: {tier: quick, concurrency: 8, max_tokens: 4096, tasks: [docvqa, chartqa, ocrbench, mmmu]}}
      - *swebench
      - *terminalbench
      - *conc32

    # non-thinking models: thinking off everywhere
    plain: &llm_plain
      - *single
      - *fill4k
      - *conc8
      - *ctx8k
      - *ctx32k
      - *ctx64k
      - *ctx128k
      - *ctx256k
      - *conc4_32k
      - *ctx32k_1
      - *ctx32k_4
      - *ctx60k_4
      - name: quality
        quality:
          thinking: ["off"]
          thinking_max_tokens: 32768
          preflight_retry: true
          reply_window: 3600
          tasks: {gsm8k: full, ifeval: full, mmlu_pro: full, humaneval: full, mbpp: full, lcb: {tier: full, max_tokens: 32768}, logprobs: full, bfcl: full, needle: full}
      - *bfcl_ext_off
      - *bfcl_lat_off
      - *ruler_off
      - *swebench
      - *terminalbench
      - *conc32

homelab-llm-chat:
  inherits: _inference
  tags:
    - text
    - monogpu
  max_duration: 3600
  plan:
    method: per_gpu
  url: https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct
  argv:
    --mode: chat
    --model: meta-llama/Llama-3.1-8B-Instruct
    --dataset: hendrydong/gpqa_diamond
    --split: "test"
    # bs=1 already reserves ~17.4 GB on the B70; autosizer steps down from 4.
    --batch_size: "auto_batch(4)"

# --- 32 GB card (_serving_vllm_32gb): one server per model, the common passes (single / fill4k / conc8 / conc32) ---

# FP8: Qwen3-8B (dense) — the bring-up pack, smallest download
_h_vllm_qwen3_8b_fp8:
  inherits: _serving_vllm_32gb
  tags:
    - text
    - dense
    - fp8
  url: https://huggingface.co/Qwen/Qwen3-8B-FP8
  client:
    argv:
      --model: Qwen/Qwen3-8B-FP8
  server:
    argv:
      Qwen/Qwen3-8B-FP8: true

homelab-vllm-qwen3-8b-fp8:
  inherits: _h_vllm_qwen3_8b_fp8
  enabled: true
  tags:
    - quant-compare
  weight: 1

# W8A8 INT8: Llama-3.1-8B dense fallback
_h_vllm_llama8b_w8a8:
  inherits: _serving_vllm_32gb
  tags:
    - text
    - dense
    - w8a8
  url: https://huggingface.co/RedHatAI/Meta-Llama-3.1-8B-Instruct-quantized.w8a8
  client:
    argv:
      --model: RedHatAI/Meta-Llama-3.1-8B-Instruct-quantized.w8a8
  server:
    argv:
      RedHatAI/Meta-Llama-3.1-8B-Instruct-quantized.w8a8: true

homelab-vllm-llama8b-w8a8:
  inherits: _h_vllm_llama8b_w8a8
  enabled: true
  tags:
    - quant-compare
  weight: 1

# FP8: Gemma-4 26B-A4B MoE (26.5 GB weights): a 5k context (fill4k: 4096 in + 512 out), small prefill
# chunks and eager mode (graph capture needs memory) leave room for the KV cache on a 32 GB card
_h_vllm_gemma4_fp8:
  inherits: _serving_vllm_32gb
  max_duration: 7200
  tags:
    - text
    - moe
    - fp8
  url: https://huggingface.co/RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
  client:
    argv:
      --model: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
  server:
    argv:
      RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic: true
      --gpu-memory-utilization: 0.95
      --max-model-len: 5120
      # Gemma 4's image encoder needs 2496 tokens per item (vLLM refuses to start below that), even for text
      --max-num-batched-tokens: 4096
      --enforce-eager: true

homelab-vllm-gemma4-fp8:
  inherits: _h_vllm_gemma4_fp8
  enabled: true
  weight: 1

# W8A8 INT8: Instella-MoE 16B-A3B (15.9 GB weights). Needs a vLLM that registers InstellaMoEForCausalLM.
_h_vllm_instella_w8a8:
  inherits: _serving_vllm_32gb
  tags:
    - text
    - moe
    - w8a8
  url: https://huggingface.co/amd/Instella-MoE-16B-A3B-SFT-w8a8-llmcompressor
  client:
    argv:
      --model: amd/Instella-MoE-16B-A3B-SFT-w8a8-llmcompressor
  server:
    argv:
      amd/Instella-MoE-16B-A3B-SFT-w8a8-llmcompressor: true

homelab-vllm-instella-w8a8:
  inherits: _h_vllm_instella_w8a8
  enabled: false  # vllm 0.29: InstellaMoEForCausalLM arch not registered
  weight: 1

# --- Runtime FP8 vs pre-quantized (tag quant-compare): per model, the same server settings and passes
# (_serving_vllm_32gb), only the weights change:
#   bf16          the original checkpoint
#   fp8-runtime   the same checkpoint quantized when it loads (--quantization fp8: FP8 weights, dynamic
#                 per-token activation scales), no calibration
#   fp8           a pre-quantized FP8 checkpoint (offline, calibrated) — homelab-vllm-qwen3-8b-fp8 above
#   w8a8          INT8 weights and activations (Llama only) — homelab-vllm-llama8b-w8a8 above
# Run the set with --select quant-compare. Speed is one half of the choice: check accuracy too
# (client.passes eval, benchmarks/serving). ---

_h_vllm_qwen3_8b:
  inherits: _serving_vllm_32gb
  tags:
    - text
    - dense
    - quant-compare
  url: https://huggingface.co/Qwen/Qwen3-8B
  client:
    argv:
      --model: Qwen/Qwen3-8B
  server:
    argv:
      Qwen/Qwen3-8B: true

homelab-vllm-qwen3-8b-bf16:
  inherits: _h_vllm_qwen3_8b
  enabled: true
  weight: 1
  tags:
    - bf16

homelab-vllm-qwen3-8b-fp8-runtime:
  inherits: _h_vllm_qwen3_8b
  enabled: true
  weight: 1
  tags:
    - fp8
  server:
    argv:
      --quantization: fp8

# Llama-3.1-8B-Instruct (gated: accept the license, HF_TOKEN)
_h_vllm_llama8b:
  inherits: _serving_vllm_32gb
  tags:
    - text
    - dense
    - quant-compare
  url: https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct
  client:
    argv:
      --model: meta-llama/Llama-3.1-8B-Instruct
  server:
    argv:
      meta-llama/Llama-3.1-8B-Instruct: true

homelab-vllm-llama8b-bf16:
  inherits: _h_vllm_llama8b
  enabled: true
  weight: 1
  tags:
    - bf16

homelab-vllm-llama8b-fp8-runtime:
  inherits: _h_vllm_llama8b
  enabled: true
  weight: 1
  tags:
    - fp8
  server:
    argv:
      --quantization: fp8

homelab-vllm-llama8b-fp8:
  inherits: _serving_vllm_32gb
  enabled: true
  weight: 1
  tags:
    - text
    - dense
    - fp8
    - quant-compare
  url: https://huggingface.co/RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8-dynamic
  client:
    argv:
      --model: RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8-dynamic
  server:
    argv:
      RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8-dynamic: true

# Gemma 4 E4B (instruction-tuned; 8B parameters with per-layer embeddings, ~4B effective). No first-party
# FP8 checkpoint: BF16 vs runtime FP8, and Gemma 4's MTP drafter (the "assistant" model) on BF16.
# Known: runtime FP8 crashed on XPU with vLLM 0.30 / 0.31 (oneDNN fp8_gemm_w8a16 assert).
_h_vllm_gemma4_e4b:
  inherits: _serving_vllm_32gb
  tags:
    - text
    - dense
    - quant-compare
  url: https://huggingface.co/google/gemma-4-E4B-it
  client:
    argv:
      --model: google/gemma-4-E4B-it
  server:
    argv:
      google/gemma-4-E4B-it: true

homelab-vllm-gemma4-e4b-bf16:
  inherits: _h_vllm_gemma4_e4b
  enabled: true
  weight: 1
  tags:
    - bf16

homelab-vllm-gemma4-e4b-fp8-runtime:
  inherits: _h_vllm_gemma4_e4b
  enabled: true
  weight: 1
  tags:
    - fp8
  server:
    argv:
      --quantization: fp8

homelab-vllm-gemma4-e4b-bf16-mtp:
  inherits: _h_vllm_gemma4_e4b
  enabled: true
  weight: 1
  tags:
    - bf16
    - mtp
  server:
    argv:
      --speculative-config: '{"model": "google/gemma-4-E4B-it-assistant", "num_speculative_tokens": 3}'

# Gemma 4 E2B (instruction-tuned; ~2B effective with per-layer embeddings): the same three as E4B.
_h_vllm_gemma4_e2b:
  inherits: _serving_vllm_32gb
  tags:
    - text
    - dense
    - quant-compare
  url: https://huggingface.co/google/gemma-4-E2B-it
  client:
    argv:
      --model: google/gemma-4-E2B-it
  server:
    argv:
      google/gemma-4-E2B-it: true

homelab-vllm-gemma4-e2b-bf16:
  inherits: _h_vllm_gemma4_e2b
  enabled: true
  weight: 1
  tags:
    - bf16

homelab-vllm-gemma4-e2b-fp8-runtime:
  inherits: _h_vllm_gemma4_e2b
  enabled: true
  weight: 1
  tags:
    - fp8
  server:
    argv:
      --quantization: fp8

homelab-vllm-gemma4-e2b-bf16-mtp:
  inherits: _h_vllm_gemma4_e2b
  enabled: true
  weight: 1
  tags:
    - bf16
    - mtp
  server:
    argv:
      --speculative-config: '{"model": "google/gemma-4-E2B-it-assistant", "num_speculative_tokens": 3}'

# --- llama.cpp: native backend vs Vulkan, one bench per concurrency (slots are sized by it) ---

homelab-llamacpp-qwen3-8b-q8:
  matrix:
    backend: [native, vulkan]
    concurrency: [1, 8]
  job:
    name: 'homelab-llamacpp-qwen3-8b-q8-{backend}-conc{concurrency}'
    tags:
      - text
    inherits: _llamacpp_serving
