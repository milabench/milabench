    enabled: true
    weight: 1
    server:
      argv:
        --repo: mradermacher/OpenCodeReasoning-Nemotron-1.1-32B-GGUF
        --file: OpenCodeReasoning-Nemotron-1.1-32B.Q8_0.gguf
        --model: nvidia/OpenCodeReasoning-Nemotron-1.1-32B
        --backend: "{backend}"
        --parallel: "{concurrency}"
        --ctx-size: "expr({concurrency} * 8192)"
    client:
      argv:
        --max-concurrency: "{concurrency}"
        --num-warmups: "{concurrency}"
        --num-prompts: "expr({concurrency} * 5)"

homelab-llamacpp-opencodereasoning-nemotron-32b-q8-quality:
  inherits: _llamacpp_quality
  enabled: true
  max_duration: 43200  # always reasoning, dense 32B: slow
  weight: 1
  tags: [text]
  server:
    argv: {--repo: mradermacher/OpenCodeReasoning-Nemotron-1.1-32B-GGUF, --file: OpenCodeReasoning-Nemotron-1.1-32B.Q8_0.gguf, --model: nvidia/OpenCodeReasoning-Nemotron-1.1-32B,
           --quality-thinking: "on", --quality-thinking-max-tokens: 32768, --parallel: 4, --ctx-size: 163840}

# --- XBai-o4 (MetaStone, 32B reasoning; leaderboard 65.0, medium effort) ---
homelab-llamacpp-xbai-o4-q8:
  matrix:
    backend: [native]
    concurrency: [1, 8]
  job:
    name: 'homelab-llamacpp-xbai-o4-q8-{backend}-conc{concurrency}'
    tags:
