# --- Step 3.5 Flash (StepFun 196B-A11B MoE, 45 layers, 288 experts top-8, Apache-2.0). ggml-org's Q4_K is 118.7 GB,
# the whole 119.6 GB of unified memory: bartowski's Q3_K_M (90.2 GB, 3 shards) instead, DeepSeek-V4-Flash Q2's size.
# Its KV cache is small: 3 layers in 4 attend a 512-token window, so 40k per slot costs ~2 GB. It always reasons
# (its template opens every reply with <think>): scored thinking on, 32k budget, 4 slots of 40k. Direct-I/O load
# (--load-mode dio, see DeepSeek-V4-Flash below) ---
homelab-llamacpp-step35-flash-q3-quality:
  inherits: _llamacpp_quality
  enabled: true
  weight: 1
  max_duration: 43200  # thinking on: the 32B reasoning models needed ~12 h
  tags: [text, moe, gguf]
  server:
    argv:
      --repo: bartowski/stepfun-ai_Step-3.5-Flash-GGUF
      --file: stepfun-ai_Step-3.5-Flash-Q3_K_M/stepfun-ai_Step-3.5-Flash-Q3_K_M-00001-of-00003.gguf
      --model: stepfun-ai/Step-3.5-Flash
      --quality-thinking: "on"
      --quality-thinking-max-tokens: 32768
      --parallel: 4
      # 163840 left ~17 GB available once loaded: a driver out-of-memory at load (2026-11-25) and MemAvailable
      # down to 5 GiB after 7 h (2026-11-24). The KV cache is unified: the 4 slots share 81920 tokens, one
      # 32k reply still fits
      --ctx-size: 81920
      --load-mode: dio

homelab-llamacpp-step35-flash-q3:
  matrix:
    concurrency: [1, 4]
  job:
    name: 'homelab-llamacpp-step35-flash-q3-conc{concurrency}'
    tags:
      - text
      - moe
      - gguf
    inherits: _llamacpp_serving
    enabled: true
    weight: 1
    url: https://huggingface.co/bartowski/stepfun-ai_Step-3.5-Flash-GGUF
    server:
      argv:
        --repo: bartowski/stepfun-ai_Step-3.5-Flash-GGUF
        --file: stepfun-ai_Step-3.5-Flash-Q3_K_M/stepfun-ai_Step-3.5-Flash-Q3_K_M-00001-of-00003.gguf
        --model: stepfun-ai/Step-3.5-Flash
        --backend: native
        --parallel: "{concurrency}"
        --ctx-size: "expr({concurrency} * 8192)"
        --load-mode: dio
    client:
      argv:
        --max-concurrency: "{concurrency}"
        --num-warmups: "{concurrency}"
        --num-prompts: "expr({concurrency} * 5)"


