      # draft tokens, 2026-11-13: the head's weights are in the checkpoint, its loading is not), a pure slowdown
      # (10.6 tok/s for one stream). The bench keeps its name; outputs are the same either way
      # --speculative-config: '{"method": "mtp", "num_speculative_tokens": 3}'

# --- Qwen3.8-27B BF16, the unquantized release (56 GB), same DFlash 2 drafter: the reference the FP8 and
# NVFP4 entries lose against. Bandwidth-bound on a GB10 (273 GB/s): ~5 tok/s a stream before the drafter ---
homelab-vllm-qwen38-27b-bf16-dflash2:
  inherits: _serving_vllm
  enabled: true
  weight: 1
  max_duration: 14400
  tags:
    - text
    - dense
    - bf16
    - dflash
  url: https://huggingface.co/Qwen/Qwen3.8-27B
  client:
    argv:
      --model: Qwen/Qwen3.8-27B
  server:
    argv:
      Qwen/Qwen3.8-27B: true
      --speculative-config: '{"method": "dflash", "model": "z-lab/Qwen3.8-27B-DFlash2", "num_speculative_tokens": 7}'

# --- Muse Glimmer 30B BF16, the unquantized release (60 GB), same drafter: the reference for the FP8 and
# NVFP4 entries (and no NVFP4 kernels: tells them apart from the drafter if the NVFP4 entry hangs again) ---
homelab-vllm-muse-glimmer-30b-bf16-dflash:
  inherits: _serving_vllm
  enabled: true
  weight: 1
  max_duration: 21600  # thinking on
  tags:
    - text
    - dense
    - bf16
    - dflash
  url: https://huggingface.co/meta-models/Muse-Glimmer-30B
  client:
    argv:
      --model: meta-models/Muse-Glimmer-30B
      --trust-remote-code: true
    # Muse always reasons (its channels have no off switch): QualityBench's thinking-off preflight gets
    # reasoning and no content, so it is scored thinking on, the reasoning capped to fit the 16k context
    passes:
      - {name: single, argv: {--max-concurrency: 1,  --num-warmups: 1,  --num-prompts: 8,   --random-input-len: 1024, --random-output-len: 512}}
      - {name: fill4k, argv: {--max-concurrency: 1,  --num-warmups: 1,  --num-prompts: 8,   --random-input-len: 4096, --random-output-len: 512}}
      - {name: conc8,  argv: {--max-concurrency: 8,  --num-warmups: 8,  --num-prompts: 40,  --random-input-len: 1024, --random-output-len: 512}}
      - {name: quality, quality: {tier: quick, thinking: ["on"], thinking_max_tokens: 8192, tasks: [gsm8k, ifeval, mmlu_pro, humaneval, mbpp, lcb, logprobs]}}
      - {name: conc32, argv: {--max-concurrency: 32, --num-warmups: 32, --num-prompts: 160, --random-input-len: 1024, --random-output-len: 512}}
  server:
    argv:
      meta-models/Muse-Glimmer-30B: true
      --trust-remote-code: true
      # 2 shards of ~28 GB: eager loading holds a whole shard in RAM next to its copy on the GPU (the same
      # memory on a GB10) and memguard stopped it at 50 GB RSS (2026-11-13); mmap it instead
      --safetensors-load-strategy: lazy
      --speculative-config: '{"method": "dflash", "model": "meta-models/Muse-Glimmer-30B-assistant", "num_speculative_tokens": 15}'
      # its chat format (channels and special tokens): without the parser the replies are fragments (" to=self")
      --reasoning-parser: muse_glimmer

homelab-llamacpp-glm53-flash-q2-quality:
  inherits: _llamacpp_quality
  enabled: true
  weight: 1
  max_duration: 28800  # thinking on, one slot: QualityBench's deadline keeps what is scored
  tags: [text, moe, gguf]
  server:
    argv:
      --repo: unsloth/GLM-5.3-Flash-GGUF
      --file: UD-Q2_K_XL/GLM-5.3-Flash-UD-Q2_K_XL-00001-of-00004.gguf
      --model: zai-org/GLM-5.3-Flash
      # GLM always reasons: QualityBench's thinking-off preflight gets reasoning and no content (2026-11-13)
      --quality-thinking: "on"
      --quality-thinking-max-tokens: 8192
      # 102 GB of weights on 120 GB: 4 slots of 8k (32k of KV) ran it out of memory (memguard, conc4), so one
      # slot of 16k, room for the prompt and 8k of reasoning
      --parallel: 1
      --ctx-size: 16384

# --- GLM-5.3-Flash 320B-A18B, unsloth UD-Q2_K_XL (108.7 GB, 4 shards), llama.cpp on the arch's native backend.
# Build llama.cpp once in $MILABENCH_LLAMACPP_ROOT, e.g. for CUDA:
#   cmake -B build-cuda -DGGML_CUDA=ON && cmake --build build-cuda -j --target llama-server llama-bench ---
homelab-llamacpp-glm53-flash-q2:
  matrix:
    concurrency: [1, 4]
  job:
    name: 'homelab-llamacpp-glm53-flash-q2-conc{concurrency}'
    tags:
      - text
      - moe
      - gguf
    inherits: _llamacpp_serving
    enabled: true
    weight: 1
    url: https://huggingface.co/unsloth/GLM-5.3-Flash-GGUF
    server:
      argv:
        --repo: unsloth/GLM-5.3-Flash-GGUF
        --file: UD-Q2_K_XL/GLM-5.3-Flash-UD-Q2_K_XL-00001-of-00004.gguf
        --model: zai-org/GLM-5.3-Flash
        --backend: native
        --parallel: "{concurrency}"
        --ctx-size: "expr({concurrency} * 8192)"
    client:
      argv:
        --max-concurrency: "{concurrency}"
        --num-warmups: "{concurrency}"
        --num-prompts: "expr({concurrency} * 5)"

# =============================================================================
# Too big for vLLM on 128 GB (NVFP4: DeepSeek-V4-Flash 157 GB, Qwen3.8-Flash-Next 124 GB): unsloth
# dynamic GGUFs on llama.cpp, like GLM-5.3-Flash above. No draft model.
# =============================================================================

# --- DeepSeek-V4-Flash-0731 (284B-A13B class, 43 layers, 256 experts top-6), UD-Q2_K_XL (90 GB, 3 shards).
# UD-Q3_K_XL is 119 GB: no room left for the KV cache ---
homelab-llamacpp-deepseek-v4-flash-q2-quality:
  inherits: _llamacpp_quality
  enabled: true
  weight: 1
  max_duration: 14400
  tags: [text, moe, gguf]
  server:
    argv:
      --repo: unsloth/DeepSeek-V4-Flash-0731-GGUF
      --file: UD-Q2_K_XL/DeepSeek-V4-Flash-0731-UD-Q2_K_XL-00001-of-00003.gguf
      --model: deepseek-ai/DeepSeek-V4-Flash-0731
      --parallel: 4
      --ctx-size: 32768
      # read the shards with direct I/O instead of mapping them: with mmap the mapped file and its GPU copy both
      # hold memory while it loads, and the driver failed to allocate (NV_ERR_NO_MEMORY) with 25 GB still
      # available (2026-11-23). dio bypasses the page cache (falls back to plain reads where unsupported)
      --load-mode: dio

homelab-llamacpp-deepseek-v4-flash-q2:
  matrix:
    concurrency: [1, 4]
  job:
    name: 'homelab-llamacpp-deepseek-v4-flash-q2-conc{concurrency}'
    tags:
      - text
      - moe
      - gguf
