      nvidia/Qwen3.6-27B-NVFP4: true

# --- gpt-oss-120b MXFP4 (65 GB of weights), plus a 256-stream pass for the aggregate number ---
homelab-vllm-gptoss-120b-mxfp4:
  inherits: _llm_vllm
  enabled: true
  weight: 1
  tags:
    - text
    - moe
    - mxfp4
  url: https://huggingface.co/openai/gpt-oss-120b
  client:
    argv:
      --model: openai/gpt-oss-120b
    # the reasoning list (always reasons: thinking on), RULER at low effort (its 4096-token budget holds the
    # reasoning and the answer), and a 256-stream pass for the aggregate number
    passes:
      - *single
      - *fill4k
      - *conc8
      - *ctx8k
      - *ctx32k
      - *ctx64k
      - *ctx128k
      - *ctx256k
      - *conc4_32k
      - *ctx32k_1
      - *ctx32k_4
      - *ctx60k_4
      - *quality_on
      - *bfcl_ext_on
      - *bfcl_lat_on
      - {name: ruler, eval: {tasks: *ruler_tasks, num_concurrent: 4, gen_kwargs: {max_gen_toks: 4096, temperature: 0, reasoning_effort: low}, log_samples: true}}
      - *swebench
      - *terminalbench
      - *conc32
      - {name: conc256, argv: {--max-concurrency: 256, --num-warmups: 256, --num-prompts: 1024, --random-input-len: 1024, --random-output-len: 512}}
  server:
    argv:
      --tool-call-parser: openai
      --reasoning-parser: openai_gptoss
      --max-model-len: 131072  # the model's native context
      openai/gpt-oss-120b: true
      --max-num-seqs: 256
      # gpt-oss: its own attention sinks, keep the KV cache in bf16
      --kv-cache-dtype: auto

