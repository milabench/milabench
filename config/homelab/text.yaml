# =============================================================================
# Homelab — text generation (LLM)
#
#   homelab-llm-chat        HF transformers, Llama-3.1-8B-Instruct
#   homelab-vllm-*          vLLM quantized serving (fp8 / w8a8) for a 32 GB card, passes conc 1 / 8 / 32
#   homelab-llamacpp-*      llama.cpp GGUF, native backend (SYCL / CUDA / HIP) vs Vulkan, conc 1 / 8
#
# Then, on the regular per-arch install (bottom of the file), recent 4-bit models + speculative decoding:
#   homelab-vllm-{qwen36-35b-a3b, gemma4-26b-a4b}-*-mtp, homelab-vllm-qwen38-27b-nvfp4-dflash2,
#   homelab-vllm-{qwen3-coder-30b-a3b-awq, nemotron3-nano-30b-a3b-nvfp4, qwen36-27b-nvfp4, gptoss-120b-mxfp4},
#   homelab-llamacpp-glm53-flash-q2 (and homelab-sglang-qwen38-27b-nvfp4-dflash2, off)
#
# Runtime FP8 vs pre-quantized (Qwen3-8B, Llama-3.1-8B, gemma-4-E4B): --select quant-compare
#
# Every perf pass sends real text (--real-text), not random token ids, after its warmup requests.
#
# 2-GPU variants (TP=2 / DP=2): multigpu.yaml
# =============================================================================

include:
  - _base.yaml

homelab-llm-chat:
  inherits: _inference
  tags:
    - text
    - monogpu
  max_duration: 3600
  plan:
    method: per_gpu
  url: https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct
  argv:
    --mode: chat
    --model: meta-llama/Llama-3.1-8B-Instruct
    --dataset: hendrydong/gpqa_diamond
    --split: "test"
    # bs=1 already reserves ~17.4 GB on the B70; autosizer steps down from 4.
    --batch_size: "auto_batch(4)"

# --- 32 GB card (_serving_vllm_32gb): one server per model, the common passes (single / fill4k / conc8 / conc32) ---

# FP8: Qwen3-8B (dense) — the bring-up pack, smallest download
_h_vllm_qwen3_8b_fp8:
  inherits: _serving_vllm_32gb
  tags:
    - text
    - dense
    - fp8
  url: https://huggingface.co/Qwen/Qwen3-8B-FP8
  client:
    argv:
      --model: Qwen/Qwen3-8B-FP8
  server:
    argv:
      Qwen/Qwen3-8B-FP8: true

homelab-vllm-qwen3-8b-fp8:
  inherits: _h_vllm_qwen3_8b_fp8
  enabled: true
  tags:
    - quant-compare
  weight: 1

# W8A8 INT8: Llama-3.1-8B dense fallback
_h_vllm_llama8b_w8a8:
  inherits: _serving_vllm_32gb
  tags:
    - text
    - dense
    - w8a8
  url: https://huggingface.co/RedHatAI/Meta-Llama-3.1-8B-Instruct-quantized.w8a8
  client:
    argv:
      --model: RedHatAI/Meta-Llama-3.1-8B-Instruct-quantized.w8a8
  server:
    argv:
      RedHatAI/Meta-Llama-3.1-8B-Instruct-quantized.w8a8: true

homelab-vllm-llama8b-w8a8:
  inherits: _h_vllm_llama8b_w8a8
  enabled: true
  tags:
    - quant-compare
  weight: 1

# FP8: Gemma-4 26B-A4B MoE (26.5 GB weights): a 5k context (fill4k: 4096 in + 512 out), small prefill
# chunks and eager mode (graph capture needs memory) leave room for the KV cache on a 32 GB card
_h_vllm_gemma4_fp8:
  inherits: _serving_vllm_32gb
  max_duration: 7200
  tags:
    - text
    - moe
    - fp8
  url: https://huggingface.co/RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
  client:
    argv:
      --model: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
  server:
    argv:
      RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic: true
      --gpu-memory-utilization: 0.95
      --max-model-len: 5120
      # Gemma 4's image encoder needs 2496 tokens per item (vLLM refuses to start below that), even for text
      --max-num-batched-tokens: 4096
      --enforce-eager: true

homelab-vllm-gemma4-fp8:
  inherits: _h_vllm_gemma4_fp8
  enabled: true
  weight: 1

# W8A8 INT8: Instella-MoE 16B-A3B (15.9 GB weights). Needs a vLLM that registers InstellaMoEForCausalLM.
_h_vllm_instella_w8a8:
  inherits: _serving_vllm_32gb
  tags:
    - text
    - moe
    - w8a8
  url: https://huggingface.co/amd/Instella-MoE-16B-A3B-SFT-w8a8-llmcompressor
  client:
    argv:
      --model: amd/Instella-MoE-16B-A3B-SFT-w8a8-llmcompressor
  server:
    argv:
      amd/Instella-MoE-16B-A3B-SFT-w8a8-llmcompressor: true

homelab-vllm-instella-w8a8:
  inherits: _h_vllm_instella_w8a8
  enabled: false  # vllm 0.29: InstellaMoEForCausalLM arch not registered
  weight: 1

# --- Runtime FP8 vs pre-quantized (tag quant-compare): per model, the same server settings and passes
# (_serving_vllm_32gb), only the weights change:
#   bf16          the original checkpoint
#   fp8-runtime   the same checkpoint quantized when it loads (--quantization fp8: FP8 weights, dynamic
#                 per-token activation scales), no calibration
#   fp8           a pre-quantized FP8 checkpoint (offline, calibrated) — homelab-vllm-qwen3-8b-fp8 above
#   w8a8          INT8 weights and activations (Llama only) — homelab-vllm-llama8b-w8a8 above
# Run the set with --select quant-compare. Speed is one half of the choice: check accuracy too
# (client.passes eval, benchmarks/serving). ---

_h_vllm_qwen3_8b:
  inherits: _serving_vllm_32gb
  tags:
    - text
    - dense
    - quant-compare
  url: https://huggingface.co/Qwen/Qwen3-8B
  client:
    argv:
      --model: Qwen/Qwen3-8B
  server:
    argv:
      Qwen/Qwen3-8B: true

homelab-vllm-qwen3-8b-bf16:
  inherits: _h_vllm_qwen3_8b
  enabled: true
  weight: 1
  tags:
    - bf16

homelab-vllm-qwen3-8b-fp8-runtime:
  inherits: _h_vllm_qwen3_8b
  enabled: true
  weight: 1
  tags:
    - fp8
  server:
    argv:
      --quantization: fp8

# Llama-3.1-8B-Instruct (gated: accept the license, HF_TOKEN)
_h_vllm_llama8b:
  inherits: _serving_vllm_32gb
  tags:
    - text
    - dense
    - quant-compare
  url: https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct
  client:
    argv:
      --model: meta-llama/Llama-3.1-8B-Instruct
  server:
    argv:
      meta-llama/Llama-3.1-8B-Instruct: true

homelab-vllm-llama8b-bf16:
  inherits: _h_vllm_llama8b
  enabled: true
  weight: 1
  tags:
    - bf16

homelab-vllm-llama8b-fp8-runtime:
  inherits: _h_vllm_llama8b
  enabled: true
  weight: 1
  tags:
    - fp8
  server:
    argv:
      --quantization: fp8

homelab-vllm-llama8b-fp8:
  inherits: _serving_vllm_32gb
  enabled: true
  weight: 1
  tags:
    - text
    - dense
    - fp8
    - quant-compare
  url: https://huggingface.co/RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8-dynamic
  client:
    argv:
      --model: RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8-dynamic
  server:
    argv:
      RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8-dynamic: true

# Gemma 4 E4B (instruction-tuned; 8B parameters with per-layer embeddings, ~4B effective). No first-party
# FP8 checkpoint: BF16 vs runtime FP8, and Gemma 4's MTP drafter (the "assistant" model) on BF16.
# Known: runtime FP8 crashed on XPU with vLLM 0.30 / 0.31 (oneDNN fp8_gemm_w8a16 assert).
_h_vllm_gemma4_e4b:
  inherits: _serving_vllm_32gb
  tags:
    - text
    - dense
    - quant-compare
  url: https://huggingface.co/google/gemma-4-E4B-it
  client:
    argv:
      --model: google/gemma-4-E4B-it
  server:
    argv:
      google/gemma-4-E4B-it: true

homelab-vllm-gemma4-e4b-bf16:
  inherits: _h_vllm_gemma4_e4b
  enabled: true
  weight: 1
  tags:
    - bf16

homelab-vllm-gemma4-e4b-fp8-runtime:
  inherits: _h_vllm_gemma4_e4b
  enabled: true
  weight: 1
  tags:
    - fp8
  server:
    argv:
      --quantization: fp8

homelab-vllm-gemma4-e4b-bf16-mtp:
  inherits: _h_vllm_gemma4_e4b
  enabled: true
  weight: 1
  tags:
    - bf16
    - mtp
  server:
    argv:
      --speculative-config: '{"model": "google/gemma-4-E4B-it-assistant", "num_speculative_tokens": 3}'

# Gemma 4 E2B (instruction-tuned; ~2B effective with per-layer embeddings): the same three as E4B.
_h_vllm_gemma4_e2b:
  inherits: _serving_vllm_32gb
  tags:
    - text
    - dense
    - quant-compare
  url: https://huggingface.co/google/gemma-4-E2B-it
  client:
    argv:
      --model: google/gemma-4-E2B-it
  server:
    argv:
      google/gemma-4-E2B-it: true

homelab-vllm-gemma4-e2b-bf16:
  inherits: _h_vllm_gemma4_e2b
  enabled: true
  weight: 1
  tags:
    - bf16

homelab-vllm-gemma4-e2b-fp8-runtime:
  inherits: _h_vllm_gemma4_e2b
  enabled: true
  weight: 1
  tags:
    - fp8
  server:
    argv:
      --quantization: fp8

homelab-vllm-gemma4-e2b-bf16-mtp:
  inherits: _h_vllm_gemma4_e2b
  enabled: true
  weight: 1
  tags:
    - bf16
    - mtp
  server:
    argv:
      --speculative-config: '{"model": "google/gemma-4-E2B-it-assistant", "num_speculative_tokens": 3}'

# --- llama.cpp: native backend vs Vulkan, one bench per concurrency (slots are sized by it) ---

homelab-llamacpp-qwen3-8b-q8:
  matrix:
    backend: [native, vulkan]
    concurrency: [1, 8]
  job:
    name: 'homelab-llamacpp-qwen3-8b-q8-{backend}-conc{concurrency}'
    tags:
      - text
    inherits: _llamacpp_serving
    enabled: true  # bring-up model; frontier GGUFs stay off until this passes
    weight: 1
    server:
      argv:
        --repo: ggml-org/Qwen3-8B-GGUF
        --file: Qwen3-8B-Q8_0.gguf
        --model: Qwen/Qwen3-8B
        --backend: "{backend}"
        --parallel: "{concurrency}"
        --ctx-size: "expr({concurrency} * 8192)"
    client:
      argv:
        --max-concurrency: "{concurrency}"
        --num-warmups: "{concurrency}"
        --num-prompts: "expr({concurrency} * 5)"

homelab-llamacpp-gptoss-q4xl:
  matrix:
    backend: [native, vulkan]
    concurrency: [1, 8]
  job:
    name: 'homelab-llamacpp-gptoss-q4xl-{backend}-conc{concurrency}'
    tags:
      - text
    inherits: _llamacpp_serving
    enabled: true
    weight: 1
    server:
      argv:
        --repo: unsloth/gpt-oss-20b-GGUF
        --file: gpt-oss-20b-UD-Q4_K_XL.gguf
        --model: openai/gpt-oss-20b
        --backend: "{backend}"
        --parallel: "{concurrency}"
        --ctx-size: "expr({concurrency} * 8192)"
    client:
      argv:
        --max-concurrency: "{concurrency}"
        --num-warmups: "{concurrency}"
        --num-prompts: "expr({concurrency} * 5)"

homelab-llamacpp-qwen3-30b-q4km:
  matrix:
    backend: [native, vulkan]
    concurrency: [1, 8]
  job:
    name: 'homelab-llamacpp-qwen3-30b-q4km-{backend}-conc{concurrency}'
    tags:
      - text
    inherits: _llamacpp_serving
    enabled: true
    weight: 1
    server:
      argv:
        --repo: unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF
        --file: Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf
        --model: Qwen/Qwen3-30B-A3B-Instruct-2507
        --backend: "{backend}"
        --parallel: "{concurrency}"
        --ctx-size: "expr({concurrency} * 8192)"
    client:
      argv:
        --max-concurrency: "{concurrency}"
        --num-warmups: "{concurrency}"
        --num-prompts: "expr({concurrency} * 5)"

homelab-llamacpp-gemma4-q4:
  matrix:
    backend: [native, vulkan]
    concurrency: [1, 8]
  job:
    name: 'homelab-llamacpp-gemma4-q4-{backend}-conc{concurrency}'
    tags:
      - text
    inherits: _llamacpp_serving
    enabled: true
    weight: 1
    server:
      argv:
        --repo: ggml-org/gemma-4-26B-A4B-it-GGUF
        --file: gemma-4-26B-A4B-it-Q4_0.gguf
        --model: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
        --backend: "{backend}"
        --parallel: "{concurrency}"
        --ctx-size: "expr({concurrency} * 8192)"
    client:
      argv:
        --max-concurrency: "{concurrency}"
        --num-warmups: "{concurrency}"
        --num-prompts: "expr({concurrency} * 5)"

# --- llama.cpp accuracy: QualityBench, once per GGUF model (_llamacpp_quality) ---
homelab-llamacpp-qwen3-8b-q8-quality:
  inherits: _llamacpp_quality
  enabled: true
  weight: 1
  tags: [text]
  server:
    argv: {--repo: ggml-org/Qwen3-8B-GGUF, --file: Qwen3-8B-Q8_0.gguf, --model: Qwen/Qwen3-8B}

homelab-llamacpp-gptoss-q4xl-quality:
  inherits: _llamacpp_quality
  enabled: true
  max_duration: 14400  # thinking on: longer answers (2 h was cut during LiveCodeBench)
  weight: 1
  tags: [text]
  server:
    # gpt-oss always reasons (harmony: an effort level, no off switch): QualityBench's thinking-off preflight
    # refuses it, so it is scored thinking on
    # 4 slots: --ctx-size is split across them, and a reasoning answer needs QualityBench's 32k thinking budget
    # (16 slots gave 8k each: "Context size has been exceeded")
    argv: {--repo: unsloth/gpt-oss-20b-GGUF, --file: gpt-oss-20b-UD-Q4_K_XL.gguf, --model: openai/gpt-oss-20b,
           --quality-thinking: "on", --parallel: 4}

homelab-llamacpp-qwen3-30b-q4km-quality:
  inherits: _llamacpp_quality
  enabled: true
  weight: 1
  tags: [text]
  server:
    argv: {--repo: unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF, --file: Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf,
           --model: Qwen/Qwen3-30B-A3B-Instruct-2507}

homelab-llamacpp-gemma4-q4-quality:
  inherits: _llamacpp_quality
  enabled: true
  weight: 1
  tags: [text]
  server:
    argv: {--repo: ggml-org/gemma-4-26B-A4B-it-GGUF, --file: gemma-4-26B-A4B-it-Q4_0.gguf,
           --model: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic}

# =============================================================================
# Open 32B reasoning models from the LiveCodeBench leaderboard (added 2026-11-15): dense, always reasoning
# (R1-style <think>, no off switch), so scored thinking on. No FP8/NVFP4 checkpoint published: llama.cpp Q8_0
# (~35 GB, near lossless). Quality: 4 slots of 40k for 32k-token replies (as gpt-oss).
# =============================================================================

# --- OpenReasoning-Nemotron-32B (NVIDIA, Qwen2.5-32B reasoning distill; LiveCodeBench leaderboard 69.8) ---
homelab-llamacpp-openreasoning-nemotron-32b-q8:
  matrix:
    backend: [native]
    concurrency: [1, 8]
  job:
    name: 'homelab-llamacpp-openreasoning-nemotron-32b-q8-{backend}-conc{concurrency}'
    tags:
      - text
    inherits: _llamacpp_serving
    enabled: true
    weight: 1
    server:
      argv:
        --repo: bartowski/nvidia_OpenReasoning-Nemotron-32B-GGUF
        --file: nvidia_OpenReasoning-Nemotron-32B-Q8_0.gguf
        --model: nvidia/OpenReasoning-Nemotron-32B
        --backend: "{backend}"
        --parallel: "{concurrency}"
        --ctx-size: "expr({concurrency} * 8192)"
    client:
      argv:
        --max-concurrency: "{concurrency}"
        --num-warmups: "{concurrency}"
        --num-prompts: "expr({concurrency} * 5)"

homelab-llamacpp-openreasoning-nemotron-32b-q8-quality:
  inherits: _llamacpp_quality
  enabled: true
  max_duration: 43200  # always reasoning, dense 32B: slow
  weight: 1
  tags: [text]
  server:
    argv: {--repo: bartowski/nvidia_OpenReasoning-Nemotron-32B-GGUF, --file: nvidia_OpenReasoning-Nemotron-32B-Q8_0.gguf, --model: nvidia/OpenReasoning-Nemotron-32B,
           --quality-thinking: "on", --quality-thinking-max-tokens: 32768, --parallel: 4, --ctx-size: 163840}

# --- OpenCodeReasoning-Nemotron-1.1-32B (NVIDIA, code reasoning; leaderboard 66.8) ---
homelab-llamacpp-opencodereasoning-nemotron-32b-q8:
  matrix:
    backend: [native]
    concurrency: [1, 8]
  job:
    name: 'homelab-llamacpp-opencodereasoning-nemotron-32b-q8-{backend}-conc{concurrency}'
    tags:
      - text
