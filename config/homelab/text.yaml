# Qwen3.6-35B-A3B with an unquantized (bf16) KV cache: does the fp8 KV cache cost retrieval at 128k?
homelab-vllm-qwen36-35b-a3b-nvfp4-mtp-kvbf16:
  inherits: homelab-vllm-qwen36-35b-a3b-nvfp4-mtp
  max_duration: 10800
  tags: [longctx, kv-compare]
  server:
    argv:
      --kv-cache-dtype: auto
  client:
    passes:
      - *ctx32k
      - *ctx128k
      - {name: needle, quality: {tier: full, thinking: ["off"], tasks: [needle]}}
      - *ruler_off

# The 32 GB-card set at a 40k context with its tool-call parser: tool calling (BFCL) of the small models
homelab-vllm-qwen3-8b-fp8-ctx40k:
