  inherits: _llm_vllm
  enabled: true
  weight: 1
  tags:
    - text
    - moe
    - awq
  url: https://huggingface.co/cyankiwi/Kimi-Linear-48B-A3B-Instruct-AWQ-4bit
  # tokenizer from the original repo (same tokenizer): the AWQ repo's tokenization_kimi.py still imports
  # bytes_to_unicode from transformers.models.gpt2, gone in transformers 5 (moonshotai's copy is fixed)
  client:
    passes: *llm_plain
    argv:
      --model: cyankiwi/Kimi-Linear-48B-A3B-Instruct-AWQ-4bit
      --tokenizer: moonshotai/Kimi-Linear-48B-A3B-Instruct
      --trust-remote-code: true
  server:
    argv:
      --tool-call-parser: kimi_k2
      cyankiwi/Kimi-Linear-48B-A3B-Instruct-AWQ-4bit: true
      --tokenizer: moonshotai/Kimi-Linear-48B-A3B-Instruct
      --trust-remote-code: true
      # vLLM's fp8 KV cache for Kimi's MLA layers needs fp8 prefill queries too
      # (--attention-config '{"use_prefill_query_quantization": true}'): keep the KV cache unquantized
      # instead, it is small (1 layer in 4 is full attention)
      --kv-cache-dtype: auto

# --- Muse Glimmer 30B dense (Meta; hybrid attention, its own Mamba-style state), NVIDIA's NVFP4 (23 GB:
# fits a 32 GB card), Meta's DFlash drafter (16-token blocks = 15 draft tokens) ---
homelab-vllm-muse-glimmer-30b-nvfp4-dflash:
  inherits: _llm_vllm
  definition: ../../benchmarks/vlm  # the serving client plus the image passes
  enabled: true
  weight: 1
  tags:
    - text
    - dense
    - nvfp4
    - dflash
  url: https://huggingface.co/nvidia/Muse-Glimmer-30B-NVFP4
  client:
    passes: *llm_reasoning_vlm
    argv:
      --model: nvidia/Muse-Glimmer-30B-NVFP4
      --trust-remote-code: true
    # Muse always reasons (its channels have no off switch): QualityBench's thinking-off preflight gets
    # reasoning and no content, so it is scored thinking on, the reasoning capped to fit the 16k context
  server:
    argv:
      --tool-call-parser: muse_glimmer
      --reasoning-parser: muse_glimmer
      --max-model-len: 131072  # the model's native context
      --limit-mm-per-prompt: '{"image": 1, "video": 0}'  # the image passes: one image per request
      nvidia/Muse-Glimmer-30B-NVFP4: true
      --trust-remote-code: true
      --speculative-config: '{"method": "dflash", "model": "meta-models/Muse-Glimmer-30B-assistant", "num_speculative_tokens": 15}'
      # its chat format (channels and special tokens): without the parser the replies are fragments (" to=self")

# --- Inkling 2 Mini (Thinking Machines, 2026-11-20): looped MoE, 26.4B total / 3.4B active (5.4B effective: the
# middle 12 layers run 3 passes), trained and shipped in 4-bit (NVFP4 experts, MXFP8 last 4 layers), 20 GB, with a
# DSpark drafter in the checkpoint. Apache 2.0. https://thinkingmachines.ai/news/inkling-2-mini/
# No vLLM release serves it yet (Inkling2LoopForConditionalGeneration: vLLM PR #69028, >= 0.35): the server is the
# recipe's image (https://recipes.vllm.ai/thinkingmachines/Inkling-2-Mini, arm64 + amd64) run by podman
# (server.command), flags as in the recipe's DGX Spark config. The client stays on the homelab-serving venv.
# podman: --replace reuses the name, so a server left over by a killed bench is removed by the next start.
# No VLLMServer extras for a raw command: page-cache-friendly loading and the KV size are set here by hand.
# Always reasons (its template has reasoning_effort, default 0.9 "high", and no off switch; the lowest effort
# still reasons): scored thinking on, as Muse Glimmer. ---
homelab-vllm-inkling2-mini-dspark:
  inherits: _llm_vllm
  definition: ../../benchmarks/vlm  # the serving client plus the image passes
  enabled: true
  weight: 1
  tags:
    - text
    - moe
    - nvfp4
    - dspark
    - container
  url: https://huggingface.co/thinkingmachines/Inkling-2-Mini
  client:
    passes: *llm_reasoning_vlm
    argv:
      --model: thinkingmachines/Inkling-2-Mini
  server:
    command: [podman, run, --rm, --replace, --name, milabench-inkling2-mini, --device, nvidia.com/gpu=all,
              --ipc=host, --network=host, -v, /opt/milabench/data/hub:/opt/milabench/data/hub,
              -e, HF_HUB_CACHE=/opt/milabench/data/hub, -e, HF_HUB_OFFLINE=1,
              docker.io/vllm/vllm-openai:inkling-2-mini]
    argv:
      --tool-call-parser: inkling
      --reasoning-parser: inkling
      --limit-mm-per-prompt: '{"image": 1, "video": 0}'  # the image passes: one image per request
      thinkingmachines/Inkling-2-Mini: true
      --tensor-parallel-size: 1
      --speculative-config: '{"method": "dspark", "num_speculative_tokens": 7, "draft_sample_method": "probabilistic"}'
      # the recipe sets no KV dtype: its own (looped passes keep separate KV caches)
      --kv-cache-dtype: auto
      --safetensors-load-strategy: eager
      --kv-cache-memory-bytes: 25769803776  # 24 GiB

# Inkling 2 Mini at reasoning effort "none": its nearest to thinking off (the template has no off switch and the
# model still reasons a little, so QualityBench runs it as "on"). The pair of the entry above (effort 0.9, the
# template default). Quality only: the speed passes are the entry above's.
homelab-vllm-inkling2-mini-dspark-effort-none:
  inherits: homelab-vllm-inkling2-mini-dspark
  client:
    passes:
      - {name: quality, quality: {thinking: ["on"], thinking_max_tokens: 32768, preflight_retry: true, reply_window: 3600,
                                  tasks: {gsm8k: full, ifeval: full, mmlu_pro: full, humaneval: full, mbpp: full, lcb: full, logprobs: full}}}
  server:
    argv:
      --default-chat-template-kwargs: '{"reasoning_effort": "none"}'

