# =============================================================================
# Homelab — image generation (text-to-image)
#
#   homelab-flux-image      HF diffusers FLUX.1-schnell (off: bf16 does not fit 32 GB)
#   homelab-comfyui-*       ComfyUI workflows: FLUX schnell / dev fp8, Z-Image,
#                          Krea 2, Pony v6
#   homelab-omni-*          vLLM-Omni: the same models on the other engine
#   Larger models (128 GB unified-memory card, e.g. DGX Spark):
#     FLUX series      FLUX.1 dev bf16 -> FLUX.2 dev -> FLUX 3 Klein, ComfyUI, matched settings
#     Qwen-Image 2.1   ComfyUI bf16 / int8, vLLM-Omni bf16 / fp8
#     HunyuanImage 3   vLLM-Omni AutoRound MXFP4 / MXFP8 (bf16 does not fit: 169 GB)
#
# Every entry uses 1024x1024 and the shared prompts and seeds (benchmate.prompts: generation i uses
# prompt i and seed i in every model and engine). "matched" entries use the FLUX.1 dev settings
# (20 steps, guidance 3.5 where the model takes one, no prompt upsampler); "-rec" entries use the
# model's own recommended settings. Steps and guidance go in through --set (__STEPS__ / __GUIDANCE__):
# ComfyUI casts the strings to INT / FLOAT when it validates the prompt.
# enabled: false = needs a change first (see the entry's NEEDS line or comment).
# ComfyUI downloads its files at run time (no prepare step): pre-fetch the big ones with `hf download`.
# =============================================================================

include:
  - _base.yaml

homelab-flux-image:
  inherits: _inference
  tags:
    - image
    - monogpu
  # bf16 schnell (~33 GB weights) OOMs a 32 GB card at load time, bs=1 —
  # autosizer cannot help (fails before the first step). The fp8 Flux path
  # is homelab-comfyui-flux-schnell (17 GB). Re-enable with an fp8 loader.
  enabled: false
  max_duration: 1800
  voir:
    options:
      stop: 60
      skip: 10
  plan:
    method: per_gpu
  # schnell is the ungated FLUX (Apache-2); the dev variant is gated.
  url: https://huggingface.co/black-forest-labs/FLUX.1-schnell
  argv:
    --mode: flux
    --model: black-forest-labs/FLUX.1-schnell
    --dataset: jackyhate/text-to-image-2M
    --batch_size: 1

homelab-comfyui-flux-schnell:
  name: homelab-comfyui-flux-schnell
  tags:
    - image
  inherits: _comfyui
  enabled: true  # bring-up; flux-dev/z-image off until this passes
  weight: 1
  argv:
    --workflow: workflows/flux_schnell_fp8.json
    --model: checkpoints:Comfy-Org/FLUX1-schnell:flux1-schnell-fp8.safetensors
    --set: CKPT=flux1-schnell-fp8.safetensors

homelab-comfyui-flux-dev-fp8:
  name: homelab-comfyui-flux-dev-fp8
  tags:
    - image
  inherits: _comfyui
  enabled: true
  weight: 1
  argv:
    --workflow: workflows/flux_dev_fp8.json
    --model: checkpoints:Comfy-Org/flux1-dev:flux1-dev-fp8.safetensors
    --set: CKPT=flux1-dev-fp8.safetensors

homelab-comfyui-z-image-turbo:
  name: homelab-comfyui-z-image-turbo
  tags:
    - image
  inherits: _comfyui
  enabled: true
  weight: 1
  argv:
    --workflow: workflows/z_image_turbo.json
    --model:
      - diffusion_models:Comfy-Org/z_image_turbo:split_files/diffusion_models/z_image_turbo_bf16.safetensors
      - text_encoders:Comfy-Org/z_image_turbo:split_files/text_encoders/qwen_3_4b.safetensors
      - vae:Comfy-Org/z_image_turbo:split_files/vae/ae.safetensors
      - loras:Comfy-Org/z_image_turbo:split_files/loras/z_image_turbo_distill_patch_lora_bf16.safetensors
    --set:
      - UNET=z_image_turbo_bf16.safetensors
      - TE=qwen_3_4b.safetensors
      - VAE=ae.safetensors
      - LORA=z_image_turbo_distill_patch_lora_bf16.safetensors

homelab-comfyui-krea2-turbo:
  name: homelab-comfyui-krea2-turbo
  tags:
    - image
  inherits: _comfyui
  enabled: true
  weight: 1
  argv:
    --workflow: workflows/krea2_turbo_fp8.json
    --model:
      - diffusion_models:Comfy-Org/Krea-2:diffusion_models/krea2_turbo_fp8_scaled.safetensors
      - text_encoders:Comfy-Org/Krea-2:text_encoders/qwen3vl_4b_fp8_scaled.safetensors
      - vae:Comfy-Org/Krea-2:vae/qwen_image_vae.safetensors
    --set:
      - UNET=krea2_turbo_fp8_scaled.safetensors
      - TE=qwen3vl_4b_fp8_scaled.safetensors
      - VAE=qwen_image_vae.safetensors

homelab-comfyui-pony-v6:
  name: homelab-comfyui-pony-v6
  tags:
    - image
  inherits: _comfyui
  enabled: false  # aging SDXL line, low adoption now
  weight: 1
  argv:
    --workflow: workflows/pony_v6.json
    --model: checkpoints:LyliaEngine/Pony_Diffusion_V6_XL:ponyDiffusionV6XL_v6StartWithThisOne.safetensors
    --set: CKPT=ponyDiffusionV6XL_v6StartWithThisOne.safetensors

# -----------------------------------------------------------------------------
# vLLM-Omni (_omni): the ComfyUI models above on the same settings (resolution, steps, guidance),
# so the two engines compare directly. One card: FP8 weights (--quantization fp8) for FLUX, which does
# not fit 32 GB in BF16; multigpu.yaml shards them in BF16 instead.
# FLUX repos are gated (accept the license, HF_TOKEN).
# -----------------------------------------------------------------------------

homelab-omni-flux-dev-fp8:
  inherits: _omni
  enabled: true
  weight: 1
  tags:
    - image
  url: https://huggingface.co/black-forest-labs/FLUX.1-dev
  server:
    argv:
      black-forest-labs/FLUX.1-dev: true
      --quantization: fp8
  client:
    argv:
      --task: t2i
      --width: 1024
      --height: 1024
      --steps: 20
      # FLUX-dev is guidance-distilled: guidance_scale is its embedded guidance, no CFG pass
      --guidance: 3.5

# Lossy step caching (cache-dit: reuses DiT block outputs across steps): faster, slightly different images
homelab-omni-flux-dev-fp8-cachedit:
  inherits: homelab-omni-flux-dev-fp8
  tags:
    - cachedit
  server:
    argv:
      --cache-backend: cache_dit

homelab-omni-flux-schnell-fp8:
  inherits: _omni
  enabled: true
  weight: 1
  tags:
    - image
  url: https://huggingface.co/black-forest-labs/FLUX.1-schnell
  server:
    argv:
      black-forest-labs/FLUX.1-schnell: true
      --quantization: fp8
  client:
    argv:
      --task: t2i
      --width: 1024
      --height: 1024
      --steps: 4
      --guidance: 0.0

homelab-omni-z-image-turbo:
  inherits: _omni
  enabled: true
  weight: 1
  tags:
    - image
  url: https://huggingface.co/Tongyi-MAI/Z-Image-Turbo
  server:
    argv:
      Tongyi-MAI/Z-Image-Turbo: true
  client:
    argv:
      --task: t2i
      --width: 1024
      --height: 1024
      --steps: 8
      --guidance: 0.0

# -----------------------------------------------------------------------------
# FLUX series: FLUX.1 dev -> FLUX.2 dev -> FLUX 3 Klein, ComfyUI, same prompt / seed /
# 1024x1024 / 20 steps / euler. The FLUX.1 dev fp8 baseline is
# homelab-comfyui-flux-dev-fp8 above (and homelab-omni-flux-dev-fp8 on vLLM-Omni).
# -----------------------------------------------------------------------------

# FLUX.1 dev in BF16 (split files): the bf16 point of the series. The transformer is already in the
# HF cache (black-forest-labs/FLUX.1-dev, from the omni benches), the VAE too (Z-Image's ae.safetensors
# is the same file); only the text encoders are new (~10 GB).
homelab-comfyui-flux1-dev-bf16:
  name: homelab-comfyui-flux1-dev-bf16
  tags:
    - image
    - flux-series
  inherits: _comfyui
  enabled: true
  weight: 1
  argv:
    --workflow: workflows/flux1_dev_bf16.json
    --model:
      - diffusion_models:black-forest-labs/FLUX.1-dev:flux1-dev.safetensors
      - text_encoders:comfyanonymous/flux_text_encoders:clip_l.safetensors
      - text_encoders:comfyanonymous/flux_text_encoders:t5xxl_fp16.safetensors
      - vae:Comfy-Org/z_image_turbo:split_files/vae/ae.safetensors
    --set:
      - UNET=flux1-dev.safetensors
      - CLIP_L=clip_l.safetensors
      - T5=t5xxl_fp16.safetensors
      - VAE=ae.safetensors

# FLUX.2 dev (32B transformer + Mistral Small 3 24B text encoder), BF16. About 100 GB of weights:
# the largest that fits. If it runs out of memory, switch TE to the fp8 encoder (the fp8 entry's).
homelab-comfyui-flux2-dev-bf16:
  name: homelab-comfyui-flux2-dev-bf16
  tags:
    - image
    - flux-series
  inherits: _comfyui
  enabled: true
  weight: 1
  max_duration: 7200
  # roughly 1.5-3 min per image here: 30 images do not fit
  voir:
    options:
      stop: 10
  argv:
    --max-steps: 11
    --workflow: workflows/flux2_dev.json
    --model:
      - diffusion_models:black-forest-labs/FLUX.2-dev:flux2-dev.safetensors
      - text_encoders:Comfy-Org/Flux-2-Dev:split_files/text_encoders/mistral_3_small_flux2_bf16.safetensors
      - vae:Comfy-Org/Flux-2-Dev:split_files/vae/flux2-vae.safetensors
    --set:
      - UNET=flux2-dev.safetensors
      - TE=mistral_3_small_flux2_bf16.safetensors
      - VAE=flux2-vae.safetensors
      - STEPS=20
      - GUIDANCE=3.5

# FLUX.2 dev at BFL's recommended settings (50 steps, guidance 4; the ComfyUI template uses 20 / 4)
homelab-comfyui-flux2-dev-bf16-rec:
  name: homelab-comfyui-flux2-dev-bf16-rec
  inherits: homelab-comfyui-flux2-dev-bf16
  voir:
    options:
      stop: 5
  argv:
    --max-steps: 6
    --set:
      - UNET=flux2-dev.safetensors
      - TE=mistral_3_small_flux2_bf16.safetensors
      - VAE=flux2-vae.safetensors
      - STEPS=50
      - GUIDANCE=4.0

# FP8: Comfy-Org's fp8mixed transformer (ComfyUI's own quant format), fp8 text encoder
homelab-comfyui-flux2-dev-fp8:
  name: homelab-comfyui-flux2-dev-fp8
  inherits: homelab-comfyui-flux2-dev-bf16
  argv:
    --model:
      - diffusion_models:Comfy-Org/Flux-2-Dev:split_files/diffusion_models/flux2_dev_fp8mixed.safetensors
      - text_encoders:Comfy-Org/Flux-2-Dev:split_files/text_encoders/mistral_3_small_flux2_fp8.safetensors
      - vae:Comfy-Org/Flux-2-Dev:split_files/vae/flux2-vae.safetensors
    --set:
      - UNET=flux2_dev_fp8mixed.safetensors
      - TE=mistral_3_small_flux2_fp8.safetensors
      - VAE=flux2-vae.safetensors
      - STEPS=20
      - GUIDANCE=3.5

# NVFP4: BFL's mixed NVFP4/BF16 transformer (ComfyUI quant format, comfy-kitchen kernels), same fp8
# text encoder as the fp8 entry, so the two differ only in the transformer
homelab-comfyui-flux2-dev-nvfp4:
  name: homelab-comfyui-flux2-dev-nvfp4
  inherits: homelab-comfyui-flux2-dev-bf16
  argv:
    --model:
      - diffusion_models:black-forest-labs/FLUX.2-dev-NVFP4:flux2-dev-nvfp4-mixed.safetensors
      - text_encoders:Comfy-Org/Flux-2-Dev:split_files/text_encoders/mistral_3_small_flux2_fp8.safetensors
      - vae:Comfy-Org/Flux-2-Dev:split_files/vae/flux2-vae.safetensors
    --set:
      - UNET=flux2-dev-nvfp4-mixed.safetensors
      - TE=mistral_3_small_flux2_fp8.safetensors
      - VAE=flux2-vae.safetensors
      - STEPS=20
      - GUIDANCE=3.5

# NVFP4, pure: BFL's all-NVFP4 transformer from the same repo (no BF16 layers; the mixed entry above keeps a small
# set of weights in BF16), same fp8 text encoder: the two NVFP4 entries differ only in those layers
homelab-comfyui-flux2-dev-nvfp4-pure:
  name: homelab-comfyui-flux2-dev-nvfp4-pure
  inherits: homelab-comfyui-flux2-dev-bf16
  argv:
    --model:
      - diffusion_models:black-forest-labs/FLUX.2-dev-NVFP4:flux2-dev-nvfp4.safetensors
      - text_encoders:Comfy-Org/Flux-2-Dev:split_files/text_encoders/mistral_3_small_flux2_fp8.safetensors
      - vae:Comfy-Org/Flux-2-Dev:split_files/vae/flux2-vae.safetensors
    --set:
      - UNET=flux2-dev-nvfp4.safetensors
      - TE=mistral_3_small_flux2_fp8.safetensors
      - VAE=flux2-vae.safetensors
      - STEPS=20
      - GUIDANCE=3.5

# FLUX 3 Klein (5.6B distilled transformer + Qwen3-VL-4B text encoder), BF16, matched settings:
# 20 steps, no prompt upsampler (as krea2 above). Distilled: no guidance, cfg 1.
# NEEDS: a ComfyUI release with FLUX 3 (released 2026-11-02; the checkout here is v0.37.0+46 of
# 2026-09-28: no CLIPLoader type "flux3", no Flux3LayoutPrompt). Rerun the FLUX.1 / FLUX.2 entries
# on the same ComfyUI so the series compares one engine version.
homelab-comfyui-flux3-klein-bf16:
  name: homelab-comfyui-flux3-klein-bf16
  tags:
    - image
    - flux-series
  inherits: _comfyui
  enabled: false
  weight: 1
  argv:
    --workflow: workflows/flux3_klein.json
    --model:
      - diffusion_models:black-forest-labs/flux-3-image-klein-comfy:diffusion_models/flux3-image-klein-bf16.safetensors
      - text_encoders:black-forest-labs/flux-3-image-klein-comfy:text_encoders/qwen3vl_4b_bf16.safetensors
      - vae:black-forest-labs/flux-3-image-klein-comfy:vae/flux2-vae.safetensors
    --set:
      - UNET=flux3-image-klein-bf16.safetensors
      - TE=qwen3vl_4b_bf16.safetensors
      - VAE=flux2-vae.safetensors
      - STEPS=20

# NVFP4 (BFL's own, the same quantization as variants/nvfp4 in black-forest-labs/flux-3-image-klein)
homelab-comfyui-flux3-klein-nvfp4:
  name: homelab-comfyui-flux3-klein-nvfp4
  inherits: homelab-comfyui-flux3-klein-bf16
  argv:
    --model:
      - diffusion_models:black-forest-labs/flux-3-image-klein-comfy:diffusion_models/flux3-image-klein-nvfp4.safetensors
      - text_encoders:black-forest-labs/flux-3-image-klein-comfy:text_encoders/qwen3vl_4b_bf16.safetensors
      - vae:black-forest-labs/flux-3-image-klein-comfy:vae/flux2-vae.safetensors
    --set:
      - UNET=flux3-image-klein-nvfp4.safetensors
      - TE=qwen3vl_4b_bf16.safetensors
      - VAE=flux2-vae.safetensors
      - STEPS=20

# Klein at BFL's recommended settings: 16 steps, prompt upsampler on (int8 upsampler, the workflows'
# default). Time per image includes the upsampler's caption.
# NEEDS: the ComfyUI update above, plus workflows/flux3_klein_pup.json: BFL's
# workflows/flux3_klein_bf16_t2i.json (flux-3-image-klein-comfy) exported in API format, with
# __PROMPT__ / __SEED__ / __UNET__ / __TE__ / __VAE__ / __PUP__ / __STEPS__ placeholders.
homelab-comfyui-flux3-klein-bf16-rec:
  name: homelab-comfyui-flux3-klein-bf16-rec
  inherits: homelab-comfyui-flux3-klein-bf16
  argv:
    --workflow: workflows/flux3_klein_pup.json
    --model:
      - diffusion_models:black-forest-labs/flux-3-image-klein-comfy:diffusion_models/flux3-image-klein-bf16.safetensors
      - text_encoders:black-forest-labs/flux-3-image-klein-comfy:text_encoders/qwen3vl_4b_bf16.safetensors
      - text_encoders:black-forest-labs/flux-3-image-klein-comfy:text_encoders/qwen3.5_9b_flux3_prompt_upsampler_int8_convrot.safetensors
      - vae:black-forest-labs/flux-3-image-klein-comfy:vae/flux2-vae.safetensors
    --set:
      - UNET=flux3-image-klein-bf16.safetensors
      - TE=qwen3vl_4b_bf16.safetensors
      - PUP=qwen3.5_9b_flux3_prompt_upsampler_int8_convrot.safetensors
      - VAE=flux2-vae.safetensors
      - STEPS=16

# -----------------------------------------------------------------------------
# Qwen-Image 2.1 (no CFG, prompt enhancer off). ComfyUI: Comfy-Org's repack.
# -----------------------------------------------------------------------------

homelab-comfyui-qwen-image-21-bf16:
  name: homelab-comfyui-qwen-image-21-bf16
  tags:
    - image
  inherits: _comfyui
  enabled: true
  weight: 1
  argv:
    --workflow: workflows/qwen_image_21.json
    --model:
      - diffusion_models:Comfy-Org/Qwen-Image-2.1:diffusion_models/qwen_image_2.1_bf16.safetensors
      - text_encoders:Comfy-Org/Qwen-Image-2.1:text_encoders/qwen3vl_8b_bf16.safetensors
      - vae:Comfy-Org/Qwen-Image-2.1:vae/qwen_image_2.1_vae_bf16.safetensors
    --set:
      - UNET=qwen_image_2.1_bf16.safetensors
      - TE=qwen3vl_8b_bf16.safetensors
      - VAE=qwen_image_2.1_vae_bf16.safetensors
      - STEPS=20

# Qwen's recommended 40 steps (the ComfyUI template uses 25)
homelab-comfyui-qwen-image-21-bf16-rec:
  name: homelab-comfyui-qwen-image-21-bf16-rec
  inherits: homelab-comfyui-qwen-image-21-bf16
  argv:
    --set:
      - UNET=qwen_image_2.1_bf16.safetensors
      - TE=qwen3vl_8b_bf16.safetensors
      - VAE=qwen_image_2.1_vae_bf16.safetensors
      - STEPS=40

# int8 (ComfyUI's convrot int8 transformer; there is no ComfyUI-format fp8 or nvfp4 build)
homelab-comfyui-qwen-image-21-int8:
  name: homelab-comfyui-qwen-image-21-int8
  inherits: homelab-comfyui-qwen-image-21-bf16
  argv:
    --model:
      - diffusion_models:Comfy-Org/Qwen-Image-2.1:diffusion_models/qwen_image_2.1_int8_convrot.safetensors
      - text_encoders:Comfy-Org/Qwen-Image-2.1:text_encoders/qwen3vl_8b_bf16.safetensors
      - vae:Comfy-Org/Qwen-Image-2.1:vae/qwen_image_2.1_vae_bf16.safetensors
    --set:
      - UNET=qwen_image_2.1_int8_convrot.safetensors
      - TE=qwen3vl_8b_bf16.safetensors
      - VAE=qwen_image_2.1_vae_bf16.safetensors
      - STEPS=20

# vLLM-Omni (QwenImage21Pipeline): one 33 GB snapshot for bf16 and online fp8
homelab-omni-qwen-image-21-bf16:
  inherits: _omni
  enabled: true
  weight: 1
  tags:
    - image
  url: https://huggingface.co/Qwen/Qwen-Image-2.1
  server:
    argv:
      Qwen/Qwen-Image-2.1: true
  client:
    argv:
      --task: t2i
      --width: 1024
      --height: 1024
      --steps: 20

homelab-omni-qwen-image-21-fp8:
  inherits: homelab-omni-qwen-image-21-bf16
  server:
    argv:
      --quantization: fp8

# -----------------------------------------------------------------------------
# HunyuanImage 3.0 (80B MoE, ~13B active): BF16 is 169 GB and does not fit. The quantized builds
# that load in an installed engine are Intel's AutoRound ones (vLLM-Omni INC path: CUTLASS / Marlin
# MXFP4 MoE on CUDA). They are the Instruct-Distil model (8 steps by default), not the base one.
# DiT-only pipeline (plain text-to-image, no AR "think / recaption" stage).
# NEEDS: a one-device deploy file: the stock hunyuan_image3_dit.yaml wants 4 GPUs (TP=4 + EP).
# Draft: benchmarks/omni/deploy/hunyuan_image3_dit_1gpu.yaml (not added yet).
# -----------------------------------------------------------------------------

homelab-omni-hunyuan-image3-mxfp4:
  inherits: _omni
  enabled: false
  weight: 1
  max_duration: 5400
  tags:
    - image
  url: https://huggingface.co/intel-ai/HunyuanImage-3.0-Instruct-Distil-MXFP4-Mixed-AutoRound
  voir:
    options:
      stop: 10
  server:
    argv:
      intel-ai/HunyuanImage-3.0-Instruct-Distil-MXFP4-Mixed-AutoRound: true
      --deploy-config: deploy/hunyuan_image3_dit_1gpu.yaml
      --trust-remote-code: true
  client:
    argv:
      --task: t2i
      --width: 1024
      --height: 1024
      --steps: 20
      --max-steps: 11

# its own setting: 8 steps (generation_config diff_infer_steps)
homelab-omni-hunyuan-image3-mxfp4-rec:
  inherits: homelab-omni-hunyuan-image3-mxfp4
  client:
    argv:
      --steps: 8

# MXFP8 (91 GB): much closer to BF16 than the MXFP4 build (Intel's card: MXFP4 SSIM 0.67 vs BF16),
# but near the memory limit
# (not inherited from the mxfp4 entry: omni/prepare.py takes the first non-flag argv value with a "/"
# as the model, so the model must come before --deploy-config's path)
homelab-omni-hunyuan-image3-mxfp8:
  inherits: _omni
  enabled: false
  weight: 1
  max_duration: 5400
  tags:
    - image
  url: https://huggingface.co/intel-ai/HunyuanImage-3.0-Instruct-Distil-MXFP8-AutoRound
  voir:
    options:
      stop: 10
  server:
    argv:
      intel-ai/HunyuanImage-3.0-Instruct-Distil-MXFP8-AutoRound: true
      --deploy-config: deploy/hunyuan_image3_dit_1gpu.yaml
      --trust-remote-code: true
  client:
    argv:
      --task: t2i
      --width: 1024
      --height: 1024
      --steps: 20
      --max-steps: 11
