# =============================================================================
# Experimental benchmarks (Open-Instruct, TorchTitan, vLLM+Ray)
#
# Tuned for limited machine time: smokes off after bring-up, small models off,
# focus on large-model training + MoE serving.
#
# Fix-loop status (2026-08-08):
#
# PASSED — disabled (enabled: false) after clean runs:
#   - openinstruct-sft-70b-gpus
#   - torchtitan-qwen3-30b-pretrain
#   - torchtitan-qwen3-30b-sft
#
# WIP — inference first (serving benches run before torchtitan in include order):
#   - serving-moe-kimi-k3-mxfp4-gpus   (aiter 0.1.19.post2; exclude f_b_proj from ptpc_fp8)
#   - serving-moe-glm52-fp8-gpus       (ATOM + --enforce-eager; torch.compile workaround)
#   - serving-moe-glm52-mxfp4-gpus     (ATOM + --enforce-eager)
#
# PAUSED — torchtitan GLM-5 (re-enable after serving passes):
#   - torchtitan-glm5-pretrain   (744B MoE; EP=8, auto dp_shard, comm timeout 1800s)
#   - torchtitan-glm5-sft        (same + MoE HF checkpoint adapter)
#
# When all 8 pass individually, re-enable everything for one final clean run.
# =============================================================================

include:
  - ../benchmarks/vllm/dev.yaml
  - ../benchmarks/openinstruct/dev.yaml
  - ../benchmarks/torchtitan/dev.yaml

# -----------------------------------------------------------------------------
# Open-Instruct (AllenAI SFT)
# -----------------------------------------------------------------------------

openinstruct-sft-1b:
  enabled: false
  weight: 0.0

