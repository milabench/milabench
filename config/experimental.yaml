# =============================================================================
# Experimental benchmarks (Open-Instruct, TorchTitan, vLLM+Ray)
#
# Tuned for limited machine time: smokes off after bring-up, small models off,
# focus on large-model training + MoE serving.
#
# Fix-loop status (2026-08-10):
# Bring-up loop for new torchtitan flavors (mistral/olmo/mixtral/olmoe/gemma/deepseek).
# Old qwen3-30b disabled; final run enables all passing new flavors + serving/openinstruct.
# =============================================================================

include:
  - ../benchmarks/vllm/dev.yaml
  - ../benchmarks/openinstruct/dev.yaml
  - ../benchmarks/torchtitan/dev.yaml

# -----------------------------------------------------------------------------
# Open-Instruct (AllenAI SFT)
# -----------------------------------------------------------------------------

openinstruct-sft-1b:
  enabled: false
  weight: 0.0

openinstruct-sft-3b:
  enabled: false
  weight: 0.0

openinstruct-sft-8b:
  enabled: false
  weight: 0.0

openinstruct-sft-8b-gpus:
  enabled: false
  weight: 0.0

openinstruct-sft-single:
  enabled: false
  weight: 0.0

openinstruct-sft-gpus:
  enabled: false
  weight: 0.0

openinstruct-sft-70b-gpus:
  enabled: true
  weight: 1.0
  definition: ../benchmarks/openinstruct

# -----------------------------------------------------------------------------
# vLLM + Ray (single-node smoke + multi-node MoE) — run first
# -----------------------------------------------------------------------------

vllm-ray-smoke:
  enabled: false
  weight: 0.0

serving-moe-kimi-k3-mxfp4-gpus:
  enabled: true
  weight: 1.0
  definition: ../benchmarks/vllm

serving-moe-glm52-fp8-gpus:
  enabled: true
  weight: 1.0
  definition: ../benchmarks/vllm

serving-moe-glm52-mxfp4-gpus:
  enabled: true
  weight: 1.0
  definition: ../benchmarks/vllm

vllm-moe-kimi-k3-2.8t-mxfp4-nodes:
  enabled: false
  weight: 0.0

vllm-moe-glm52-744b-bf16-nodes:
  enabled: false
  weight: 0.0

vllm-moe-glm52-744b-fp8-nodes:
  enabled: false
  weight: 0.0

vllm-single:
  enabled: false
  weight: 0.0

vllm-dense-physics-gpus:
  enabled: false
  weight: 0.0

vllm-moe-code-gpus:
  enabled: false
  weight: 0.0

vllm-whisper-gpus:
  enabled: false
  weight: 0.0

